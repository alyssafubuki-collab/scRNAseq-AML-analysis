name: Resume scAnnoX analysis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  resume-scannox:

    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. SETUP R
      # ============================================================

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true


      # ============================================================
      # 3. SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libxml2 \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpng-dev \
            libjpeg-dev \
            libtiff-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libgit2-dev \
            libglpk-dev \
            libgsl-dev


      # ============================================================
      # 4. INSTALL BiocManager
      # ============================================================

      - name: Install BiocManager
        run: |

          Rscript -e '

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          if (!requireNamespace(
            "BiocManager",
            quietly = TRUE
          )) {

            install.packages(
              "BiocManager",
              repos = "https://cloud.r-project.org"
            )

          }

          cat(
            "BiocManager ready.\n"
          )

          '


      # ============================================================
      # 5. INSTALL ONLY THE PACKAGES REQUIRED BY scAnnoX
      # ============================================================

      - name: Install scAnnoX CRAN dependencies
        run: |

          Rscript -e '

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          packages <- c(
            "Seurat",
            "SeuratObject",
            "dplyr",
            "HGNChelper",
            "future"
          )

          missing <- packages[
            !vapply(
              packages,
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ]

          if (length(missing) > 0) {

            cat(
              "Installing CRAN dependencies:\n"
            )

            print(missing)

            install.packages(
              missing,
              repos = "https://cloud.r-project.org",
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )

          }

          '


      # ============================================================
      # 6. SINGLECELL / SINGLE-R
      # ============================================================

      - name: Install SingleR dependencies
        run: |

          Rscript -e '

          packages <- c(
            "SingleCellExperiment",
            "SingleR"
          )

          missing <- packages[
            !vapply(
              packages,
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ]

          if (length(missing) > 0) {

            BiocManager::install(
              missing,
              ask = FALSE,
              update = FALSE
            )

          }

          '


      # ============================================================
      # 7. INSTALL scSorter
      #
      # CRAN no longer exposes it through the normal package index.
      # Install official archived version 0.0.2.
      # ============================================================

      - name: Install scSorter
        run: |

          if ! Rscript -e 'quit(status = ifelse(requireNamespace("scSorter", quietly = TRUE), 0, 1))'
          then

            echo "Installing scSorter 0.0.2 from CRAN archive..."

            curl -L \
              --fail \
              --retry 3 \
              "https://cran.r-project.org/src/contrib/Archive/scSorter/scSorter_0.0.2.tar.gz" \
              -o scSorter_0.0.2.tar.gz

            R CMD INSTALL \
              --no-multiarch \
              --with-keep.source \
              scSorter_0.0.2.tar.gz

          fi

          Rscript -e '

          if (!requireNamespace(
            "scSorter",
            quietly = TRUE
          )) {

            stop(
              "scSorter installation failed."
            )

          }

          cat(
            "scSorter version: ",
            as.character(
              packageVersion("scSorter")
            ),
            "\n"
          )

          '


      # ============================================================
      # 8. INSTALL scCATCH
      # ============================================================

      - name: Install scCATCH
        run: |

          Rscript -e '

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          if (!requireNamespace(
            "scCATCH",
            quietly = TRUE
          )) {

            install.packages(
              "scCATCH",
              repos = "https://cloud.r-project.org",
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )

          }

          if (!requireNamespace(
            "scCATCH",
            quietly = TRUE
          )) {

            stop(
              "scCATCH installation failed."
            )

          }

          '


      # ============================================================
      # 9. INSTALL scmap
      # ============================================================

      - name: Install scmap
        run: |

          Rscript -e '

          if (!requireNamespace(
            "scmap",
            quietly = TRUE
          )) {

            BiocManager::install(
              "scmap",
              ask = FALSE,
              update = FALSE
            )

          }

          if (!requireNamespace(
            "scmap",
            quietly = TRUE
          )) {

            stop(
              "scmap installation failed."
            )

          }

          '


      # ============================================================
      # 10. INSTALL CelliD
      # ============================================================

      - name: Install CelliD
        run: |

          Rscript -e '

          if (!requireNamespace(
            "CelliD",
            quietly = TRUE
          )) {

            BiocManager::install(
              "CelliD",
              ask = FALSE,
              update = FALSE
            )

          }

          if (!requireNamespace(
            "CelliD",
            quietly = TRUE
          )) {

            stop(
              "CelliD installation failed."
            )

          }

          '


      # ============================================================
      # 11. INSTALL CHETAH
      # ============================================================

      - name: Install CHETAH
        run: |

          Rscript -e '

          if (!requireNamespace(
            "CHETAH",
            quietly = TRUE
          )) {

            BiocManager::install(
              "CHETAH",
              ask = FALSE,
              update = FALSE
            )

          }

          if (!requireNamespace(
            "CHETAH",
            quietly = TRUE
          )) {

            stop(
              "CHETAH installation failed."
            )

          }

          '


      # ============================================================
      # 12. INSTALL SCINA
      #
      # SCINA 1.2.0 = archived CRAN version
      # ============================================================

      - name: Install SCINA
        run: |

          if ! Rscript -e 'quit(status = ifelse(requireNamespace("SCINA", quietly = TRUE), 0, 1))'
          then

            echo "Installing SCINA 1.2.0..."

            curl -L \
              --fail \
              --retry 3 \
              "https://cran.r-project.org/src/contrib/Archive/SCINA/SCINA_1.2.0.tar.gz" \
              -o SCINA_1.2.0.tar.gz

            R CMD INSTALL \
              --no-multiarch \
              --with-keep.source \
              SCINA_1.2.0.tar.gz

          fi

          Rscript -e '

          if (!requireNamespace(
            "SCINA",
            quietly = TRUE
          )) {

            stop(
              "SCINA installation failed."
            )

          }

          cat(
            "SCINA version: ",
            as.character(
              packageVersion("SCINA")
            ),
            "\n"
          )

          '


      # ============================================================
      # 13. INSTALL scibetR
      # ============================================================

      - name: Install scibetR
        run: |

          if ! Rscript -e 'quit(status = ifelse(requireNamespace("scibetR", quietly = TRUE), 0, 1))'
          then

            echo "Installing scibetR..."

            curl -L \
              --fail \
              --retry 3 \
              -H "Authorization:" \
              -H "X-GitHub-Api-Version:" \
              "https://github.com/zwj-tina/scibetR/archive/refs/heads/master.tar.gz" \
              -o scibetR.tar.gz

            rm -rf scibetR-src

            mkdir -p scibetR-src

            tar -xzf scibetR.tar.gz \
              --strip-components=1 \
              -C scibetR-src

            R CMD INSTALL \
              --no-multiarch \
              --with-keep.source \
              scibetR-src

          fi

          Rscript -e '

          if (!requireNamespace(
            "scibetR",
            quietly = TRUE
          )) {

            stop(
              "scibetR installation failed."
            )

          }

          '


      # ============================================================
      # 14. VERIFY EVERYTHING BEFORE INSTALLING scAnnoX
      # ============================================================

      - name: Verify scAnnoX dependencies
        run: |

          Rscript -e '

          required <- c(
            "Seurat",
            "SeuratObject",
            "dplyr",
            "HGNChelper",
            "future",
            "SingleCellExperiment",
            "SingleR",
            "scSorter",
            "scCATCH",
            "scibetR",
            "scmap",
            "CelliD",
            "CHETAH",
            "SCINA"
          )

          status <- vapply(
            required,
            requireNamespace,
            logical(1),
            quietly = TRUE
          )

          cat("\nPackage status:\n\n")

          for (i in seq_along(required)) {

            cat(
              required[i],
              ": ",
              ifelse(
                status[i],
                "OK",
                "MISSING"
              ),
              "\n",
              sep = ""
            )

          }

          missing <- required[!status]

          if (length(missing) > 0) {

            stop(
              "\nMissing packages: ",
              paste(
                missing,
                collapse = ", "
              )
            )

          }

          cat(
            "\nAll scAnnoX dependencies are installed.\n"
          )

          '


      # ============================================================
      # 15. INSTALL YOUR MODIFIED scAnnoX
      #
      # IMPORTANT:
      # This is YOUR modified copy already stored in:
      #
      # files/external/scAnnoX/
      #
      # We do NOT modify it here.
      # ============================================================

      - name: Install modified scAnnoX
        run: |

          echo "Checking local scAnnoX source..."

          test -f \
            files/external/scAnnoX/DESCRIPTION

          test -f \
            files/external/scAnnoX/NAMESPACE

          test -d \
            files/external/scAnnoX/R

          echo ""
          echo "Installing modified local scAnnoX..."

          R CMD INSTALL \
            --no-multiarch \
            --with-keep.source \
            files/external/scAnnoX


      # ============================================================
      # 16. VERIFY scAnnoX
      # ============================================================

      - name: Verify scAnnoX
        run: |

          Rscript -e '

          if (!requireNamespace(
            "scAnnoX",
            quietly = TRUE
          )) {

            stop(
              "scAnnoX could not be loaded."
            )

          }

          library(scAnnoX)

          required_functions <- c(
            "autoAnnoTools",
            "annoResult",
            "findMarkerToolsForSc"
          )

          missing <- required_functions[
            !vapply(
              required_functions,
              exists,
              logical(1),
              where = asNamespace("scAnnoX"),
              inherits = FALSE
            )
          ]

          if (length(missing) > 0) {

            stop(
              "Missing scAnnoX functions: ",
              paste(
                missing,
                collapse = ", "
              )
            )

          }

          cat(
            "\nscAnnoX successfully installed.\n"
          )

          cat(
            "Version: ",
            as.character(
              packageVersion("scAnnoX")
            ),
            "\n"
          )

          cat(
            "Required functions available.\n"
          )

          '


      # ============================================================
      # 17. CHECK PREVIOUS ANALYSIS OBJECTS
      #
      # We do NOT rerun steps 01-07.
      # ============================================================

      - name: Check previous analysis results
        run: |

          echo "Checking existing analysis objects..."

          test -f \
            results/objects/05_integrated.rds

          echo "05_integrated.rds found."

          echo "Existing results:"

          find results \
            -maxdepth 3 \
            -type f \
            | sort


      # ============================================================
      # 18. RUN scAnnoX
      # ============================================================

      - name: Run scAnnoX annotation
        run: |

          Rscript \
            scripts/08_annotation_scAnnoX.R


      # ============================================================
      # 19. COMPARE ANNOTATIONS
      # ============================================================

      - name: Compare annotation methods
        run: |

          Rscript \
            scripts/09_compare_annotations.R


      # ============================================================
      # 20. DIFFERENTIAL EXPRESSION
      # ============================================================

      - name: Differential expression
        run: |

          Rscript \
            scripts/10_differential_expression.R


      # ============================================================
      # 21. FINAL FIGURES
      # ============================================================

      - name: Generate final figures
        run: |

          Rscript \
            scripts/11_final_figures.R


      # ============================================================
      # 22. COMMIT RESULTS
      # ============================================================

      - name: Commit results
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            results/ \
            figures/ \
            docs/

          if git diff --cached --quiet
          then

            echo "No new results to commit."

          else

            git commit \
              -m "Resume AML scRNA-seq analysis with scAnnoX"

            git push

          fi

name: Run AML scRNA-seq analysis

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  analysis:

    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. R SETUP
      # ============================================================

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      # ============================================================
      # 3. SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpng-dev \
            libjpeg-dev \
            libtiff-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libgit2-dev

      # ============================================================
      # 4. BIOCONDUCTOR
      # ============================================================

      - name: Install BiocManager
        run: |
          Rscript -e '
          install.packages(
            "BiocManager",
            repos = "https://cloud.r-project.org"
          )
          '

      # ============================================================
      # 5. CRAN PACKAGES
      # ============================================================

      - name: Install CRAN packages
        run: |
          Rscript -e '
          install.packages(
            c(
              "Seurat",
              "SeuratObject",
              "ggplot2",
              "dplyr",
              "data.table",
              "patchwork",
              "Matrix",
              "remotes"
            ),
            repos = "https://cloud.r-project.org"
          )
          '

      # ============================================================
      # 6. BIOCONDUCTOR PACKAGES
      # ============================================================

      - name: Install Bioconductor packages
        run: |
          Rscript -e '
          BiocManager::install(
            c(
              "SingleR",
              "celldex",
              "scuttle",
              "SummarizedExperiment"
            ),
            ask = FALSE,
            update = FALSE
          )
          '

      # ============================================================
      # 7. INSTALL scPred DEPENDENCIES
      #
      # scPred uses the legacy HarmonyMatrix API.
      # Current Harmony versions no longer export HarmonyMatrix.
      # Therefore Harmony 1.2.4 is installed explicitly below.
      # ============================================================

      - name: Install scPred dependencies
        run: |
          Rscript -e '
          install.packages(
            c(
              "ggbeeswarm",
              "MLmetrics",
              "caret",
              "kernlab",
              "pROC"
            ),
            repos = "https://cloud.r-project.org",
            dependencies = TRUE
          )
          '

      # ============================================================
      # 7b. INSTALL HARMONY DEPENDENCY
      # ============================================================

      - name: Install Harmony dependencies
        run: |
          Rscript -e '
          install.packages(
            "RhpcBLASctl",
            repos = "https://cloud.r-project.org"
          )
          '

      # ============================================================
      # 7c. INSTALL COMPATIBLE HARMONY VERSION
      # ============================================================

      - name: Install Harmony 1.2.4
        run: |
          curl -L \
            --fail \
            --retry 3 \
            "https://cran.r-project.org/src/contrib/Archive/harmony/harmony_1.2.4.tar.gz" \
            -o harmony_1.2.4.tar.gz

          R CMD INSTALL \
            --no-multiarch \
            --with-keep.source \
            harmony_1.2.4.tar.gz

          Rscript -e '
          library(harmony)

          if (!"HarmonyMatrix" %in% getNamespaceExports("harmony")) {
            stop(
              "HarmonyMatrix is not exported by installed Harmony."
            )
          }

          cat(
            "Harmony version:",
            as.character(packageVersion("harmony")),
            "\n"
          )

          cat("HarmonyMatrix available: TRUE\n")
          '

      # ============================================================
      # 8. INSTALL scPred
      #
      # Do NOT use remotes::install_github().
      # GitHub authentication caused HTTP 401 errors.
      # The public archive is downloaded with curl and installed
      # locally with R CMD INSTALL.
      # ============================================================

      - name: Install scPred
        run: |
          curl -L \
            --fail \
            --retry 3 \
            -H "Authorization:" \
            -H "X-GitHub-Api-Version:" \
            "https://github.com/powellgenomicslab/scPred/archive/refs/heads/master.tar.gz" \
            -o scPred.tar.gz

          mkdir -p scPred-src

          tar -xzf scPred.tar.gz \
            --strip-components=1 \
            -C scPred-src

          R CMD INSTALL \
            --no-multiarch \
            --with-keep.source \
            scPred-src

      # ============================================================
      # 9. TEST scPred
      # ============================================================

      - name: Test scPred
        run: |
          Rscript -e '
          library(scPred)

          cat(
            "scPred version:",
            as.character(packageVersion("scPred")),
            "\n"
          )

          cat("scPred loaded successfully.\n")
          '
      # ============================================================
      # 10. INSTALL scAnnoX
      #
      # scAnnoX has an outdated DESCRIPTION declaring several
      # annotation packages and devtools as mandatory dependencies.
      #
      # We keep the original scAnnoX source in the repository,
      # but remove devtools from runtime dependencies because it is
      # only an installation tool.
      #
      # The actual annotation packages used by scAnnoX are installed
      # explicitly below.
      # ============================================================

      - name: Install scAnnoX dependencies
        run: |
          echo "Installing scAnnoX dependencies..."

          Rscript -e '
          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          cran_pkgs <- c(
            "HGNChelper",
            "devtools",
            "scSorter",
            "SCINA"
          )

          missing <- cran_pkgs[
            !vapply(
              cran_pkgs,
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ]

          if (length(missing) > 0) {

            cat(
              "Installing:",
              paste(missing, collapse = ", "),
              "\n"
            )

            install.packages(
              missing,
              dependencies = TRUE
            )

          } else {

            cat("All CRAN dependencies already installed.\n")

          }
          '

          echo ""
          echo "Installing scmap..."

          Rscript -e '
          if (!requireNamespace("scmap", quietly = TRUE)) {

            BiocManager::install(
              "scmap",
              ask = FALSE,
              update = FALSE
            )

          }
          '

          echo ""
          echo "Installing CelliD..."

          Rscript -e '
          if (!requireNamespace("CelliD", quietly = TRUE)) {

            BiocManager::install(
              "CelliD",
              ask = FALSE,
              update = FALSE
            )

          }
          '

          echo ""
          echo "Installing CHETAH..."

          Rscript -e '
          if (!requireNamespace("CHETAH", quietly = TRUE)) {

            BiocManager::install(
              "CHETAH",
              ask = FALSE,
              update = FALSE
            )

          }
          '

          echo ""
          echo "Installing scibetR..."

          Rscript -e '
          if (!requireNamespace("scibetR", quietly = TRUE)) {

            remotes::install_github(
              "zwj-tina/scibetR",
              upgrade = "never"
            )

          }
          '

      # ============================================================
      # 10b. PATCH LOCAL scAnnoX DESCRIPTION
      #
      # devtools is not required to run scAnnoX.
      # It is only required to install it from GitHub.
      #
      # We therefore remove it from Depends before installation.
      # ============================================================

      - name: Patch scAnnoX DESCRIPTION
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("files/external/scAnnoX/DESCRIPTION")

          text = path.read_text()

          old = """Depends:
          \tR (>= 4.0.0),
          \tSeurat,
          \tdplyr,
          \tHGNChelper,
          \tdevtools
          """

          new = """Depends:
          \tR (>= 4.0.0),
          \tSeurat,
          \tdplyr,
          \tHGNChelper
          """

          if old not in text:
              raise SystemExit(
                  "Expected scAnnoX DESCRIPTION block was not found."
              )

          text = text.replace(old, new)

          path.write_text(text)

          print("scAnnoX DESCRIPTION patched successfully.")
          PY

          echo ""
          echo "Patched DESCRIPTION:"
          cat files/external/scAnnoX/DESCRIPTION

      # ============================================================
      # 10c. INSTALL LOCAL scAnnoX
      # ============================================================

      - name: Install local scAnnoX
        run: |
          echo "Checking scAnnoX source..."

          test -f files/external/scAnnoX/DESCRIPTION
          test -f files/external/scAnnoX/NAMESPACE

          echo ""
          echo "Installing local scAnnoX..."

          R CMD INSTALL \
            --no-multiarch \
            --with-keep.source \
            files/external/scAnnoX

      # ============================================================
      # 10d. TEST scAnnoX
      # ============================================================

      - name: Test scAnnoX
        run: |
          Rscript -e '
          cat("Checking scAnnoX installation...\n")

          if (!requireNamespace(
            "scAnnoX",
            quietly = TRUE
          )) {

            stop(
              "scAnnoX installation/import failed."
            )

          }

          cat(
            "scAnnoX version:",
            as.character(packageVersion("scAnnoX")),
            "\n"
          )

          cat("scAnnoX loaded successfully.\n")

          required_functions <- c(
            "autoAnnoTools",
            "annoResult",
            "findMarkerToolsForSc"
          )

          missing <- required_functions[
            !vapply(
              required_functions,
              exists,
              logical(1),
              where = asNamespace("scAnnoX"),
              inherits = FALSE
            )
          ]

          if (length(missing) > 0) {

            stop(
              "Missing scAnnoX functions: ",
              paste(missing, collapse = ", ")
            )

          }

          cat(
            "Required scAnnoX functions available: ",
            paste(required_functions, collapse = ", "),
            "\n"
          )
          '
      # ============================================================
      # 12. DOWNLOAD DATASET
      # ============================================================

      - name: Run dataset download
        run: |
          Rscript scripts/01_download_GSE145410.R

      # ============================================================
      # 13. IMPORT + QC
      # ============================================================

      - name: Run import and QC
        run: |
          Rscript scripts/02_import_and_QC.R

      # ============================================================
      # 14. NORMALIZATION + HVG
      # ============================================================

      - name: Run normalization and HVG
        run: |
          Rscript scripts/03_normalization_HVG.R

      # ============================================================
      # 15. PCA + CLUSTERING + UMAP
      # ============================================================

      - name: Run PCA clustering UMAP
        run: |
          Rscript scripts/04_PCA_clustering_UMAP.R

      # ============================================================
      # 16. SEURAT v5 CCA INTEGRATION
      # ============================================================

      - name: Run Seurat integration
        run: |
          Rscript scripts/05_Seurat5_integration.R

      # ============================================================
      # 17. SINGLE-R ANNOTATION
      # ============================================================

      - name: Run SingleR annotation
        run: |
          Rscript scripts/06_annotation_SingleR.R

      # ============================================================
      # 18. scPred ANNOTATION
      # ============================================================

      - name: Run scPred annotation
        run: |
          Rscript scripts/07_annotation_scPred.R

      # ============================================================
      # 19. scAnnoX ANNOTATION
      # ============================================================

      - name: Run scAnnoX annotation
        run: |
          Rscript scripts/08_annotation_scAnnoX.R

      # ============================================================
      # 20. COMPARE ANNOTATION METHODS
      # ============================================================

      - name: Compare annotation methods
        run: |
          Rscript scripts/09_compare_annotations.R

      # ============================================================
      # 21. DIFFERENTIAL EXPRESSION
      # ============================================================

      - name: Differential expression
        run: |
          Rscript scripts/10_differential_expression.R

      # ============================================================
      # 22. FINAL FIGURES
      # ============================================================

      - name: Generate final figures
        run: |
          Rscript scripts/11_final_figures.R

      # ============================================================
      # 23. COMMIT RESULTS
      # ============================================================

      - name: Commit analysis results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results/ docs/ figures/ 2>/dev/null || true

          if git diff --cached --quiet; then

            echo "No new results to commit."

          else

            git commit \
              -m "Run AML scRNA-seq analysis pipeline"

            git push

          fi

name: Run AML scRNA-seq analysis

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  analysis:

    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. R SETUP
      # ============================================================

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      # ============================================================
      # 3. SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libxml2 \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpng-dev \
            libjpeg-dev \
            libtiff-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libgit2-dev \
            libglpk-dev \
            libgsl-dev

      # ============================================================
      # 4. BIOCONDUCTOR
      # ============================================================

      - name: Install BiocManager
        run: |
          Rscript -e '
          install.packages(
            "BiocManager",
            repos = "https://cloud.r-project.org"
          )
          '

      # ============================================================
      # 5. CORE CRAN PACKAGES
      # ============================================================

      - name: Install core CRAN packages
        run: |
          Rscript -e '
          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          install.packages(
            c(
              "Seurat",
              "SeuratObject",
              "ggplot2",
              "dplyr",
              "data.table",
              "patchwork",
              "Matrix",
              "remotes",
              "HGNChelper",
              "future"
            ),
            dependencies = TRUE
          )
          '

      # ============================================================
      # 6. CORE BIOCONDUCTOR PACKAGES
      # ============================================================

      - name: Install core Bioconductor packages
        run: |
          Rscript -e '
          BiocManager::install(
            c(
              "SingleR",
              "celldex",
              "scuttle",
              "SummarizedExperiment",
              "SingleCellExperiment",
              "scmap",
              "CelliD",
              "CHETAH"
            ),
            ask = FALSE,
            update = FALSE
          )
          '

      # ============================================================
      # 7. scPred DEPENDENCIES
      # ============================================================

      - name: Install scPred dependencies
        run: |
          Rscript -e '
          install.packages(
            c(
              "ggbeeswarm",
              "MLmetrics",
              "caret",
              "kernlab",
              "pROC"
            ),
            repos = "https://cloud.r-project.org",
            dependencies = TRUE
          )
          '

      # ============================================================
      # 8. HARMONY DEPENDENCY
      # ============================================================

      - name: Install Harmony dependencies
        run: |
          Rscript -e '
          install.packages(
            "RhpcBLASctl",
            repos = "https://cloud.r-project.org"
          )
          '

      # ============================================================
      # 9. INSTALL HARMONY 1.2.4
      #
      # scPred requires the legacy HarmonyMatrix API.
      # ============================================================

      - name: Install Harmony 1.2.4
        run: |

          curl -L \
            --fail \
            --retry 3 \
            "https://cran.r-project.org/src/contrib/Archive/harmony/harmony_1.2.4.tar.gz" \
            -o harmony_1.2.4.tar.gz

          R CMD INSTALL \
            --no-multiarch \
            --with-keep.source \
            harmony_1.2.4.tar.gz

          Rscript -e '
          library(harmony)

          if (!"HarmonyMatrix" %in% getNamespaceExports("harmony")) {
            stop(
              "HarmonyMatrix is not exported by installed Harmony."
            )
          }

          cat(
            "Harmony version:",
            as.character(packageVersion("harmony")),
            "\n"
          )

          cat("HarmonyMatrix available: TRUE\n")
          '

      # ============================================================
      # 10. INSTALL scPred
      # ============================================================

      - name: Install scPred
        run: |

          curl -L \
            --fail \
            --retry 3 \
            -H "Authorization:" \
            -H "X-GitHub-Api-Version:" \
            "https://github.com/powellgenomicslab/scPred/archive/refs/heads/master.tar.gz" \
            -o scPred.tar.gz

          mkdir -p scPred-src

          tar -xzf scPred.tar.gz \
            --strip-components=1 \
            -C scPred-src

          R CMD INSTALL \
            --no-multiarch \
            --with-keep.source \
            scPred-src

      # ============================================================
      # 11. TEST scPred
      # ============================================================

      - name: Test scPred
        run: |
          Rscript -e '
          library(scPred)

          cat(
            "scPred version:",
            as.character(packageVersion("scPred")),
            "\n"
          )

          cat("scPred loaded successfully.\n")
          '

      # ============================================================
      # 12. INSTALL scAnnoX RUNTIME DEPENDENCIES
      #
      # We install the actual annotation tools explicitly.
      # ============================================================

      - name: Install scAnnoX runtime dependencies
        run: |

          echo "Checking scAnnoX dependencies..."

          Rscript -e '
          required <- c(
            "Seurat",
            "dplyr",
            "HGNChelper",
            "SingleCellExperiment",
            "SingleR",
            "scSorter",
            "scCATCH",
            "scibetR",
            "CHETAH",
            "scmap",
            "CelliD",
            "SCINA",
            "future"
          )

          installed <- vapply(
            required,
            requireNamespace,
            logical(1),
            quietly = TRUE
          )

          cat(
            "Already installed:\n"
          )

          print(
            required[installed]
          )

          cat(
            "\nMissing:\n"
          )

          print(
            required[!installed]
          )
          '

      # ============================================================
      # 13. INSTALL scSorter
      # ============================================================

      - name: Install scSorter
        run: |
          Rscript -e '
          if (!requireNamespace(
            "scSorter",
            quietly = TRUE
          )) {

            install.packages(
              "scSorter",
              repos = "https://cloud.r-project.org",
              dependencies = TRUE
            )

          }
          '

      # ============================================================
      # 14. INSTALL scCATCH
      # ============================================================

      - name: Install scCATCH
        run: |
          Rscript -e '
          if (!requireNamespace(
            "scCATCH",
            quietly = TRUE
          )) {

            install.packages(
              "scCATCH",
              repos = "https://cloud.r-project.org",
              dependencies = TRUE
            )

          }
          '

      # ============================================================
      # 15. INSTALL SCINA
      # ============================================================

      - name: Install SCINA
        run: |
          Rscript -e '
          if (!requireNamespace(
            "SCINA",
            quietly = TRUE
          )) {

            install.packages(
              "SCINA",
              repos = "https://cloud.r-project.org",
              dependencies = TRUE
            )

          }
          '

      # ============================================================
      # 16. INSTALL scibetR
      #
      # Direct GitHub archive download avoids GitHub authentication
      # problems encountered with remotes::install_github().
      # ============================================================

      - name: Install scibetR
        run: |

          Rscript -e '
          if (requireNamespace(
            "scibetR",
            quietly = TRUE
          )) {

            cat("scibetR already installed.\n")

          } else {

            cat("scibetR is not installed yet.\n")

          }
          '

          if ! Rscript -e 'quit(status = ifelse(requireNamespace("scibetR", quietly = TRUE), 0, 1))'
          then

            echo "Downloading scibetR source..."

            curl -L \
              --fail \
              --retry 3 \
              -H "Authorization:" \
              -H "X-GitHub-Api-Version:" \
              "https://github.com/zwj-tina/scibetR/archive/refs/heads/master.tar.gz" \
              -o scibetR.tar.gz

            mkdir -p scibetR-src

            tar -xzf scibetR.tar.gz \
              --strip-components=1 \
              -C scibetR-src

            R CMD INSTALL \
              --no-multiarch \
              --with-keep.source \
              scibetR-src

          fi

      # ============================================================
      # 17. VERIFY ALL scAnnoX DEPENDENCIES
      # ============================================================

      - name: Verify scAnnoX dependencies
        run: |

          Rscript -e '

          required <- c(
            "Seurat",
            "dplyr",
            "HGNChelper",
            "SingleCellExperiment",
            "SingleR",
            "scSorter",
            "scCATCH",
            "scibetR",
            "CHETAH",
            "scmap",
            "CelliD",
            "SCINA",
            "future"
          )

          missing <- required[
            !vapply(
              required,
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ]

          if (length(missing) > 0) {

            stop(
              "Missing scAnnoX dependencies: ",
              paste(
                missing,
                collapse = ", "
              )
            )

          }

          cat(
            "All scAnnoX runtime dependencies are available.\n"
          )

          '

      # ============================================================
      # 18. PATCH scAnnoX DESCRIPTION
      #
      # IMPORTANT:
      #
      # The original DESCRIPTION declares all historical annotation
      # packages as mandatory package-installation dependencies.
      #
      # We already installed the runtime packages explicitly.
      #
      # We therefore remove the dependency declarations from the
      # local DESCRIPTION so R CMD INSTALL does not perform another
      # dependency-resolution step.
      #
      # NAMESPACE only exports scAnnoX functions.
      # ============================================================

      - name: Patch scAnnoX DESCRIPTION
        run: |

          python3 - <<'PY'

          from pathlib import Path

          path = Path(
              "files/external/scAnnoX/DESCRIPTION"
          )

          text = path.read_text()

          start = text.index("Depends:")
          imports_start = text.index("Imports:")
          suggests_start = text.index("Suggests:")

          new_depends = """Depends:
          \tR (>= 4.0.0)
          """

          new_imports = """Imports:
          \tdplyr
          """

          text = (
              text[:start]
              + new_depends
              + new_imports
              + text[suggests_start:]
          )

          path.write_text(text)

          print(
              "scAnnoX DESCRIPTION patched successfully."
          )

          PY

          echo ""
          echo "Final scAnnoX DESCRIPTION:"
          cat files/external/scAnnoX/DESCRIPTION

      # ============================================================
      # 19. INSTALL LOCAL scAnnoX
      # ============================================================

      - name: Install local scAnnoX
        run: |

          echo "Checking scAnnoX source..."

          test -f files/external/scAnnoX/DESCRIPTION
          test -f files/external/scAnnoX/NAMESPACE

          echo ""
          echo "Installing local scAnnoX..."

          R CMD INSTALL \
            --no-multiarch \
            --with-keep.source \
            files/external/scAnnoX

      # ============================================================
      # 20. TEST scAnnoX
      # ============================================================

      - name: Test scAnnoX
        run: |

          Rscript -e '

          cat(
            "Checking scAnnoX installation...\n"
          )

          if (!requireNamespace(
            "scAnnoX",
            quietly = TRUE
          )) {

            stop(
              "scAnnoX installation/import failed."
            )

          }

          cat(
            "scAnnoX version:",
            as.character(
              packageVersion("scAnnoX")
            ),
            "\n"
          )

          required_functions <- c(
            "autoAnnoTools",
            "annoResult",
            "findMarkerToolsForSc"
          )

          missing <- required_functions[
            !vapply(
              required_functions,
              exists,
              logical(1),
              where = asNamespace("scAnnoX"),
              inherits = FALSE
            )
          ]

          if (length(missing) > 0) {

            stop(
              "Missing scAnnoX functions: ",
              paste(
                missing,
                collapse = ", "
              )
            )

          }

          cat(
            "Required scAnnoX functions available: ",
            paste(
              required_functions,
              collapse = ", "
            ),
            "\n"
          )

          cat(
            "scAnnoX loaded successfully.\n"
          )

          '

      # ============================================================
      # 21. DOWNLOAD DATASET
      # ============================================================

      - name: Run dataset download
        run: |
          Rscript scripts/01_download_GSE145410.R

      # ============================================================
      # 22. IMPORT + QC
      # ============================================================

      - name: Run import and QC
        run: |
          Rscript scripts/02_import_and_QC.R

      # ============================================================
      # 23. NORMALIZATION + HVG
      # ============================================================

      - name: Run normalization and HVG
        run: |
          Rscript scripts/03_normalization_HVG.R

      # ============================================================
      # 24. PCA + CLUSTERING + UMAP
      # ============================================================

      - name: Run PCA clustering UMAP
        run: |
          Rscript scripts/04_PCA_clustering_UMAP.R

      # ============================================================
      # 25. SEURAT v5 CCA INTEGRATION
      # ============================================================

      - name: Run Seurat integration
        run: |
          Rscript scripts/05_Seurat5_integration.R

      # ============================================================
      # 26. SINGLE-R ANNOTATION
      # ============================================================

      - name: Run SingleR annotation
        run: |
          Rscript scripts/06_annotation_SingleR.R

      # ============================================================
      # 27. scPred ANNOTATION
      # ============================================================

      - name: Run scPred annotation
        run: |
          Rscript scripts/07_annotation_scPred.R

      # ============================================================
      # 28. scAnnoX ANNOTATION
      # ============================================================

      - name: Run scAnnoX annotation
        run: |
          Rscript scripts/08_annotation_scAnnoX.R

      # ============================================================
      # 29. COMPARE ANNOTATIONS
      # ============================================================

      - name: Compare annotation methods
        run: |
          Rscript scripts/09_compare_annotations.R

      # ============================================================
      # 30. DIFFERENTIAL EXPRESSION
      # ============================================================

      - name: Differential expression
        run: |
          Rscript scripts/10_differential_expression.R

      # ============================================================
      # 31. FINAL FIGURES
      # ============================================================

      - name: Generate final figures
        run: |
          Rscript scripts/11_final_figures.R

      # ============================================================
      # 32. COMMIT RESULTS
      # ============================================================

      - name: Commit analysis results
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            results/ \
            docs/ \
            figures/ \
            files/external/scAnnoX/DESCRIPTION \
            2>/dev/null || true

          if git diff --cached --quiet
          then

            echo "No new results to commit."

          else

            git commit \
              -m "Run AML scRNA-seq analysis pipeline"

            git push

          fi

name: Run AML scRNA-seq analysis

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  analysis:

    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. R SETUP
      # ============================================================

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      # ============================================================
      # 3. SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpng-dev \
            libjpeg-dev \
            libtiff-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libgit2-dev

      # ============================================================
      # 4. BIOCONDUCTOR
      # ============================================================

      - name: Install BiocManager
        run: |
          Rscript -e '
          install.packages(
            "BiocManager",
            repos="https://cloud.r-project.org"
          )
          '

      # ============================================================
      # 5. CRAN PACKAGES
      # ============================================================

      - name: Install CRAN packages
        run: |
          Rscript -e '
          install.packages(
            c(
              "Seurat",
              "SeuratObject",
              "ggplot2",
              "dplyr",
              "data.table",
              "patchwork",
              "Matrix",
              "remotes"
            ),
            repos="https://cloud.r-project.org"
          )
          '

      # ============================================================
      # 6. BIOCONDUCTOR PACKAGES
      # ============================================================

      - name: Install Bioconductor packages
        run: |
          Rscript -e '
          BiocManager::install(
            c(
              "SingleR",
              "celldex",
              "scuttle",
              "SummarizedExperiment"
            ),
            ask=FALSE,
            update=FALSE
          )
          '

      # ============================================================
      # 7. INSTALL scPred DEPENDENCIES
      #
      # scPred uses the legacy HarmonyMatrix API.
      # Current Harmony 2.x no longer exports HarmonyMatrix.
      # Therefore Harmony 1.2.4 is installed explicitly.
      # ============================================================

      - name: Install scPred dependencies
        run: |
          Rscript -e '
          install.packages(
            c(
              "ggbeeswarm",
              "MLmetrics",
              "caret",
              "kernlab",
              "pROC"
            ),
            repos="https://cloud.r-project.org",
            dependencies=TRUE
          )
          '

       # ============================================================
      # 7b. INSTALL COMPATIBLE HARMONY VERSION
      # ============================================================

      - name: Install Harmony dependencies
        run: |
          Rscript -e '
          install.packages(
            "RhpcBLASctl",
            repos="https://cloud.r-project.org"
          )
          '

      - name: Install Harmony 1.2.4
        run: |
          curl -L \
            --fail \
            --retry 3 \
            "https://cran.r-project.org/src/contrib/Archive/harmony/harmony_1.2.4.tar.gz" \
            -o harmony_1.2.4.tar.gz

          R CMD INSTALL \
            --no-multiarch \
            --with-keep.source \
            harmony_1.2.4.tar.gz

          Rscript -e '
          library(harmony)

          if (!"HarmonyMatrix" %in% getNamespaceExports("harmony")) {
            stop("HarmonyMatrix is not exported by installed Harmony.")
          }

          cat(
            "Harmony version:",
            as.character(packageVersion("harmony")),
            "\n"
          )

          cat("HarmonyMatrix available: TRUE\n")
          '

      # ============================================================
      # 8. INSTALL scPred
      # ============================================================

      - name: Install scPred
        run: |
          curl -L \
            --fail \
            --retry 3 \
            -H "Authorization:" \
            -H "X-GitHub-Api-Version:" \
            "https://github.com/powellgenomicslab/scPred/archive/refs/heads/master.tar.gz" \
            -o scPred.tar.gz

          mkdir -p scPred-src

          tar -xzf scPred.tar.gz \
            --strip-components=1 \
            -C scPred-src

          R CMD INSTALL \
            --no-multiarch \
            --with-keep.source \
            scPred-src

      # ============================================================
      # TEST scPred
      # ============================================================

      - name: Test scPred
        run: |
          Rscript -e '
          library(scPred)

          cat(
            "scPred version:",
            as.character(packageVersion("scPred")),
            "\n"
          )

          cat("scPred loaded successfully.\n")
          '
          
      # ============================================================
      # 9. INSTALL scAnnoX
      #
      # scAnnoX is stored in:
      #
      # files/external/scAnnoX/
      # ============================================================

      - name: Install scAnnoX
        run: |
          if [ -f files/external/scAnnoX/DESCRIPTION ]; then

            Rscript -e '
            remotes::install_local(
              "files/external/scAnnoX",
              dependencies=TRUE,
              upgrade="never"
            )
            '

          else

            echo "scAnnoX directory not found."
            echo "Expected:"
            echo "files/external/scAnnoX/DESCRIPTION"
            echo ""
            echo "Repository contents:"
            ls -la
            echo ""
            echo "files/external directory:"
            ls -la files/external 2>/dev/null || true

            exit 1

          fi

      # ============================================================
      # 10. TEST scAnnoX
      # ============================================================

      - name: Test scAnnoX
        run: |
          Rscript -e '
          if (requireNamespace("scAnnoX", quietly=TRUE)) {
            cat(
              "scAnnoX installed successfully. Version:",
              as.character(packageVersion("scAnnoX")),
              "\n"
            )
          } else {
            stop("scAnnoX could not be loaded.")
          }
          '

      # ============================================================
      # 11. DOWNLOAD DATASET
      # ============================================================

      - name: Run dataset download
        run: |
          Rscript scripts/01_download_GSE145410.R

      # ============================================================
      # 12. IMPORT + QC
      # ============================================================

      - name: Run import and QC
        run: |
          Rscript scripts/02_import_and_QC.R

      # ============================================================
      # 13. NORMALIZATION + HVG
      # ============================================================

      - name: Run normalization and HVG
        run: |
          Rscript scripts/03_normalization_HVG.R

      # ============================================================
      # 14. PCA + CLUSTERING + UMAP
      # ============================================================

      - name: Run PCA clustering UMAP
        run: |
          Rscript scripts/04_PCA_clustering_UMAP.R

      # ============================================================
      # 15. SEURAT v5 CCA INTEGRATION
      # ============================================================

      - name: Run Seurat integration
        run: |
          Rscript scripts/05_Seurat5_integration.R

      # ============================================================
      # 16. SINGLE-R ANNOTATION
      # ============================================================

      - name: Run SingleR annotation
        run: |
          Rscript scripts/06_annotation_SingleR.R

      # ============================================================
      # 17. scPred ANNOTATION
      # ============================================================

      - name: Run scPred annotation
        run: |
          Rscript scripts/07_annotation_scPred.R

      # ============================================================
      # 18. scAnnoX ANNOTATION
      # ============================================================

      - name: Run scAnnoX annotation
        run: |
          Rscript scripts/08_annotation_scAnnoX.R

      # ============================================================
      # 19. COMPARE ANNOTATION METHODS
      # ============================================================

      - name: Compare annotation methods
        run: |
          Rscript scripts/09_compare_annotations.R

      # ============================================================
      # 20. DIFFERENTIAL EXPRESSION
      # ============================================================

      - name: Differential expression
        run: |
          Rscript scripts/10_differential_expression.R

      # ============================================================
      # 21. FINAL FIGURES
      # ============================================================

      - name: Generate final figures
        run: |
          Rscript scripts/11_final_figures.R

      # ============================================================
      # 22. COMMIT RESULTS
      # ============================================================

      - name: Commit analysis results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results/ docs/ figures/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No new results to commit."
          else
            git commit -m "Run AML scRNA-seq analysis pipeline"
            git push
          fi

name: Run AML scRNA-seq analysis

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  analysis:

    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. R SETUP
      # ============================================================

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2


      # ============================================================
      # 3. SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libxml2 \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpng-dev \
            libjpeg-dev \
            libtiff-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libgit2-dev \
            libglpk-dev \
            libgsl-dev


      # ============================================================
      # 4. BIOCONDUCTOR
      # ============================================================

      - name: Install BiocManager
        run: |

          Rscript -e '
          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          if (!requireNamespace(
            "BiocManager",
            quietly = TRUE
          )) {

            install.packages(
              "BiocManager",
              repos = "https://cloud.r-project.org"
            )

          }

          cat(
            "BiocManager version:",
            as.character(
              packageVersion("BiocManager")
            ),
            "\n"
          )
          '


      # ============================================================
      # 5. CORE CRAN PACKAGES
      #
      # IMPORTANT:
      # Do NOT use dependencies = TRUE here.
      #
      # This avoids installing a huge number of optional packages
      # such as DESeq2, monocle, rtracklayer, etc.
      # ============================================================

      - name: Install core CRAN packages
        run: |

          Rscript -e '

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          cran <- c(
            "Seurat",
            "SeuratObject",
            "ggplot2",
            "dplyr",
            "data.table",
            "patchwork",
            "Matrix",
            "remotes",
            "HGNChelper",
            "future"
          )

          missing <- cran[
            !vapply(
              cran,
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ]

          if (length(missing) > 0) {

            cat(
              "Installing missing CRAN packages:\n"
            )

            print(missing)

            install.packages(
              missing,
              repos = "https://cloud.r-project.org",
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )

          } else {

            cat(
              "All core CRAN packages already installed.\n"
            )

          }

          cat(
            "Core CRAN installation completed.\n"
          )
          '


      # ============================================================
      # 6. CORE BIOCONDUCTOR PACKAGES
      # ============================================================

      - name: Install core Bioconductor packages
        run: |

          Rscript -e '

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          packages <- c(
            "SingleR",
            "celldex",
            "scuttle",
            "SummarizedExperiment",
            "SingleCellExperiment"
          )

          missing <- packages[
            !vapply(
              packages,
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ]

          if (length(missing) > 0) {

            cat(
              "Installing Bioconductor packages:\n"
            )

            print(missing)

            BiocManager::install(
              missing,
              ask = FALSE,
              update = FALSE
            )

          }

          cat(
            "Core Bioconductor installation completed.\n"
          )
          '


      # ============================================================
      # 7. scPred DEPENDENCIES
      # ============================================================

      - name: Install scPred dependencies
        run: |

          Rscript -e '

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          packages <- c(
            "ggbeeswarm",
            "MLmetrics",
            "caret",
            "kernlab",
            "pROC"
          )

          missing <- packages[
            !vapply(
              packages,
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ]

          if (length(missing) > 0) {

            install.packages(
              missing,
              repos = "https://cloud.r-project.org",
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )

          }

          cat(
            "scPred dependencies installed.\n"
          )
          '


      # ============================================================
      # 8. HARMONY DEPENDENCY
      # ============================================================

      - name: Install Harmony dependency
        run: |

          Rscript -e '

          if (!requireNamespace(
            "RhpcBLASctl",
            quietly = TRUE
          )) {

            install.packages(
              "RhpcBLASctl",
              repos = "https://cloud.r-project.org"
            )

          }

          '


      # ============================================================
      # 9. INSTALL HARMONY 1.2.4
      #
      # scPred requires HarmonyMatrix.
      # ============================================================

      - name: Install Harmony 1.2.4
        run: |

          curl -L \
            --fail \
            --retry 3 \
            "https://cran.r-project.org/src/contrib/Archive/harmony/harmony_1.2.4.tar.gz" \
            -o harmony_1.2.4.tar.gz

          R CMD INSTALL \
            --no-multiarch \
            --with-keep.source \
            harmony_1.2.4.tar.gz

          Rscript -e '

          library(harmony)

          if (!"HarmonyMatrix" %in% getNamespaceExports("harmony")) {

            stop(
              "HarmonyMatrix is not exported by installed Harmony."
            )

          }

          cat(
            "Harmony version:",
            as.character(
              packageVersion("harmony")
            ),
            "\n"
          )

          cat(
            "HarmonyMatrix available: TRUE\n"
          )

          '


      # ============================================================
      # 10. INSTALL scPred
      # ============================================================

      - name: Install scPred
        run: |

          curl -L \
            --fail \
            --retry 3 \
            -H "Authorization:" \
            -H "X-GitHub-Api-Version:" \
            "https://github.com/powellgenomicslab/scPred/archive/refs/heads/master.tar.gz" \
            -o scPred.tar.gz

          rm -rf scPred-src

          mkdir -p scPred-src

          tar -xzf scPred.tar.gz \
            --strip-components=1 \
            -C scPred-src

          R CMD INSTALL \
            --no-multiarch \
            --with-keep.source \
            scPred-src


      # ============================================================
      # 11. TEST scPred
      # ============================================================

      - name: Test scPred
        run: |

          Rscript -e '

          if (!requireNamespace(
            "scPred",
            quietly = TRUE
          )) {

            stop(
              "scPred installation failed."
            )

          }

          library(scPred)

          cat(
            "scPred version:",
            as.character(
              packageVersion("scPred")
            ),
            "\n"
          )

          cat(
            "scPred loaded successfully.\n"
          )

          '


      # ============================================================
      # 12. INSTALL scSorter
      # ============================================================

      - name: Install scSorter
        run: |

          Rscript -e '

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          if (!requireNamespace(
            "scSorter",
            quietly = TRUE
          )) {

            install.packages(
              "scSorter",
              repos = "https://cloud.r-project.org",
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )

          }

          if (!requireNamespace(
            "scSorter",
            quietly = TRUE
          )) {

            stop(
              "scSorter installation failed."
            )

          }

          cat(
            "scSorter version:",
            as.character(
              packageVersion("scSorter")
            ),
            "\n"
          )

          '


      # ============================================================
      # 13. INSTALL scCATCH
      # ============================================================

      - name: Install scCATCH
        run: |

          Rscript -e '

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          if (!requireNamespace(
            "scCATCH",
            quietly = TRUE
          )) {

            install.packages(
              "scCATCH",
              repos = "https://cloud.r-project.org",
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )

          }

          if (!requireNamespace(
            "scCATCH",
            quietly = TRUE
          )) {

            stop(
              "scCATCH installation failed."
            )

          }

          cat(
            "scCATCH installed successfully.\n"
          )

          '


      # ============================================================
      # 14. INSTALL scmap
      # ============================================================

      - name: Install scmap
        run: |

          Rscript -e '

          if (!requireNamespace(
            "scmap",
            quietly = TRUE
          )) {

            BiocManager::install(
              "scmap",
              ask = FALSE,
              update = FALSE
            )

          }

          if (!requireNamespace(
            "scmap",
            quietly = TRUE
          )) {

            stop(
              "scmap installation failed."
            )

          }

          cat(
            "scmap installed successfully.\n"
          )

          '


      # ============================================================
      # 15. INSTALL CelliD
      # ============================================================

      - name: Install CelliD
        run: |

          Rscript -e '

          if (!requireNamespace(
            "CelliD",
            quietly = TRUE
          )) {

            BiocManager::install(
              "CelliD",
              ask = FALSE,
              update = FALSE
            )

          }

          if (!requireNamespace(
            "CelliD",
            quietly = TRUE
          )) {

            stop(
              "CelliD installation failed."
            )

          }

          cat(
            "CelliD installed successfully.\n"
          )

          '


      # ============================================================
      # 16. INSTALL CHETAH
      # ============================================================

      - name: Install CHETAH
        run: |

          Rscript -e '

          if (!requireNamespace(
            "CHETAH",
            quietly = TRUE
          )) {

            BiocManager::install(
              "CHETAH",
              ask = FALSE,
              update = FALSE
            )

          }

          if (!requireNamespace(
            "CHETAH",
            quietly = TRUE
          )) {

            stop(
              "CHETAH installation failed."
            )

          }

          cat(
            "CHETAH installed successfully.\n"
          )

          '


      # ============================================================
      # 17. INSTALL SCINA
      #
      # SCINA is no longer installed from current CRAN.
      #
      # Use archived CRAN version 1.2.0.
      # ============================================================

      - name: Install SCINA from CRAN archive
        run: |

          if ! Rscript -e 'quit(status = ifelse(requireNamespace("SCINA", quietly = TRUE), 0, 1))'
          then

            echo "SCINA not installed."
            echo "Installing archived SCINA 1.2.0..."

            curl -L \
              --fail \
              --retry 3 \
              "https://cran.r-project.org/src/contrib/Archive/SCINA/SCINA_1.2.0.tar.gz" \
              -o SCINA_1.2.0.tar.gz

            R CMD INSTALL \
              --no-multiarch \
              --with-keep.source \
              SCINA_1.2.0.tar.gz

          fi

          Rscript -e '

          if (!requireNamespace(
            "SCINA",
            quietly = TRUE
          )) {

            stop(
              "SCINA installation failed."
            )

          }

          cat(
            "SCINA version:",
            as.character(
              packageVersion("SCINA")
            ),
            "\n"
          )

          '


      # ============================================================
      # 18. INSTALL scibetR
      # ============================================================

      - name: Install scibetR
        run: |

          if ! Rscript -e 'quit(status = ifelse(requireNamespace("scibetR", quietly = TRUE), 0, 1))'
          then

            echo "Downloading scibetR source..."

            curl -L \
              --fail \
              --retry 3 \
              -H "Authorization:" \
              -H "X-GitHub-Api-Version:" \
              "https://github.com/zwj-tina/scibetR/archive/refs/heads/master.tar.gz" \
              -o scibetR.tar.gz

            rm -rf scibetR-src

            mkdir -p scibetR-src

            tar -xzf scibetR.tar.gz \
              --strip-components=1 \
              -C scibetR-src

            R CMD INSTALL \
              --no-multiarch \
              --with-keep.source \
              scibetR-src

          fi

          Rscript -e '

          if (!requireNamespace(
            "scibetR",
            quietly = TRUE
          )) {

            stop(
              "scibetR installation failed."
            )

          }

          cat(
            "scibetR installed successfully.\n"
          )

          '


      # ============================================================
      # 19. VERIFY ALL scAnnoX RUNTIME DEPENDENCIES
      # ============================================================

      - name: Verify scAnnoX dependencies
        run: |

          Rscript -e '

          required <- c(
            "Seurat",
            "dplyr",
            "HGNChelper",
            "SingleCellExperiment",
            "SingleR",
            "scSorter",
            "scCATCH",
            "scibetR",
            "CHETAH",
            "scmap",
            "CelliD",
            "SCINA",
            "future"
          )

          installed <- vapply(
            required,
            requireNamespace,
            logical(1),
            quietly = TRUE
          )

          cat(
            "\nInstalled:\n"
          )

          print(
            required[installed]
          )

          cat(
            "\nMissing:\n"
          )

          print(
            required[!installed]
          )

          missing <- required[!installed]

          if (length(missing) > 0) {

            stop(
              "Missing scAnnoX dependencies: ",
              paste(
                missing,
                collapse = ", "
              )
            )

          }

          cat(
            "\nAll scAnnoX runtime dependencies are available.\n"
          )

          '


      # ============================================================
      # 20. PATCH LOCAL scAnnoX DESCRIPTION
      #
      # This modification exists ONLY inside GitHub Actions.
      #
      # It is NOT committed back to GitHub.
      # ============================================================

      - name: Patch scAnnoX DESCRIPTION
        run: |

          python3 - <<'PY'

          from pathlib import Path

          path = Path(
              "files/external/scAnnoX/DESCRIPTION"
          )

          if not path.exists():

              raise SystemExit(
                  "scAnnoX DESCRIPTION not found."
              )

          text = path.read_text()

          start = text.index(
              "Depends:"
          )

          imports_start = text.index(
              "Imports:"
          )

          suggests_start = text.index(
              "Suggests:"
          )

          new_depends = """Depends:
          \tR (>= 4.0.0)
          """

          new_imports = """Imports:
          \tdplyr
          """

          text = (
              text[:start]
              + new_depends
              + new_imports
              + text[suggests_start:]
          )

          path.write_text(
              text
          )

          print(
              "scAnnoX DESCRIPTION patched successfully."
          )

          PY

          echo ""
          echo "Patched scAnnoX DESCRIPTION:"
          cat files/external/scAnnoX/DESCRIPTION


      # ============================================================
      # 21. INSTALL LOCAL scAnnoX
      # ============================================================

      - name: Install local scAnnoX
        run: |

          echo "Checking scAnnoX source..."

          test -f \
            files/external/scAnnoX/DESCRIPTION

          test -f \
            files/external/scAnnoX/NAMESPACE

          echo ""
          echo "Installing local scAnnoX..."

          R CMD INSTALL \
            --no-multiarch \
            --with-keep.source \
            files/external/scAnnoX


      # ============================================================
      # 22. TEST scAnnoX
      # ============================================================

      - name: Test scAnnoX
        run: |

          Rscript -e '

          cat(
            "Checking scAnnoX installation...\n"
          )

          if (!requireNamespace(
            "scAnnoX",
            quietly = TRUE
          )) {

            stop(
              "scAnnoX installation/import failed."
            )

          }

          library(scAnnoX)

          cat(
            "scAnnoX version:",
            as.character(
              packageVersion("scAnnoX")
            ),
            "\n"
          )

          required_functions <- c(
            "autoAnnoTools",
            "annoResult",
            "findMarkerToolsForSc"
          )

          missing <- required_functions[
            !vapply(
              required_functions,
              exists,
              logical(1),
              where = asNamespace("scAnnoX"),
              inherits = FALSE
            )
          ]

          if (length(missing) > 0) {

            stop(
              "Missing scAnnoX functions: ",
              paste(
                missing,
                collapse = ", "
              )
            )

          }

          cat(
            "Required scAnnoX functions available: ",
            paste(
              required_functions,
              collapse = ", "
            ),
            "\n"
          )

          cat(
            "scAnnoX loaded successfully.\n"
          )

          '


      # ============================================================
      # 23. DOWNLOAD DATASET
      # ============================================================

      - name: Run dataset download
        run: |

          Rscript \
            scripts/01_download_GSE145410.R


      # ============================================================
      # 24. IMPORT + QC
      # ============================================================

      - name: Run import and QC
        run: |

          Rscript \
            scripts/02_import_and_QC.R


      # ============================================================
      # 25. NORMALIZATION + HVG
      # ============================================================

      - name: Run normalization and HVG
        run: |

          Rscript \
            scripts/03_normalization_HVG.R


      # ============================================================
      # 26. PCA + CLUSTERING + UMAP
      # ============================================================

      - name: Run PCA clustering UMAP
        run: |

          Rscript \
            scripts/04_PCA_clustering_UMAP.R


      # ============================================================
      # 27. SEURAT v5 CCA INTEGRATION
      # ============================================================

      - name: Run Seurat integration
        run: |

          Rscript \
            scripts/05_Seurat5_integration.R


      # ============================================================
      # 28. SINGLE-R ANNOTATION
      # ============================================================

      - name: Run SingleR annotation
        run: |

          Rscript \
            scripts/06_annotation_SingleR.R


      # ============================================================
      # 29. scPred ANNOTATION
      # ============================================================

      - name: Run scPred annotation
        run: |

          Rscript \
            scripts/07_annotation_scPred.R


      # ============================================================
      # 30. scAnnoX ANNOTATION
      # ============================================================

      - name: Run scAnnoX annotation
        run: |

          Rscript \
            scripts/08_annotation_scAnnoX.R


      # ============================================================
      # 31. COMPARE ANNOTATIONS
      # ============================================================

      - name: Compare annotation methods
        run: |

          Rscript \
            scripts/09_compare_annotations.R


      # ============================================================
      # 32. DIFFERENTIAL EXPRESSION
      # ============================================================

      - name: Differential expression
        run: |

          Rscript \
            scripts/10_differential_expression.R


      # ============================================================
      # 33. FINAL FIGURES
      # ============================================================

      - name: Generate final figures
        run: |

          Rscript \
            scripts/11_final_figures.R


      # ============================================================
      # 34. COMMIT RESULTS
      #
      # IMPORTANT:
      # Do NOT commit the patched scAnnoX DESCRIPTION.
      # ============================================================

      - name: Commit analysis results
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            results/ \
            docs/ \
            figures/ \
            2>/dev/null || true

          if git diff --cached --quiet
          then

            echo "No new results to commit."

          else

            git commit \
              -m "Run AML scRNA-seq analysis pipeline"

            git push

          fi

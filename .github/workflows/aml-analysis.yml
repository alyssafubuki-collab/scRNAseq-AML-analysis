name: AML scRNA-seq full analysis

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  scrnaseq-analysis:

    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. SETUP R
      # ==========================================================

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true

      # ==========================================================
      # 3. SYSTEM DEPENDENCIES
      # ==========================================================

      - name: Install system dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            libuv1-dev \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff-dev \
            libjpeg-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libgit2-dev \
            libglpk-dev \
            libgsl-dev \
            libhdf5-dev \
            libxml2-dev \
            libblas-dev \
            liblapack-dev \
            gfortran

      # ==========================================================
      # 4. CHECK R
      # ==========================================================

      - name: Check R installation
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "R VERSION"
          echo "============================================================"

          R --version

          echo "============================================================"
          echo "RSCRIPT VERSION"
          echo "============================================================"

          Rscript --version

          echo "============================================================"
          echo "R LIBRARY PATHS"
          echo "============================================================"

          Rscript -e 'print(.libPaths())'

      # ==========================================================
      # 5. CHECK SYSTEM LIBUV
      # ==========================================================

      - name: Check libuv
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "CHECKING LIBUV"
          echo "============================================================"

          pkg-config --modversion libuv || true

          echo "============================================================"
          echo "CHECKING uv.h"
          echo "============================================================"

          test -f /usr/include/uv.h

          echo "libuv development files detected."

      # ==========================================================
      # 6. CREATE OUTPUT DIRECTORIES
      # ==========================================================

      - name: Create project directories
        run: |
          set -euo pipefail

          mkdir -p \
            data/GSE145410 \
            results/figures/qc \
            results/figures/integration \
            results/figures/annotation \
            results/figures/differential_expression \
            results/qc \
            results/annotation \
            results/differential_expression \
            results/objects \
            environment

      # ==========================================================
      # 7. VALIDATE INSTALLATION SCRIPT
      # ==========================================================

      - name: Validate 00_install_packages.R
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "INSTALLATION SCRIPT"
          echo "============================================================"

          ls -lah scripts/00_install_packages.R

          echo "============================================================"
          echo "R PARSE TEST"
          echo "============================================================"

          Rscript -e '
            parse(
              file = "scripts/00_install_packages.R"
            )

            cat("R PARSE: OK\n")
          '

      # ==========================================================
      # 8. INSTALL PACKAGES
      # ==========================================================

      - name: Install R packages
        run: |
          set -euo pipefail

          Rscript scripts/00_install_packages.R

      # ==========================================================
      # 9. POST-INSTALLATION PACKAGE CHECK
      # ==========================================================

      - name: Verify critical packages
        run: |
          set -euo pipefail

          Rscript - <<'EOF'

          packages <- c(
            "Seurat",
            "SeuratObject",
            "Matrix",
            "GEOquery",
            "scuttle",
            "SingleR",
            "celldex",
            "SingleCellExperiment",
            "SummarizedExperiment",
            "harmony",
            "scPred"
          )

          cat("============================================================\n")
          cat("CRITICAL PACKAGE CHECK\n")
          cat("============================================================\n")

          failed <- character()

          for (pkg in packages) {

            if (requireNamespace(pkg, quietly = TRUE)) {

              cat(
                "OK: ",
                pkg,
                " ",
                as.character(packageVersion(pkg)),
                "\n",
                sep = ""
              )

            } else {

              cat(
                "FAILED: ",
                pkg,
                "\n",
                sep = ""
              )

              failed <- c(failed, pkg)
            }
          }

          cat("============================================================\n")

          if (length(failed) > 0) {

            stop(
              paste(
                "Critical packages missing:",
                paste(failed, collapse = ", ")
              )
            )
          }

          cat("All critical packages available.\n")

          EOF

      # ==========================================================
      # 10. DOWNLOAD GEO DATA
      # ==========================================================

      - name: Download GSE145410
        run: |
          set -euo pipefail

          Rscript scripts/01_download_GSE145410.R

      # ==========================================================
      # 11. IMPORT + QC
      # ==========================================================

      - name: Import data and perform adaptive QC
        run: |
          set -euo pipefail

          Rscript scripts/02_import_and_QC.R

      # ==========================================================
      # 12. NORMALIZATION + HVG
      # ==========================================================

      - name: Normalize and select HVGs
        run: |
          set -euo pipefail

          Rscript scripts/03_normalization_HVG.R

      # ==========================================================
      # 13. PCA + CLUSTERING + UMAP
      # ==========================================================

      - name: PCA clustering and UMAP
        run: |
          set -euo pipefail

          Rscript scripts/04_PCA_clustering_UMAP.R

      # ==========================================================
      # 14. SEURAT v5 CCA INTEGRATION
      # ==========================================================

      - name: Runner resources before Seurat integration
        run: |
            echo "===== CPU ====="
             nproc

            echo "===== MEMORY ====="
            free -h

            echo "===== DISK ====="
                df -h

      - name: Seurat v5 CCA integration
        run: |
          set -euo pipefail

          Rscript scripts/05_Seurat5_integration.R

      # ==========================================================
      # 15. SINGLER ANNOTATION
      # ==========================================================

      - name: SingleR annotation
        run: |
          set -euo pipefail

          Rscript scripts/06_annotation_SingleR.R

      # ==========================================================
      # 16. SCPRED ANNOTATION
      # ==========================================================

      - name: scPred annotation
        run: |
          set -euo pipefail

          Rscript scripts/07_annotation_scPred.R

      # ==========================================================
      # 17. CONSENSUS ANNOTATION
      # ==========================================================

      - name: SingleR + scPred consensus
        run: |
          set -euo pipefail

          Rscript scripts/08b_consensus_annotation.R

      # ==========================================================
      # 18. DIFFERENTIAL EXPRESSION
      # ==========================================================

      - name: Differential expression
        run: |
          set -euo pipefail

          Rscript scripts/09b_differential_expression.R

      # ==========================================================
      # 19. FINAL FIGURES
      # ==========================================================

      - name: Final figures
        run: |
          set -euo pipefail

          Rscript scripts/10b_final_figures.R

      # ==========================================================
      # 20. SESSION INFO
      # ==========================================================

      - name: Save session information
        run: |
          set -euo pipefail

          Rscript - <<'EOF'

          writeLines(
            capture.output(sessionInfo()),
            "environment/sessionInfo_GitHubActions.txt"
          )

          EOF

      # ==========================================================
      # 21. CHECK RESULTS
      # ==========================================================

      - name: Check analysis outputs
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "OBJECTS"
          echo "============================================================"

          find results/objects -type f | sort || true

          echo "============================================================"
          echo "QC"
          echo "============================================================"

          find results/qc -type f | sort || true

          echo "============================================================"
          echo "ANNOTATION"
          echo "============================================================"

          find results/annotation -type f | sort || true

          echo "============================================================"
          echo "DIFFERENTIAL EXPRESSION"
          echo "============================================================"

          find results/differential_expression -type f | sort || true

          echo "============================================================"
          echo "FIGURES"
          echo "============================================================"

          find figures -type f | sort || true

      # ==========================================================
      # 22. COMMIT RESULTS BACK TO THE REPOSITORY
      # ==========================================================
      
      - name: Commit results to repository
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- ':!results/objects'

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update pipeline results [skip ci]"
          fi

          echo "============================================================"
          echo "SYNC WITH REMOTE MAIN"
          echo "============================================================"

          git fetch origin main
          git rebase --autostash origin/main

          echo "============================================================"
          echo "PUSH RESULTS"
          echo "============================================================"

          git push origin HEAD:main

      # ==========================================================
      # 23. UPLOAD RESULTS ARTIFACT
      # ==========================================================

      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        with:
          name: AML-scRNAseq-analysis-results
          path: |
            results/
            environment/
          if-no-files-found: warn
          retention-days: 30

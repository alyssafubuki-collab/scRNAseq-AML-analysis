name: Resume scAnnoX analysis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resume-scannox:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. SETUP R
      # ============================================================

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true


      # ============================================================
      # 3. SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            gfortran \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libgit2-dev \
            libglpk-dev \
            libgsl-dev \
            libhdf5-dev \
            liblapack-dev \
            libblas-dev


      # ============================================================
      # 4. CONFIGURE CRAN
      # ============================================================

      - name: Configure CRAN
        run: |
          Rscript -e '
            options(
              repos = c(
                CRAN = "https://cloud.r-project.org"
              )
            )

            cat(
              "CRAN = ",
              getOption("repos")["CRAN"],
              "\n",
              sep = ""
            )
          '


      # ============================================================
      # 5. INSTALL BiocManager
      # ============================================================

      - name: Install BiocManager
        run: |
          Rscript -e '
            options(
              repos = c(
                CRAN = "https://cloud.r-project.org"
              )
            )

            if (
              !requireNamespace(
                "BiocManager",
                quietly = TRUE
              )
            ) {

              install.packages(
                "BiocManager",
                dependencies = c(
                  "Depends",
                  "Imports",
                  "LinkingTo"
                )
              )
            }

            cat(
              "BiocManager ",
              as.character(
                packageVersion("BiocManager")
              ),
              "\n",
              sep = ""
            )
          '


      # ============================================================
      # 6. CORE CRAN PACKAGES
      # ============================================================

      - name: Install core CRAN packages
        run: |
          Rscript - <<'EOF'

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          packages <- c(
            "Seurat",
            "SeuratObject",
            "dplyr",
            "ggplot2",
            "patchwork",
            "HGNChelper",
            "future",
            "Matrix",
            "data.table",
            "R.utils",
            "remotes",
            "devtools"
          )

          installed <- rownames(
            installed.packages()
          )

          missing <- setdiff(
            packages,
            installed
          )

          cat("Missing core packages:\n")
          print(missing)

          if (length(missing) > 0) {

            install.packages(
              missing,
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )
          }

          cat(
            "\nCore CRAN packages ready.\n"
          )

          EOF


      # ============================================================
      # 7. BIOCONDUCTOR CORE PACKAGES
      # ============================================================

      - name: Install Bioconductor single-cell packages
        run: |
          Rscript - <<'EOF'

          BiocManager::install(
            c(
              "SingleCellExperiment",
              "SingleR",
              "celldex",
              "scuttle"
            ),
            ask = FALSE,
            update = FALSE
          )

          cat(
            "\nBioconductor core packages ready.\n"
          )

          EOF


      # ============================================================
      # 8. CONFIGURE C++14
      # ============================================================

      - name: Configure C++14
        run: |

          echo "========================================"
          echo "Configuring C++14"
          echo "========================================"

          mkdir -p "${HOME}/.R"

          cat > "${HOME}/.R/Makevars" <<'EOF'
          CXX_STD = CXX14
          CXX14STD = -std=gnu++14
          PKG_CXXFLAGS = -std=gnu++14
          EOF

          echo ""
          echo "===== ~/.R/Makevars ====="
          cat "${HOME}/.R/Makevars"

          echo ""
          echo "===== g++ version ====="
          g++ --version

          echo ""
          echo "===== R compiler configuration ====="
          R CMD config CXX
          R CMD config CXX11
          R CMD config CXX14
          R CMD config CXX14STD

          echo ""
          echo "===== Testing C++14 ====="

          cat > /tmp/test_cpp14.cpp <<'EOF'
          #include <iostream>
          #include <vector>

          template <typename T>
          auto test_function(T value) {
              return value;
          }

          int main() {
              std::cout << test_function(42) << std::endl;
              return 0;
          }
          EOF

          g++ \
            -std=gnu++14 \
            /tmp/test_cpp14.cpp \
            -o /tmp/test_cpp14

          /tmp/test_cpp14

          echo ""
          echo "C++14 test passed."


      # ============================================================
      # 9. Rcpp + RcppArmadillo
      # ============================================================

      - name: Install Rcpp and RcppArmadillo
        env:
          CXXFLAGS: "-std=gnu++14"
          PKG_CXXFLAGS: "-std=gnu++14"
        run: |

          Rscript - <<'EOF'

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          Sys.setenv(
            CXXFLAGS = "-std=gnu++14",
            PKG_CXXFLAGS = "-std=gnu++14"
          )

          packages <- c(
            "Rcpp",
            "RcppArmadillo"
          )

          installed <- rownames(
            installed.packages()
          )

          missing <- setdiff(
            packages,
            installed
          )

          if (length(missing) > 0) {

            install.packages(
              missing,
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )
          }

          cat(
            "Rcpp ",
            as.character(
              packageVersion("Rcpp")
            ),
            "\n",
            sep = ""
          )

          cat(
            "RcppArmadillo ",
            as.character(
              packageVersion("RcppArmadillo")
            ),
            "\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 10. scPred DEPENDENCIES
      # ============================================================

      - name: Install scPred dependencies
        run: |

          echo "========================================"
          echo "Installing scPred dependencies"
          echo "========================================"

          Rscript - <<'EOF'

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          packages <- c(
            "harmony",
            "ggbeeswarm",
            "MLmetrics",
            "caret",
            "kernlab",
            "pROC"
          )

          installed <- rownames(
            installed.packages()
          )

          missing <- setdiff(
            packages,
            installed
          )

          cat(
            "Missing scPred dependencies:\n"
          )

          print(missing)

          if (length(missing) > 0) {

            install.packages(
              missing,
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )
          }

          cat(
            "\nVerifying scPred dependencies...\n\n"
          )

          failed <- character(0)

          for (pkg in packages) {

            if (
              !requireNamespace(
                pkg,
                quietly = TRUE
              )
            ) {

              cat(
                "FAILED: ",
                pkg,
                "\n",
                sep = ""
              )

              failed <- c(
                failed,
                pkg
              )

            } else {

              cat(
                "OK: ",
                pkg,
                " ",
                as.character(
                  packageVersion(pkg)
                ),
                "\n",
                sep = ""
              )
            }
          }

          if (length(failed) > 0) {

            cat(
              "\nPackages that failed:\n"
            )

            print(failed)

            stop(
              "scPred dependencies are incomplete."
            )
          }

          cat(
            "\nAll scPred dependencies are available.\n"
          )

          EOF


      # ============================================================
      # 11. VERIFY caret
      # ============================================================

      - name: Verify caret before scPred
        run: |

          echo "========================================"
          echo "Verifying caret"
          echo "========================================"

          Rscript - <<'EOF'

          if (
            !requireNamespace(
              "caret",
              quietly = TRUE
            )
          ) {

            cat(
              "ERROR: caret is not installed.\n"
            )

            ip <- installed.packages()

            matches <- grep(
              "caret",
              rownames(ip),
              ignore.case = TRUE
            )

            if (length(matches) > 0) {

              print(
                ip[
                  matches,
                  c(
                    "Package",
                    "Version",
                    "LibPath"
                  ),
                  drop = FALSE
                ]
              )
            }

            stop(
              "caret is required before installing scPred."
            )
          }

          cat(
            "caret ",
            as.character(
              packageVersion("caret")
            ),
            " is available.\n",
            sep = ""
          )

          cat(
            "caret library path: ",
            find.package("caret"),
            "\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 12. HARMONY 1.2.4
      #
      # scPred requires HarmonyMatrix().
      # ============================================================

      - name: Install Harmony 1.2.4
        run: |

          echo "========================================"
          echo "Checking Harmony"
          echo "========================================"

          if Rscript -e '
            if (
              !requireNamespace(
                "harmony",
                quietly = TRUE
              )
            ) {
              quit(status = 1)
            }

            if (
              !"HarmonyMatrix" %in%
              getNamespaceExports("harmony")
            ) {
              quit(status = 1)
            }

            quit(status = 0)
          '
          then

            echo "HarmonyMatrix already available."

          else

            echo "Installing Harmony 1.2.4..."

            curl \
              -L \
              --fail \
              --retry 5 \
              --retry-delay 2 \
              "https://cran.r-project.org/src/contrib/Archive/harmony/harmony_1.2.4.tar.gz" \
              -o harmony_1.2.4.tar.gz

            R CMD INSTALL \
              --no-multiarch \
              --with-keep.source \
              harmony_1.2.4.tar.gz

          fi

          Rscript - <<'EOF'

          if (
            !requireNamespace(
              "harmony",
              quietly = TRUE
            )
          ) {
            stop(
              "Harmony installation failed."
            )
          }

          if (
            !"HarmonyMatrix" %in%
            getNamespaceExports("harmony")
          ) {
            stop(
              "HarmonyMatrix is not available."
            )
          }

          cat(
            "Harmony ",
            as.character(
              packageVersion("harmony")
            ),
            " ready.\n",
            sep = ""
          )

          cat(
            "HarmonyMatrix available.\n"
          )

          EOF


      # ============================================================
      # 13. INSTALL scPred
      # ============================================================

      - name: Install scPred
        env:
          CXXFLAGS: "-std=gnu++14"
          PKG_CXXFLAGS: "-std=gnu++14"
        run: |

          echo "========================================"
          echo "Installing scPred"
          echo "========================================"

          Rscript - <<'EOF'

          if (
            !requireNamespace(
              "caret",
              quietly = TRUE
            )
          ) {
            stop(
              "caret is unavailable. scPred cannot be installed."
            )
          }

          cat(
            "caret detected: ",
            as.character(
              packageVersion("caret")
            ),
            "\n",
            sep = ""
          )

          cat(
            "caret path: ",
            find.package("caret"),
            "\n",
            sep = ""
          )

          EOF

          echo ""
          echo "Downloading scPred..."

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            "https://github.com/powellgenomicslab/scPred/archive/refs/heads/master.tar.gz" \
            -o scPred.tar.gz

          echo ""
          echo "Downloaded scPred:"
          ls -lh scPred.tar.gz

          echo ""
          echo "Installing scPred..."

          R CMD INSTALL \
            --no-multiarch \
            --with-keep.source \
            scPred.tar.gz

          echo ""
          echo "Verifying scPred..."

          Rscript - <<'EOF'

          if (
            !requireNamespace(
              "scPred",
              quietly = TRUE
            )
          ) {

            stop(
              "scPred installation failed."
            )
          }

          cat(
            "scPred ",
            as.character(
              packageVersion("scPred")
            ),
            " installed successfully.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 14. scSorter 0.0.2
      #
      # IMPORTANT:
      # Do NOT use install.packages("scSorter").
      # scSorter is archived on CRAN.
      # ============================================================

      - name: Install scSorter 0.0.2
        run: |

          echo "========================================"
          echo "Installing scSorter 0.0.2"
          echo "========================================"

          if Rscript -e '
            if (
              requireNamespace(
                "scSorter",
                quietly = TRUE
              )
            ) {
              quit(status = 0)
            } else {
              quit(status = 1)
            }
          '
          then

            echo "scSorter already installed."

          else

            echo ""
            echo "scSorter not installed."
            echo "Installing archived CRAN version 0.0.2..."

            curl \
              -L \
              --fail \
              --retry 5 \
              --retry-delay 2 \
              "https://cran.r-project.org/src/contrib/Archive/scSorter/scSorter_0.0.2.tar.gz" \
              -o scSorter_0.0.2.tar.gz

            echo ""
            echo "Downloaded archive:"
            ls -lh scSorter_0.0.2.tar.gz

            echo ""
            echo "File information:"
            file scSorter_0.0.2.tar.gz

            echo ""
            echo "Installing scSorter..."

            R CMD INSTALL \
              --no-multiarch \
              --with-keep.source \
              scSorter_0.0.2.tar.gz

          fi

          echo ""
          echo "========================================"
          echo "Verifying scSorter"
          echo "========================================"

          Rscript - <<'EOF'

          if (
            !requireNamespace(
              "scSorter",
              quietly = TRUE
            )
          ) {

            stop(
              "scSorter installation failed."
            )
          }

          cat(
            "scSorter ",
            as.character(
              packageVersion("scSorter")
            ),
            " installed successfully.\n",
            sep = ""
          )

          cat(
            "Location: ",
            find.package("scSorter"),
            "\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 15. scCATCH
      # ============================================================

      - name: Install scCATCH
        run: |

          echo "========================================"
          echo "Installing scCATCH"
          echo "========================================"

          Rscript - <<'EOF'

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          if (
            !requireNamespace(
              "scCATCH",
              quietly = TRUE
            )
          ) {

            install.packages(
              "scCATCH",
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )
          }

          if (
            !requireNamespace(
              "scCATCH",
              quietly = TRUE
            )
          ) {

            stop(
              "scCATCH installation failed."
            )
          }

          cat(
            "scCATCH ",
            as.character(
              packageVersion("scCATCH")
            ),
            " installed.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 16. scmap
      # ============================================================

      - name: Install scmap
        run: |

          echo "========================================"
          echo "Installing scmap"
          echo "========================================"

          Rscript - <<'EOF'

          if (
            !requireNamespace(
              "scmap",
              quietly = TRUE
            )
          ) {

            BiocManager::install(
              "scmap",
              ask = FALSE,
              update = FALSE
            )
          }

          if (
            !requireNamespace(
              "scmap",
              quietly = TRUE
            )
          ) {

            stop(
              "scmap installation failed."
            )
          }

          cat(
            "scmap ",
            as.character(
              packageVersion("scmap")
            ),
            " installed.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 17. CelliD
      #
      # C++14 is already configured globally.
      # ============================================================

      - name: Install CelliD
        env:
          CXXFLAGS: "-std=gnu++14"
          PKG_CXXFLAGS: "-std=gnu++14"
          MAKEFLAGS: "-j2"
        run: |

          echo "========================================"
          echo "Installing CelliD"
          echo "========================================"

          echo ""
          echo "CXXFLAGS=${CXXFLAGS}"
          echo "PKG_CXXFLAGS=${PKG_CXXFLAGS}"
          echo "MAKEFLAGS=${MAKEFLAGS}"

          echo ""
          echo "Makevars:"
          cat "${HOME}/.R/Makevars"

          Rscript - <<'EOF'

          Sys.setenv(
            CXXFLAGS = "-std=gnu++14",
            PKG_CXXFLAGS = "-std=gnu++14"
          )

          if (
            !requireNamespace(
              "Rcpp",
              quietly = TRUE
            )
          ) {

            install.packages(
              "Rcpp",
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )
          }

          if (
            !requireNamespace(
              "RcppArmadillo",
              quietly = TRUE
            )
          ) {

            install.packages(
              "RcppArmadillo",
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )
          }

          if (
            !requireNamespace(
              "CelliD",
              quietly = TRUE
            )
          ) {

            cat(
              "\nInstalling CelliD with C++14...\n\n"
            )

            BiocManager::install(
              "CelliD",
              ask = FALSE,
              update = FALSE,
              force = TRUE
            )
          }

          if (
            !requireNamespace(
              "CelliD",
              quietly = TRUE
            )
          ) {

            stop(
              "CelliD installation failed."
            )
          }

          cat(
            "\nCelliD ",
            as.character(
              packageVersion("CelliD")
            ),
            " installed successfully.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 18. CHETAH
      # ============================================================

      - name: Install CHETAH
        run: |

          echo "========================================"
          echo "Installing CHETAH"
          echo "========================================"

          Rscript - <<'EOF'

          if (
            !requireNamespace(
              "CHETAH",
              quietly = TRUE
            )
          ) {

            BiocManager::install(
              "CHETAH",
              ask = FALSE,
              update = FALSE
            )
          }

          if (
            !requireNamespace(
              "CHETAH",
              quietly = TRUE
            )
          ) {

            stop(
              "CHETAH installation failed."
            )
          }

          cat(
            "CHETAH ",
            as.character(
              packageVersion("CHETAH")
            ),
            " installed.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 19. SCINA
      #
      # SCINA is archived on CRAN.
      # ============================================================

      - name: Install SCINA 1.2.0
        run: |

          echo "========================================"
          echo "Installing SCINA 1.2.0"
          echo "========================================"

          if Rscript -e '
            if (
              requireNamespace(
                "SCINA",
                quietly = TRUE
              )
            ) {
              quit(status = 0)
            } else {
              quit(status = 1)
            }
          '
          then

            echo "SCINA already installed."

          else

            echo ""
            echo "Downloading archived SCINA 1.2.0..."

            curl \
              -L \
              --fail \
              --retry 5 \
              --retry-delay 2 \
              "https://cran.r-project.org/src/contrib/Archive/SCINA/SCINA_1.2.0.tar.gz" \
              -o SCINA_1.2.0.tar.gz

            echo ""
            echo "Downloaded archive:"
            ls -lh SCINA_1.2.0.tar.gz

            echo ""
            echo "Installing SCINA..."

            R CMD INSTALL \
              --no-multiarch \
              --with-keep.source \
              SCINA_1.2.0.tar.gz

          fi

          echo ""
          echo "Verifying SCINA..."

          Rscript -e '

            if (
              !requireNamespace(
                "SCINA",
                quietly = TRUE
              )
            ) {

              stop(
                "SCINA installation failed."
              )
            }

            cat(
              "SCINA ",
              as.character(
                packageVersion("SCINA")
              ),
              " installed.\n",
              sep = ""
            )
          '


      # ============================================================
      # 20. scibetR
      # ============================================================

      - name: Install scibetR
        run: |

          echo "========================================"
          echo "Installing scibetR"
          echo "========================================"

          if Rscript -e '
            if (
              requireNamespace(
                "scibetR",
                quietly = TRUE
              )
            ) {
              quit(status = 0)
            } else {
              quit(status = 1)
            }
          '
          then

            echo "scibetR already installed."

          else

            echo ""
            echo "Downloading scibetR..."

            curl \
              -L \
              --fail \
              --retry 5 \
              --retry-delay 2 \
              "https://github.com/zwj-tina/scibetR/archive/refs/heads/master.tar.gz" \
              -o scibetR.tar.gz

            echo ""
            echo "Downloaded archive:"
            ls -lh scibetR.tar.gz

            echo ""
            echo "Installing scibetR..."

            R CMD INSTALL \
              --no-multiarch \
              --with-keep.source \
              scibetR.tar.gz

          fi

          echo ""
          echo "Verifying scibetR..."

          Rscript -e '

            if (
              !requireNamespace(
                "scibetR",
                quietly = TRUE
              )
            ) {

              stop(
                "scibetR installation failed."
              )
            }

            cat(
              "scibetR ",
              as.character(
                packageVersion("scibetR")
              ),
              " installed.\n",
              sep = ""
            )
          '


      # ============================================================
      # 21. VERIFY ALL scAnnoX DEPENDENCIES
      # ============================================================

      - name: Verify scAnnoX dependencies
        run: |

          echo "========================================"
          echo "Verifying scAnnoX dependencies"
          echo "========================================"

          Rscript - <<'EOF'

          required <- c(
            "Seurat",
            "SeuratObject",
            "SingleCellExperiment",
            "SingleR",
            "celldex",
            "scuttle",
            "scPred",
            "scSorter",
            "scCATCH",
            "SCINA",
            "scmap",
            "CelliD",
            "CHETAH",
            "scibetR"
          )

          failed <- character(0)

          for (pkg in required) {

            if (
              requireNamespace(
                pkg,
                quietly = TRUE
              )
            ) {

              cat(
                "OK       ",
                pkg,
                " ",
                as.character(
                  packageVersion(pkg)
                ),
                "\n",
                sep = ""
              )

            } else {

              cat(
                "FAILED   ",
                pkg,
                "\n",
                sep = ""
              )

              failed <- c(
                failed,
                pkg
              )
            }
          }

          if (length(failed) > 0) {

            cat(
              "\nMissing packages:\n"
            )

            print(failed)

            stop(
              "scAnnoX dependencies are incomplete."
            )
          }

          cat(
            "\nAll scAnnoX dependencies are installed.\n"
          )

          EOF


      # ============================================================
      # 22. INSTALL LOCAL MODIFIED scAnnoX
      #
      # This is the user's Seurat 5-compatible modified copy.
      # ============================================================

      - name: Install local modified scAnnoX
        run: |

          echo "========================================"
          echo "Installing local modified scAnnoX"
          echo "========================================"

          SCANNOX_PATH="files/external/scAnnoX"

          if [
            ! -f "${SCANNOX_PATH}/DESCRIPTION"
          ]; then

            echo ""
            echo "ERROR:"
            echo "${SCANNOX_PATH}/DESCRIPTION not found."
            echo ""

            echo "Repository files:"
            find files \
              -maxdepth 4 \
              -type f \
              | sort || true

            exit 1
          fi

          echo ""
          echo "scAnnoX source:"
          echo "${SCANNOX_PATH}"

          echo ""
          echo "DESCRIPTION:"
          head -40 \
            "${SCANNOX_PATH}/DESCRIPTION"

          echo ""
          echo "Installing local package..."

          R CMD INSTALL \
            --no-multiarch \
            --with-keep.source \
            "${SCANNOX_PATH}"

          echo ""
          echo "Verifying package..."

          Rscript - <<'EOF'

          if (
            !requireNamespace(
              "scAnnoX",
              quietly = TRUE
            )
          ) {

            stop(
              "scAnnoX installation failed."
            )
          }

          cat(
            "scAnnoX ",
            as.character(
              packageVersion("scAnnoX")
            ),
            " installed successfully.\n",
            sep = ""
          )

          cat(
            "Location: ",
            find.package("scAnnoX"),
            "\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 23. VERIFY scAnnoX FUNCTIONS
      # ============================================================

      - name: Verify scAnnoX functions
        run: |

          echo "========================================"
          echo "Verifying scAnnoX functions"
          echo "========================================"

          Rscript - <<'EOF'

          library(scAnnoX)

          expected <- c(
            "annoResult",
            "autoAnnoTools",
            "findMarkerToolsForSc",
            "findMarkersBySeurat",
            "listToolMethods",
            "multipleProcess",
            "sccatchAnno",
            "sciBetAnno",
            "scinaAnno",
            "scmapAnno",
            "scsorterAnno",
            "sctypeAnno",
            "seuratAnno",
            "singleRAnno"
          )

          missing <- expected[
            !vapply(
              expected,
              exists,
              logical(1),
              where = asNamespace("scAnnoX"),
              inherits = FALSE
            )
          ]

          if (length(missing) > 0) {

            cat(
              "Missing scAnnoX functions:\n"
            )

            print(missing)

            stop(
              "scAnnoX function verification failed."
            )
          }

          cat(
            "\nAll expected scAnnoX functions are available.\n"
          )

          cat(
            "\nAvailable annotation methods:\n"
          )

          print(
            listToolMethods()
          )

          EOF


      # ============================================================
      # 24. CHECK EXISTING INTEGRATED OBJECT
      #
      # IMPORTANT:
      # We resume from 05_integrated.rds.
      # Scripts 01-07 are NOT rerun.
      # ============================================================

      - name: Check integrated object
        run: |

          echo "========================================"
          echo "Checking integrated object"
          echo "========================================"

          OBJECT="results/objects/05_integrated.rds"

          if [
            ! -f "${OBJECT}"
          ]; then

            echo ""
            echo "ERROR:"
            echo "${OBJECT} was not found."
            echo ""

            echo "Available RDS files:"
            find results \
              -type f \
              \( \
                -name "*.rds" \
                -o \
                -name "*.RDS" \
              \) \
              | sort || true

            exit 1
          fi

          echo ""
          echo "Integrated object found:"
          ls -lh "${OBJECT}"

          echo ""
          echo "Testing RDS readability..."

          Rscript - <<'EOF'

          object <- readRDS(
            "results/objects/05_integrated.rds"
          )

          cat(
            "Object class:\n"
          )

          print(
            class(object)
          )

          if (
            !inherits(
              object,
              "Seurat"
            )
          ) {

            stop(
              "05_integrated.rds is not a Seurat object."
            )
          }

          cat(
            "\nNumber of cells: ",
            ncol(object),
            "\n",
            sep = ""
          )

          cat(
            "Number of features: ",
            nrow(object),
            "\n",
            sep = ""
          )

          cat(
            "\nAssays:\n"
          )

          print(
            Assays(object)
          )

          cat(
            "\nReductions:\n"
          )

          print(
            Reductions(object)
          )

          cat(
            "\nIntegrated object successfully loaded.\n"
          )

          EOF


      # ============================================================
      # 25. RUN scAnnoX
      # ============================================================

      - name: Run scAnnoX annotation
        run: |

          echo "========================================"
          echo "Running scAnnoX annotation"
          echo "========================================"

          Rscript \
            scripts/08_annotation_scAnnoX.R


      # ============================================================
      # 26. COMPARE ANNOTATIONS
      # ============================================================

      - name: Compare annotations
        run: |

          echo "========================================"
          echo "Comparing annotations"
          echo "========================================"

          Rscript \
            scripts/09_compare_annotations.R


      # ============================================================
      # 27. DIFFERENTIAL EXPRESSION
      # ============================================================

      - name: Differential expression
        run: |

          echo "========================================"
          echo "Differential expression"
          echo "========================================"

          Rscript \
            scripts/10_differential_expression.R


      # ============================================================
      # 28. FINAL FIGURES
      # ============================================================

      - name: Generate final figures
        run: |

          echo "========================================"
          echo "Generating final figures"
          echo "========================================"

          Rscript \
            scripts/11_final_figures.R


      # ============================================================
      # 29. DISPLAY RESULTS
      # ============================================================

      - name: Display generated files
        run: |

          echo ""
          echo "========================================"
          echo "RESULTS"
          echo "========================================"

          find results \
            -type f \
            | sort || true

          echo ""
          echo "========================================"
          echo "FIGURES"
          echo "========================================"

          find figures \
            -type f \
            | sort || true

          echo ""
          echo "========================================"
          echo "DOCS"
          echo "========================================"

          find docs \
            -type f \
            | sort || true


      # ============================================================
      # 30. COMMIT RESULTS
      # ============================================================

      - name: Commit results
        run: |

          echo "========================================"
          echo "Committing generated results"
          echo "========================================"

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            results \
            figures \
            docs

          if git diff --cached --quiet; then

            echo ""
            echo "No new results to commit."

          else

            echo ""
            echo "Changes detected."

            git commit \
              -m "Resume AML scAnnoX annotation and downstream analysis"

            git push

            echo ""
            echo "Results pushed successfully."

          fi

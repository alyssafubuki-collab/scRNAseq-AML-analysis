name: Resume scAnnoX analysis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resume-scannox:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. SETUP R
      # ============================================================

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true


      # ============================================================
      # 3. SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            gfortran \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libgit2-dev \
            libglpk-dev \
            libgsl-dev \
            libhdf5-dev \
            liblapack-dev \
            libblas-dev


      # ============================================================
      # 4. R LIBRARY CONFIGURATION
      # ============================================================

      - name: Configure R library
        run: |

          echo "========================================"
          echo "R library configuration"
          echo "========================================"

          Rscript - <<'EOF'

          cat(
            "R version:\n"
          )

          print(
            R.version.string
          )

          cat(
            "\nR library paths:\n"
          )

          print(
            .libPaths()
          )

          EOF


      # ============================================================
      # 5. CRAN + Bioconductor
      # ============================================================

      - name: Install BiocManager
        run: |

          Rscript - <<'EOF'

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          if (
            !requireNamespace(
              "BiocManager",
              quietly = TRUE
            )
          ) {

            install.packages(
              "BiocManager",
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )
          }

          cat(
            "BiocManager ",
            as.character(
              packageVersion("BiocManager")
            ),
            " available.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 6. CORE CRAN PACKAGES
      #
      # IMPORTANT:
      # Do not use dependencies=TRUE because this pulls many
      # unnecessary Suggests packages.
      # ============================================================

      - name: Install core CRAN packages
        run: |

          Rscript - <<'EOF'

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          packages <- c(
            "Seurat",
            "SeuratObject",
            "dplyr",
            "ggplot2",
            "patchwork",
            "HGNChelper",
            "future",
            "Matrix",
            "data.table",
            "R.utils",
            "remotes",
            "devtools"
          )

          installed <- rownames(
            installed.packages()
          )

          missing <- setdiff(
            packages,
            installed
          )

          cat(
            "Missing core packages:\n"
          )

          print(missing)

          if (
            length(missing) > 0
          ) {

            install.packages(
              missing,
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )
          }

          cat(
            "\nCore CRAN packages installed.\n"
          )

          EOF


      # ============================================================
      # 7. CORE BIOCONDUCTOR PACKAGES
      # ============================================================

      - name: Install Bioconductor packages
        run: |

          Rscript - <<'EOF'

          BiocManager::install(
            c(
              "SingleCellExperiment",
              "SingleR",
              "celldex",
              "scuttle"
            ),
            ask = FALSE,
            update = FALSE
          )

          cat(
            "\nCore Bioconductor packages installed.\n"
          )

          EOF


      # ============================================================
      # 8. C++14 CONFIGURATION
      # ============================================================

      - name: Configure C++14
        run: |

          echo "========================================"
          echo "Configuring C++14"
          echo "========================================"

          mkdir -p "${HOME}/.R"

          cat > "${HOME}/.R/Makevars" <<'EOF'
          CXX_STD = CXX14
          CXX14STD = -std=gnu++14
          PKG_CXXFLAGS = -std=gnu++14
          EOF

          echo ""
          echo "===== ~/.R/Makevars ====="

          cat "${HOME}/.R/Makevars"

          echo ""
          echo "===== g++ ====="

          g++ --version

          echo ""
          echo "===== R compiler ====="

          R CMD config CXX
          R CMD config CXX11
          R CMD config CXX14
          R CMD config CXX14STD

          echo ""
          echo "===== C++14 test ====="

          cat > /tmp/test_cpp14.cpp <<'EOF'
          #include <iostream>

          template <typename T>
          auto test_function(T value) {
              return value;
          }

          int main() {
              std::cout << test_function(42) << std::endl;
              return 0;
          }
          EOF

          g++ \
            -std=gnu++14 \
            /tmp/test_cpp14.cpp \
            -o /tmp/test_cpp14

          /tmp/test_cpp14

          echo ""
          echo "C++14 configuration OK."


      # ============================================================
      # 9. Rcpp
      # ============================================================

      - name: Install Rcpp packages
        env:
          CXXFLAGS: "-std=gnu++14"
          PKG_CXXFLAGS: "-std=gnu++14"
        run: |

          Rscript - <<'EOF'

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          Sys.setenv(
            CXXFLAGS = "-std=gnu++14",
            PKG_CXXFLAGS = "-std=gnu++14"
          )

          packages <- c(
            "Rcpp",
            "RcppArmadillo"
          )

          installed <- rownames(
            installed.packages()
          )

          missing <- setdiff(
            packages,
            installed
          )

          if (
            length(missing) > 0
          ) {

            install.packages(
              missing,
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )
          }

          for (
            pkg in packages
          ) {

            if (
              !requireNamespace(
                pkg,
                quietly = TRUE
              )
            ) {

              stop(
                paste(
                  "Failed to install",
                  pkg
                )
              )
            }

            cat(
              pkg,
              " ",
              as.character(
                packageVersion(pkg)
              ),
              "\n",
              sep = ""
            )
          }

          EOF


      # ============================================================
      # 10. CARET
      #
      # Install separately so failure is immediately visible.
      # ============================================================

      - name: Install caret
        run: |

          echo "========================================"
          echo "Installing caret"
          echo "========================================"

          Rscript - <<'EOF'

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          if (
            !requireNamespace(
              "caret",
              quietly = TRUE
            )
          ) {

            install.packages(
              "caret",
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )
          }

          if (
            !requireNamespace(
              "caret",
              quietly = TRUE
            )
          ) {

            stop(
              "caret installation failed."
            )
          }

          cat(
            "caret ",
            as.character(
              packageVersion("caret")
            ),
            " installed successfully.\n",
            sep = ""
          )

          cat(
            "Location: ",
            find.package("caret"),
            "\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 11. OTHER scPred DEPENDENCIES
      # ============================================================

      - name: Install scPred dependencies
        run: |

          Rscript - <<'EOF'

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          packages <- c(
            "ggbeeswarm",
            "MLmetrics",
            "kernlab",
            "pROC"
          )

          installed <- rownames(
            installed.packages()
          )

          missing <- setdiff(
            packages,
            installed
          )

          if (
            length(missing) > 0
          ) {

            install.packages(
              missing,
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )
          }

          failed <- packages[
            !vapply(
              packages,
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ]

          if (
            length(failed) > 0
          ) {

            cat(
              "Failed packages:\n"
            )

            print(failed)

            stop(
              "scPred dependencies incomplete."
            )
          }

          cat(
            "All scPred dependencies installed.\n"
          )

          EOF


      # ============================================================
      # 12. HARMONY 1.2.4
      # ============================================================

      - name: Install Harmony 1.2.4
        run: |

          echo "========================================"
          echo "Installing/checking Harmony"
          echo "========================================"

          if Rscript -e '
            if (
              requireNamespace(
                "harmony",
                quietly = TRUE
              ) &&
              "HarmonyMatrix" %in%
              getNamespaceExports("harmony")
            ) {
              quit(status = 0)
            } else {
              quit(status = 1)
            }
          '
          then

            echo "HarmonyMatrix already available."

          else

            echo "Installing Harmony 1.2.4..."

            curl \
              -L \
              --fail \
              --retry 5 \
              --retry-delay 2 \
              "https://cran.r-project.org/src/contrib/Archive/harmony/harmony_1.2.4.tar.gz" \
              -o harmony_1.2.4.tar.gz

            R CMD INSTALL \
              --no-multiarch \
              --with-keep.source \
              harmony_1.2.4.tar.gz

          fi

          Rscript - <<'EOF'

          if (
            !requireNamespace(
              "harmony",
              quietly = TRUE
            )
          ) {

            stop(
              "Harmony installation failed."
            )
          }

          if (
            !"HarmonyMatrix" %in%
            getNamespaceExports("harmony")
          ) {

            stop(
              "HarmonyMatrix is unavailable."
            )
          }

          cat(
            "Harmony ",
            as.character(
              packageVersion("harmony")
            ),
            " ready.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 13. INSTALL scPred
      # ============================================================

      - name: Install scPred
        env:
          CXXFLAGS: "-std=gnu++14"
          PKG_CXXFLAGS: "-std=gnu++14"
        run: |

          echo "========================================"
          echo "Installing scPred"
          echo "========================================"

          Rscript - <<'EOF'

          required <- c(
            "caret",
            "harmony",
            "ggbeeswarm",
            "MLmetrics",
            "kernlab",
            "pROC"
          )

          failed <- required[
            !vapply(
              required,
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ]

          if (
            length(failed) > 0
          ) {

            print(failed)

            stop(
              "scPred dependencies are missing."
            )
          }

          cat(
            "All scPred dependencies verified.\n"
          )

          EOF

          echo ""
          echo "Downloading scPred..."

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            "https://github.com/powellgenomicslab/scPred/archive/refs/heads/master.tar.gz" \
            -o scPred.tar.gz

          echo ""
          ls -lh scPred.tar.gz

          echo ""
          echo "Installing scPred..."

          R CMD INSTALL \
            --no-multiarch \
            --with-keep.source \
            scPred.tar.gz

          echo ""
          echo "Verifying scPred..."

          Rscript -e '

            if (
              !requireNamespace(
                "scPred",
                quietly = TRUE
              )
            ) {

              stop(
                "scPred installation failed."
              )
            }

            cat(
              "scPred ",
              as.character(
                packageVersion("scPred")
              ),
              " installed successfully.\n",
              sep = ""
            )
          '


      # ============================================================
      # 14. scSorter
      #
      # ABSOLUTELY NO install.packages("scSorter")
      #
      # scSorter is installed directly from CRAN archive 0.0.2.
      # ============================================================

      - name: Install scSorter 0.0.2
        run: |

          echo "========================================"
          echo "Installing scSorter 0.0.2"
          echo "========================================"

          Rscript - <<'EOF'

          if (
            requireNamespace(
              "scSorter",
              quietly = TRUE
            )
          ) {

            cat(
              "scSorter already installed: ",
              as.character(
                packageVersion("scSorter")
              ),
              "\n",
              sep = ""
            )

            quit(
              save = "no",
              status = 0
            )
          }

          cat(
            "scSorter is not installed.\n"
          )

          EOF

          echo ""
          echo "Downloading archived scSorter..."

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            "https://cran.r-project.org/src/contrib/Archive/scSorter/scSorter_0.0.2.tar.gz" \
            -o scSorter_0.0.2.tar.gz

          echo ""
          echo "Archive:"
          ls -lh scSorter_0.0.2.tar.gz

          echo ""
          echo "Installing scSorter archive..."

          R CMD INSTALL \
            --no-multiarch \
            --with-keep.source \
            scSorter_0.0.2.tar.gz

          echo ""
          echo "Checking scSorter..."

          Rscript - <<'EOF'

          if (
            !requireNamespace(
              "scSorter",
              quietly = TRUE
            )
          ) {

            stop(
              "scSorter installation failed."
            )
          }

          cat(
            "scSorter ",
            as.character(
              packageVersion("scSorter")
            ),
            " installed successfully.\n",
            sep = ""
          )

          cat(
            "Location: ",
            find.package("scSorter"),
            "\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 15. scCATCH
      # ============================================================

      - name: Install scCATCH
        run: |

          Rscript - <<'EOF'

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          if (
            !requireNamespace(
              "scCATCH",
              quietly = TRUE
            )
          ) {

            install.packages(
              "scCATCH",
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )
          }

          if (
            !requireNamespace(
              "scCATCH",
              quietly = TRUE
            )
          ) {

            stop(
              "scCATCH installation failed."
            )
          }

          cat(
            "scCATCH ",
            as.character(
              packageVersion("scCATCH")
            ),
            " ready.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 16. scmap
      # ============================================================

      - name: Install scmap
        run: |

          Rscript - <<'EOF'

          if (
            !requireNamespace(
              "scmap",
              quietly = TRUE
            )
          ) {

            BiocManager::install(
              "scmap",
              ask = FALSE,
              update = FALSE
            )
          }

          if (
            !requireNamespace(
              "scmap",
              quietly = TRUE
            )
          ) {

            stop(
              "scmap installation failed."
            )
          }

          cat(
            "scmap ",
            as.character(
              packageVersion("scmap")
            ),
            " ready.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 17. CelliD
      # ============================================================

      - name: Install CelliD
        env:
          CXXFLAGS: "-std=gnu++14"
          PKG_CXXFLAGS: "-std=gnu++14"
          MAKEFLAGS: "-j2"
        run: |

          echo "========================================"
          echo "Installing CelliD"
          echo "========================================"

          cat "${HOME}/.R/Makevars"

          Rscript - <<'EOF'

          Sys.setenv(
            CXXFLAGS = "-std=gnu++14",
            PKG_CXXFLAGS = "-std=gnu++14"
          )

          if (
            !requireNamespace(
              "CelliD",
              quietly = TRUE
            )
          ) {

            BiocManager::install(
              "CelliD",
              ask = FALSE,
              update = FALSE,
              force = TRUE
            )
          }

          if (
            !requireNamespace(
              "CelliD",
              quietly = TRUE
            )
          ) {

            stop(
              "CelliD installation failed."
            )
          }

          cat(
            "CelliD ",
            as.character(
              packageVersion("CelliD")
            ),
            " installed successfully.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 18. CHETAH
      # ============================================================

      - name: Install CHETAH
        run: |

          Rscript - <<'EOF'

          if (
            !requireNamespace(
              "CHETAH",
              quietly = TRUE
            )
          ) {

            BiocManager::install(
              "CHETAH",
              ask = FALSE,
              update = FALSE
            )
          }

          if (
            !requireNamespace(
              "CHETAH",
              quietly = TRUE
            )
          ) {

            stop(
              "CHETAH installation failed."
            )
          }

          cat(
            "CHETAH ",
            as.character(
              packageVersion("CHETAH")
            ),
            " ready.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 19. SCINA 1.2.0
      # ============================================================

      - name: Install SCINA 1.2.0
        run: |

          echo "========================================"
          echo "Installing SCINA 1.2.0"
          echo "========================================"

          Rscript - <<'EOF'

          if (
            requireNamespace(
              "SCINA",
              quietly = TRUE
            )
          ) {

            cat(
              "SCINA already installed.\n"
            )

            quit(
              save = "no",
              status = 0
            )
          }

          EOF

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            "https://cran.r-project.org/src/contrib/Archive/SCINA/SCINA_1.2.0.tar.gz" \
            -o SCINA_1.2.0.tar.gz

          echo ""
          ls -lh SCINA_1.2.0.tar.gz

          R CMD INSTALL \
            --no-multiarch \
            --with-keep.source \
            SCINA_1.2.0.tar.gz

          Rscript -e '

            if (
              !requireNamespace(
                "SCINA",
                quietly = TRUE
              )
            ) {
              stop(
                "SCINA installation failed."
              )
            }

            cat(
              "SCINA ",
              as.character(
                packageVersion("SCINA")
              ),
              " ready.\n",
              sep = ""
            )
          '


      # ============================================================
      # 20. scibetR
      # ============================================================

      - name: Install scibetR
        run: |

          echo "========================================"
          echo "Installing scibetR"
          echo "========================================"

          Rscript - <<'EOF'

          if (
            requireNamespace(
              "scibetR",
              quietly = TRUE
            )
          ) {

            cat(
              "scibetR already installed.\n"
            )

            quit(
              save = "no",
              status = 0
            )
          }

          EOF

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            "https://github.com/zwj-tina/scibetR/archive/refs/heads/master.tar.gz" \
            -o scibetR.tar.gz

          echo ""
          ls -lh scibetR.tar.gz

          R CMD INSTALL \
            --no-multiarch \
            --with-keep.source \
            scibetR.tar.gz

          Rscript -e '

            if (
              !requireNamespace(
                "scibetR",
                quietly = TRUE
              )
            ) {
              stop(
                "scibetR installation failed."
              )
            }

            cat(
              "scibetR ",
              as.character(
                packageVersion("scibetR")
              ),
              " ready.\n",
              sep = ""
            )
          '


      # ============================================================
      # 21. FINAL DEPENDENCY CHECK
      # ============================================================

      - name: Verify all scAnnoX dependencies
        run: |

          echo "========================================"
          echo "Final scAnnoX dependency check"
          echo "========================================"

          Rscript - <<'EOF'

          required <- c(
            "Seurat",
            "SeuratObject",
            "SingleCellExperiment",
            "SingleR",
            "celldex",
            "scuttle",
            "scPred",
            "scSorter",
            "scCATCH",
            "SCINA",
            "scmap",
            "CelliD",
            "CHETAH",
            "scibetR"
          )

          failed <- character(0)

          for (
            pkg in required
          ) {

            if (
              requireNamespace(
                pkg,
                quietly = TRUE
              )
            ) {

              cat(
                "OK       ",
                pkg,
                " ",
                as.character(
                  packageVersion(pkg)
                ),
                "\n",
                sep = ""
              )

            } else {

              cat(
                "FAILED   ",
                pkg,
                "\n",
                sep = ""
              )

              failed <- c(
                failed,
                pkg
              )
            }
          }

          if (
            length(failed) > 0
          ) {

            cat(
              "\nMissing packages:\n"
            )

            print(failed)

            stop(
              "scAnnoX dependencies are incomplete."
            )
          }

          cat(
            "\nAll scAnnoX dependencies are available.\n"
          )

          EOF


      # ============================================================
      # 22. VERIFY scSorter AGAIN
      #
      # This is intentionally before scAnnoX installation.
      # ============================================================

      - name: Verify scSorter before scAnnoX
        run: |

          Rscript - <<'EOF'

          if (
            !requireNamespace(
              "scSorter",
              quietly = TRUE
            )
          ) {

            stop(
              paste(
                "scSorter is unavailable before scAnnoX installation.",
                "This must be fixed before continuing."
              )
            )
          }

          cat(
            "scSorter available: ",
            as.character(
              packageVersion("scSorter")
            ),
            "\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 23. VERIFY LOCAL scAnnoX SOURCE
      # ============================================================

      - name: Verify local scAnnoX source
        run: |

          echo "========================================"
          echo "Checking local scAnnoX"
          echo "========================================"

          SCANNOX_PATH="files/external/scAnnoX"

          if [
            ! -f "${SCANNOX_PATH}/DESCRIPTION"
          ]; then

            echo ""
            echo "ERROR:"
            echo "${SCANNOX_PATH}/DESCRIPTION does not exist."

            echo ""
            echo "Searching repository for scAnnoX:"

            find . \
              -type f \
              -name "DESCRIPTION" \
              | grep -i "scanno" \
              || true

            exit 1
          fi

          echo ""
          echo "scAnnoX source:"
          echo "${SCANNOX_PATH}"

          echo ""
          echo "DESCRIPTION:"
          cat "${SCANNOX_PATH}/DESCRIPTION"


      # ============================================================
      # 24. INSTALL LOCAL MODIFIED scAnnoX
      #
      # IMPORTANT:
      # Do NOT use remotes::install_local(... dependencies=TRUE).
      #
      # All dependencies were already installed above.
      # ============================================================

      - name: Install local modified scAnnoX
        run: |

          echo "========================================"
          echo "Installing modified local scAnnoX"
          echo "========================================"

          R CMD INSTALL \
            --no-multiarch \
            --with-keep.source \
            files/external/scAnnoX

          echo ""
          echo "Verifying scAnnoX..."

          Rscript - <<'EOF'

          if (
            !requireNamespace(
              "scAnnoX",
              quietly = TRUE
            )
          ) {

            stop(
              "scAnnoX installation failed."
            )
          }

          cat(
            "scAnnoX ",
            as.character(
              packageVersion("scAnnoX")
            ),
            " installed successfully.\n",
            sep = ""
          )

          cat(
            "Location: ",
            find.package("scAnnoX"),
            "\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 25. VERIFY scAnnoX FUNCTIONS
      # ============================================================

      - name: Verify scAnnoX functions
        run: |

          Rscript - <<'EOF'

          library(scAnnoX)

          expected <- c(
            "annoResult",
            "autoAnnoTools",
            "findMarkerToolsForSc",
            "findMarkersBySeurat",
            "listToolMethods",
            "multipleProcess",
            "sccatchAnno",
            "sciBetAnno",
            "scinaAnno",
            "scmapAnno",
            "scsorterAnno",
            "sctypeAnno",
            "seuratAnno",
            "singleRAnno"
          )

          failed <- character(0)

          for (
            fun in expected
          ) {

            if (
              exists(
                fun,
                where = asNamespace("scAnnoX"),
                inherits = FALSE
              )
            ) {

              cat(
                "OK       ",
                fun,
                "\n",
                sep = ""
              )

            } else {

              cat(
                "FAILED   ",
                fun,
                "\n",
                sep = ""
              )

              failed <- c(
                failed,
                fun
              )
            }
          }

          if (
            length(failed) > 0
          ) {

            print(failed)

            stop(
              "scAnnoX function verification failed."
            )
          }

          cat(
            "\nAll expected scAnnoX functions are available.\n"
          )

          cat(
            "\nAvailable annotation methods:\n"
          )

          print(
            listToolMethods()
          )

          EOF



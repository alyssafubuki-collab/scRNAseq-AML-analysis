name: Resume scAnnoX analysis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resume-scannox:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. DEBUG - VERIFY WORKFLOW SOURCE
      # ============================================================

      - name: DEBUG - Verify workflow source
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "WORKFLOW DEBUG"
          echo "============================================================"

          echo ""
          echo "Git branch:"
          git branch --show-current

          echo ""
          echo "Git commit:"
          git rev-parse HEAD

          echo ""
          echo "Workflow files:"
          find .github/workflows \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo ""
          echo "============================================================"
          echo "scSorter REFERENCES"
          echo "============================================================"

          grep -Rni \
            --exclude-dir=.git \
            "scSorter" \
            .github/workflows \
            || true

          echo ""
          echo "============================================================"
          echo "install.packages REFERENCES INVOLVING scSorter"
          echo "============================================================"

          grep -Rni \
            --exclude-dir=.git \
            'install\.packages.*scSorter' \
            . \
            || true


      # ============================================================
      # 3. SETUP R
      # ============================================================

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true


      # ============================================================
      # 4. SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpng-dev \
            libjpeg-dev \
            libtiff-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libgit2-dev \
            libglpk-dev \
            libgsl-dev \
            libicu-dev \
            libhdf5-dev \
            liblapack-dev \
            libblas-dev \
            gfortran \
            make \
            g++ \
            gcc \
            curl \
            wget \
            tar


      # ============================================================
      # 5. BIOCONDUCTOR MANAGER
      # ============================================================

      - name: Install BiocManager
        shell: bash
        run: |
          set -euo pipefail

          Rscript -e '
            options(repos = c(
              CRAN = "https://packagemanager.posit.co/cran/latest"
            ))

            if (!requireNamespace("BiocManager", quietly = TRUE)) {
              install.packages("BiocManager")
            }

            cat("BiocManager version:",
                as.character(packageVersion("BiocManager")),
                "\n")
          '


      # ============================================================
      # 6. CORE CRAN PACKAGES
      # ============================================================

      - name: Install core CRAN packages
        shell: bash
        run: |
          set -euo pipefail

          Rscript -e '
            options(
              repos = c(
                CRAN = "https://packagemanager.posit.co/cran/latest"
              ),
              Ncpus = 2
            )

            packages <- c(
              "Matrix",
              "Rcpp",
              "RcppArmadillo",
              "dplyr",
              "tidyr",
              "tibble",
              "ggplot2",
              "patchwork",
              "cowplot",
              "data.table",
              "readr",
              "stringr",
              "purrr",
              "future",
              "future.apply",
              "progressr",
              "irlba",
              "uwot",
              "Rtsne",
              "igraph",
              "jsonlite",
              "yaml",
              "remotes",
              "devtools",
              "curl",
              "httr",
              "httr2",
              "RColorBrewer",
              "viridis",
              "pheatmap",
              "ggrepel",
              "scales",
              "reshape2",
              "magrittr"
            )

            missing <- packages[
              !vapply(
                packages,
                requireNamespace,
                logical(1),
                quietly = TRUE
              )
            ]

            if (length(missing) > 0) {
              cat("Installing missing packages:\n")
              print(missing)

              install.packages(
                missing,
                dependencies = TRUE
              )
            }

            cat("\nCore CRAN packages verified.\n")
          '


      # ============================================================
      # 7. SEURAT WEB DEPENDENCIES
      # ============================================================

      - name: Install Seurat dependencies
        shell: bash
        run: |
          set -euo pipefail

          Rscript -e '
            options(
              repos = c(
                CRAN = "https://packagemanager.posit.co/cran/latest"
              ),
              Ncpus = 2
            )

            packages <- c(
              "SeuratObject",
              "RANN",
              "RcppAnnoy",
              "RcppHNSW",
              "FNN",
              "leiden",
              "sctransform",
              "spatstat.explore",
              "spatstat.geom",
              "spatstat.random",
              "spatstat.sparse",
              "spatstat.utils",
              "igraph",
              "future",
              "future.apply",
              "progressr",
              "Rfast2",
              "fastDummies"
            )

            missing <- packages[
              !vapply(
                packages,
                requireNamespace,
                logical(1),
                quietly = TRUE
              )
            ]

            if (length(missing) > 0) {
              install.packages(
                missing,
                dependencies = TRUE
              )
            }

            cat("Seurat dependencies verified.\n")
          '


      # ============================================================
      # 8. INSTALL SEURAT
      # ============================================================

      - name: Install Seurat
        shell: bash
        run: |
          set -euo pipefail

          Rscript -e '
            options(
              repos = c(
                CRAN = "https://packagemanager.posit.co/cran/latest"
              ),
              Ncpus = 2
            )

            if (!requireNamespace("Seurat", quietly = TRUE)) {
              install.packages(
                "Seurat",
                dependencies = TRUE
              )
            }

            cat(
              "Seurat version:",
              as.character(packageVersion("Seurat")),
              "\n"
            )

            cat(
              "SeuratObject version:",
              as.character(packageVersion("SeuratObject")),
              "\n"
            )
          '


      # ============================================================
      # 9. BIOCONDUCTOR PACKAGES
      # ============================================================

      - name: Install Bioconductor packages
        shell: bash
        run: |
          set -euo pipefail

          Rscript -e '
            options(
              repos = BiocManager::repositories(),
              Ncpus = 2
            )

            packages <- c(
              "SingleCellExperiment",
              "SingleR",
              "celldex",
              "scuttle"
            )

            missing <- packages[
              !vapply(
                packages,
                requireNamespace,
                logical(1),
                quietly = TRUE
              )
            ]

            if (length(missing) > 0) {
              cat("Installing Bioconductor packages:\n")
              print(missing)

              BiocManager::install(
                missing,
                ask = FALSE,
                update = FALSE
              )
            }

            cat("Bioconductor packages verified.\n")
          '


      # ============================================================
      # 10. GLOBAL C++14 CONFIGURATION
      # ============================================================

      - name: Configure C++14
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.R"

          cat > "${HOME}/.R/Makevars" <<'EOF'
          CXX_STD = CXX14
          CXX14 = g++
          CXX14FLAGS = -O2 -pipe
          CXX14STD = -std=gnu++14
          EOF

          echo "Created ${HOME}/.R/Makevars:"
          cat "${HOME}/.R/Makevars"


      # ============================================================
      # 11. Rcpp / RcppArmadillo
      # ============================================================

      - name: Verify Rcpp and RcppArmadillo
        shell: bash
        run: |
          set -euo pipefail

          Rscript -e '
            cat(
              "Rcpp:",
              as.character(packageVersion("Rcpp")),
              "\n"
            )

            cat(
              "RcppArmadillo:",
              as.character(packageVersion("RcppArmadillo")),
              "\n"
            )
          '


      # ============================================================
      # 12. TEMPORARILY DISABLE GLOBAL MAKEVARS
      # ============================================================

      - name: Prepare Makevars for caret dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "${HOME}/.R/Makevars" ]; then
            mv "${HOME}/.R/Makevars" "${HOME}/.R/Makevars.scannox"
          fi

          echo "Global Makevars temporarily disabled."


      # ============================================================
      # 13. CARET DEPENDENCIES
      # ============================================================

      - name: Install caret dependencies
        shell: bash
        run: |
          set -euo pipefail

          Rscript -e '
            options(
              repos = c(
                CRAN = "https://packagemanager.posit.co/cran/latest"
              ),
              Ncpus = 2
            )

            packages <- c(
              "caret",
              "lattice",
              "e1071",
              "ModelMetrics",
              "recipes",
              "dplyr",
              "tibble",
              "plyr",
              "foreach",
              "iterators",
              "clock",
              "tzdb"
            )

            missing <- packages[
              !vapply(
                packages,
                requireNamespace,
                logical(1),
                quietly = TRUE
              )
            ]

            if (length(missing) > 0) {
              install.packages(
                missing,
                dependencies = TRUE
              )
            }

            cat("caret dependencies verified.\n")
          '


      # ============================================================
      # 14. RESTORE GLOBAL MAKEVARS
      # ============================================================

      - name: Restore C++14 Makevars
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "${HOME}/.R/Makevars.scannox" ]; then
            mv "${HOME}/.R/Makevars.scannox" "${HOME}/.R/Makevars
          fi

          echo "Global C++14 Makevars restored."


      # ============================================================
      # 15. INSTALL scPred DEPENDENCIES
      # ============================================================

      - name: Install scPred dependencies
        shell: bash
        run: |
          set -euo pipefail

          Rscript -e '
            options(
              repos = c(
                CRAN = "https://packagemanager.posit.co/cran/latest"
              ),
              Ncpus = 2
            )

            packages <- c(
              "caret",
              "glmnet",
              "randomForest",
              "e1071",
              "pROC",
              "Rtsne",
              "ranger"
            )

            missing <- packages[
              !vapply(
                packages,
                requireNamespace,
                logical(1),
                quietly = TRUE
              )
            ]

            if (length(missing) > 0) {
              install.packages(
                missing,
                dependencies = TRUE
              )
            }

            cat("scPred dependencies verified.\n")
          '


      # ============================================================
      # 16. INSTALL HARMONY
      # ============================================================

      - name: Install Harmony 1.2.4
        shell: bash
        run: |
          set -euo pipefail

          Rscript -e '
            options(
              repos = c(
                CRAN = "https://packagemanager.posit.co/cran/latest"
              )
            )

            required_version <- "1.2.4"

            if (
              !requireNamespace("harmony", quietly = TRUE) ||
              as.character(packageVersion("harmony")) != required_version
            ) {
              remove.packages(
                "harmony",
                lib = .libPaths()[1]
              )

              install.packages(
                "https://cran.r-project.org/src/contrib/Archive/harmony/harmony_1.2.4.tar.gz",
                repos = NULL,
                type = "source"
              )
            }

            cat(
              "Harmony version:",
              as.character(packageVersion("harmony")),
              "\n"
            )
          '


      # ============================================================
      # 17. INSTALL scPred
      # ============================================================

      - name: Install scPred
        shell: bash
        run: |
          set -euo pipefail

          Rscript -e '
            options(
              repos = c(
                CRAN = "https://packagemanager.posit.co/cran/latest"
              )
            )

            if (!requireNamespace("scPred", quietly = TRUE)) {

              tmp <- tempfile(
                fileext = ".tar.gz"
              )

              download.file(
                "https://github.com/powellgenomics/scPred/archive/refs/heads/master.tar.gz",
                tmp,
                mode = "wb"
              )

              install.packages(
                tmp,
                repos = NULL,
                type = "source"
              )
            }

            cat(
              "scPred version:",
              as.character(packageVersion("scPred")),
              "\n"
            )
          '

# ============================================================
# 18. INSTALL scSorter FROM R-UNIVERSE (RECOMMANDÉ)
# ============================================================

      - name: Install scSorter 0.0.2 from r-universe
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "INSTALLING scSorter 0.0.2 FROM R-UNIVERSE"
          echo "============================================================"

          Rscript -e '
            options(
              repos = c(
                "https://jli-stat.r-universe.dev",
                "https://packagemanager.posit.co/cran/latest"
               )
           )

           required_version <- "0.0.2"

           if (
              !requireNamespace("scSorter", quietly = TRUE) ||
              as.character(packageVersion("scSorter")) != required_version
              ) {

             if (requireNamespace("scSorter", quietly = TRUE)) {
              remove.packages("scSorter")
          }

             install.packages(
                "scSorter",
                dependencies = TRUE
                )
            }

          version <- as.character(packageVersion("scSorter"))

          cat(
          "Installed scSorter version:",
          version,
          "\n"
          )

          if (version != required_version) {
          stop(
          paste(
            "Unexpected scSorter version:",
            version,
            "- expected 0.0.2"
          )
          )
          }

          library(scSorter)
          cat("scSorter loaded successfully.\n")
          '

          echo ""
          echo "============================================================"
          echo "scSorter CHECK COMPLETE"
          echo "============================================================"
    

      # ============================================================
      # 19. scCATCH
      # ============================================================

      - name: Install scCATCH
        shell: bash
        run: |
          set -euo pipefail

          Rscript -e '
            options(
              repos = c(
                CRAN = "https://packagemanager.posit.co/cran/latest"
              )
            )

            if (!requireNamespace("scCATCH", quietly = TRUE)) {
              install.packages(
                "scCATCH",
                dependencies = TRUE
              )
            }

            cat(
              "scCATCH version:",
              as.character(packageVersion("scCATCH")),
              "\n"
            )
          '


      # ============================================================
      # 20. scmap
      # ============================================================

      - name: Install scmap
        shell: bash
        run: |
          set -euo pipefail

          Rscript -e '
            if (!requireNamespace("scmap", quietly = TRUE)) {
              BiocManager::install(
                "scmap",
                ask = FALSE,
                update = FALSE
              )
            }

            cat(
              "scmap version:",
              as.character(packageVersion("scmap")),
              "\n"
            )
          '


      # ============================================================
      # 21. CelliD
      # ============================================================

      - name: Install CelliD
        shell: bash
        run: |
          set -euo pipefail

          Rscript -e '
            if (!requireNamespace("CelliD", quietly = TRUE)) {
              BiocManager::install(
                "CelliD",
                ask = FALSE,
                update = FALSE
              )
            }

            cat(
              "CelliD version:",
              as.character(packageVersion("CelliD")),
              "\n"
            )
          '


      # ============================================================
      # 22. CHETAH
      # ============================================================

      - name: Install CHETAH
        shell: bash
        run: |
          set -euo pipefail

          Rscript -e '
            if (!requireNamespace("CHETAH", quietly = TRUE)) {
              BiocManager::install(
                "CHETAH",
                ask = FALSE,
                update = FALSE
              )
            }

            cat(
              "CHETAH version:",
              as.character(packageVersion("CHETAH")),
              "\n"
            )
          '


      # ============================================================
      # 23. SCINA
      # ============================================================

      - name: Install SCINA 1.2.0
        shell: bash
        run: |
          set -euo pipefail

          Rscript -e '
            required_version <- "1.2.0"

            if (
              !requireNamespace("SCINA", quietly = TRUE) ||
              as.character(packageVersion("SCINA")) != required_version
            ) {

              install.packages(
                "https://cran.r-project.org/src/contrib/Archive/SCINA/SCINA_1.2.0.tar.gz",
                repos = NULL,
                type = "source"
              )
            }

            cat(
              "SCINA version:",
              as.character(packageVersion("SCINA")),
              "\n"
            )
          '


      # ============================================================
      # 24. scibetR
      # ============================================================

      - name: Install scibetR
        shell: bash
        run: |
          set -euo pipefail

          Rscript -e '
            if (!requireNamespace("scibetR", quietly = TRUE)) {

              if (!requireNamespace("remotes", quietly = TRUE)) {
                install.packages("remotes")
              }

              remotes::install_github(
                "huynguyen245/scibetR",
                dependencies = TRUE,
                upgrade = "never"
              )
            }

            cat(
              "scibetR version:",
              as.character(packageVersion("scibetR")),
              "\n"
            )
          '


      # ============================================================
      # 25. VERIFY ALL ANNOTATION DEPENDENCIES
      # ============================================================

      - name: Verify annotation dependencies
        shell: bash
        run: |
          set -euo pipefail

          Rscript -e '
            packages <- c(
              "Seurat",
              "SeuratObject",
              "SingleCellExperiment",
              "SingleR",
              "celldex",
              "scuttle",
              "scPred",
              "scSorter",
              "scCATCH",
              "scmap",
              "CelliD",
              "CHETAH",
              "SCINA",
              "scibetR",
              "harmony"
            )

            cat(
              "============================================================\n"
            )

            cat(
              "ANNOTATION DEPENDENCY VERIFICATION\n"
            )

            cat(
              "============================================================\n\n"
            )

            failed <- character()

            for (pkg in packages) {

              if (requireNamespace(pkg, quietly = TRUE)) {

                cat(
                  pkg,
                  ": ",
                  as.character(packageVersion(pkg)),
                  "\n",
                  sep = ""
                )

              } else {

                cat(
                  pkg,
                  ": NOT INSTALLED\n",
                  sep = ""
                )

                failed <- c(
                  failed,
                  pkg
                )
              }
            }

            cat("\n")

            if (length(failed) > 0) {
              stop(
                paste(
                  "Missing packages:",
                  paste(failed, collapse = ", ")
                )
              )
            }

            cat(
              "All annotation dependencies are available.\n"
            )
          '


      # ============================================================
      # 26. VERIFY LOCAL scAnnoX SOURCE
      # ============================================================

      - name: Verify local scAnnoX source
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "VERIFYING LOCAL scAnnoX"
          echo "============================================================"

          if [ ! -d "files/external/scAnnoX" ]; then
            echo "ERROR: files/external/scAnnoX does not exist."
            exit 1
          fi

          if [ ! -f "files/external/scAnnoX/DESCRIPTION" ]; then
            echo "ERROR: scAnnoX DESCRIPTION file not found."
            exit 1
          fi

          echo ""
          echo "scAnnoX DESCRIPTION:"
          cat files/external/scAnnoX/DESCRIPTION

          echo ""
          echo "scAnnoX files:"
          find files/external/scAnnoX \
            -maxdepth 2 \
            -type f \
            | sort


      # ============================================================
      # 27. INSTALL LOCAL scAnnoX
      # ============================================================

      - name: Install local scAnnoX
        shell: bash
        run: |
          set -euo pipefail

          Rscript -e '
            options(
              repos = c(
                CRAN = "https://packagemanager.posit.co/cran/latest"
              )
            )

            package_path <- "files/external/scAnnoX"

            if (!dir.exists(package_path)) {
              stop(
                "scAnnoX source directory not found: ",
                package_path
              )
            }

            if (!file.exists(
              file.path(
                package_path,
                "DESCRIPTION"
              )
            )) {
              stop(
                "scAnnoX DESCRIPTION not found."
              )
            }

            if (
              requireNamespace(
                "scAnnoX",
                quietly = TRUE
              )
            ) {
              remove.packages("scAnnoX")
            }

            if (
              !requireNamespace(
                "remotes",
                quietly = TRUE
              )
            ) {
              install.packages("remotes")
            }

            remotes::install_local(
              package_path,
              dependencies = TRUE,
              upgrade = "never"
            )

            cat(
              "scAnnoX installed successfully.\n"
            )
          '


      # ============================================================
      # 28. VERIFY scAnnoX
      # ============================================================

      - name: Verify scAnnoX
        shell: bash
        run: |
          set -euo pipefail

          Rscript -e '
            if (!requireNamespace("scAnnoX", quietly = TRUE)) {
              stop("scAnnoX is not installed.")
            }

            cat(
              "scAnnoX version:",
              as.character(packageVersion("scAnnoX")),
              "\n"
            )

            library(scAnnoX)

            exported <- getNamespaceExports(
              "scAnnoX"
            )

            cat(
              "\nExported functions:\n"
            )

            print(exported)

            cat(
              "\nscAnnoX loaded successfully.\n"
            )
          '


      # ============================================================
      # 29. CHECK INTEGRATED OBJECT
      # ============================================================

      - name: Check integrated Seurat object
        shell: bash
        run: |
          set -euo pipefail

          OBJECT="results/objects/05_integrated.rds"

          echo "============================================================"
          echo "CHECKING INTEGRATED OBJECT"
          echo "============================================================"

          if [ ! -f "${OBJECT}" ]; then
            echo "ERROR:"
            echo "${OBJECT} not found."
            exit 1
          fi

          ls -lh "${OBJECT}"

          Rscript -e '
            obj <- readRDS(
              "results/objects/05_integrated.rds"
            )

            cat(
              "Class:",
              paste(class(obj), collapse = ", "),
              "\n"
            )

            if ("Seurat" %in% class(obj)) {

              cat(
                "Cells:",
                ncol(obj),
                "\n"
              )

              cat(
                "Features:",
                nrow(obj),
                "\n"
              )

              cat(
                "Assays:",
                paste(
                  names(obj@assays),
                  collapse = ", "
                ),
                "\n"
              )

            } else {

              stop(
                "05_integrated.rds is not a Seurat object."
              )
            }
          '


      # ============================================================
      # 30. RUN scAnnoX ANNOTATION
      # ============================================================

      - name: Run scAnnoX annotation
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "RUNNING scAnnoX ANNOTATION"
          echo "============================================================"

          Rscript scripts/08_annotation_scAnnoX.R


      # ============================================================
      # 31. COMPARE ANNOTATIONS
      # ============================================================

      - name: Compare annotations
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "COMPARING ANNOTATIONS"
          echo "============================================================"

          Rscript scripts/09_compare_annotations.R


      # ============================================================
      # 32. DIFFERENTIAL EXPRESSION
      # ============================================================

      - name: Run differential expression
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "DIFFERENTIAL EXPRESSION"
          echo "============================================================"

          Rscript scripts/10_differential_expression.R


      # ============================================================
      # 33. FINAL FIGURES
      # ============================================================

      - name: Generate final figures
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "FINAL FIGURES"
          echo "============================================================"

          Rscript scripts/11_final_figures.R


      # ============================================================
      # 34. DISPLAY RESULTS
      # ============================================================

      - name: Display generated results
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "GENERATED RESULTS"
          echo "============================================================"

          echo ""
          echo "results/:"

          find results \
            -type f \
            -print \
            | sort

          echo ""
          echo "figures/:"

          if [ -d "figures" ]; then
            find figures \
              -type f \
              -print \
              | sort
          else
            echo "No figures directory."
          fi

          echo ""
          echo "docs/:"

          if [ -d "docs" ]; then
            find docs \
              -type f \
              -print \
              | sort
          else
            echo "No docs directory."
          fi


      # ============================================================
      # 35. GIT STATUS
      # ============================================================

      - name: Git status
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "GIT STATUS"
          echo "============================================================"

          git status --short


      # ============================================================
      # 36. COMMIT AND PUSH RESULTS
      # ============================================================

      - name: Commit and push results
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "COMMIT AND PUSH"
          echo "============================================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            results \
            figures \
            docs \
            || true

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit \
              -m "Update scAnnoX annotation and final analysis results"

            git push

          fi

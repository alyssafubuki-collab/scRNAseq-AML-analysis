name: Resume scAnnoX analysis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resume-scannox:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. SETUP R
      # ============================================================

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true


      # ============================================================
      # 3. SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            gfortran \
            curl \
            file \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libgit2-dev \
            libglpk-dev \
            libgsl-dev \
            libhdf5-dev \
            liblapack-dev \
            libblas-dev \
            libuv1-dev


      # ============================================================
      # 4. R CONFIGURATION
      # ============================================================

      - name: Configure R
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "R CONFIGURATION"
          echo "============================================================"

          Rscript -e 'cat(R.version.string, "\n")'
          Rscript -e 'print(.libPaths())'


      # ============================================================
      # 5. BIOCMANAGER
      # ============================================================

      - name: Install BiocManager
        shell: bash
        run: |
          set -euo pipefail

          Rscript - <<'EOF'
          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          if (!requireNamespace("BiocManager", quietly = TRUE)) {
            install.packages(
              "BiocManager",
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )
          }

          if (!requireNamespace("BiocManager", quietly = TRUE)) {
            stop("BiocManager installation failed.")
          }

          cat(
            "BiocManager ",
            as.character(packageVersion("BiocManager")),
            " available.\n",
            sep = ""
          )
          EOF


      # ============================================================
      # 6. CORE CRAN PACKAGES
      # ============================================================

      - name: Install core CRAN packages
        shell: bash
        run: |
          set -euo pipefail

          Rscript - <<'EOF'
          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          options(
            Ncpus = 2
          )

          packages <- c(
            "SeuratObject",
            "dplyr",
            "ggplot2",
            "patchwork",
            "HGNChelper",
            "future",
            "Matrix",
            "data.table",
            "R.utils"
          )

          installed <- rownames(installed.packages())

          missing <- setdiff(
            packages,
            installed
          )

          if (length(missing) > 0) {

            cat("Installing core packages:\n")
            print(missing)

            install.packages(
              missing,
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )
          }

          failed <- packages[
            !vapply(
              packages,
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ]

          if (length(failed) > 0) {
            cat("Missing core packages:\n")
            print(failed)
            stop("Core CRAN package installation failed.")
          }

          cat("Core CRAN packages installed.\n")
          EOF


      # ============================================================
      # 6.b SEURAT WEB/GUI DEPENDENCIES
      # ============================================================

      - name: Install Seurat web dependencies
        shell: bash
        run: |
          set -euo pipefail

          Rscript - <<'EOF'
          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          options(
            Ncpus = 2
          )

          packages <- c(
            "fs",
            "sass",
            "bslib",
            "rmarkdown",
            "shiny",
            "htmlwidgets",
            "miniUI",
            "plotly"
          )

          for (pkg in packages) {

            cat(
              "\n============================================================\n",
              "Installing ",
              pkg,
              "\n",
              "============================================================\n",
              sep = ""
            )

            if (!requireNamespace(pkg, quietly = TRUE)) {

              install.packages(
                pkg,
                dependencies = c(
                  "Depends",
                  "Imports",
                  "LinkingTo"
                )
              )
            }

            if (!requireNamespace(pkg, quietly = TRUE)) {
              stop(
                paste0(
                  "Installation failed for package: ",
                  pkg
                )
              )
            }

            cat(
              pkg,
              " ",
              as.character(packageVersion(pkg)),
              " installed successfully.\n",
              sep = ""
            )
          }

          cat("\nAll Seurat web dependencies installed.\n")
          EOF


      # ============================================================
      # 6.c SEURAT
      # ============================================================

      - name: Install Seurat
        shell: bash
        run: |
          set -euo pipefail

          Rscript - <<'EOF'
          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          options(
            Ncpus = 2
          )

          if (!requireNamespace("Seurat", quietly = TRUE)) {

            install.packages(
              "Seurat",
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )
          }

          if (!requireNamespace("Seurat", quietly = TRUE)) {
            stop("Seurat installation failed.")
          }

          cat(
            "Seurat ",
            as.character(packageVersion("Seurat")),
            " installed successfully.\n",
            sep = ""
          )
          EOF


      # ============================================================
      # 7. BIOCONDUCTOR
      # ============================================================

      - name: Install Bioconductor packages
        shell: bash
        run: |
          set -euo pipefail

          Rscript - <<'EOF'
          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          if (!requireNamespace("BiocManager", quietly = TRUE)) {
            stop("BiocManager is not available.")
          }

          BiocManager::install(
            c(
              "SingleCellExperiment",
              "SingleR",
              "celldex",
              "scuttle"
            ),
            ask = FALSE,
            update = FALSE
          )

          required <- c(
            "SingleCellExperiment",
            "SingleR",
            "celldex",
            "scuttle"
          )

          failed <- required[
            !vapply(
              required,
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ]

          if (length(failed) > 0) {
            print(failed)
            stop("Bioconductor installation incomplete.")
          }

          cat("All Bioconductor packages installed.\n")
          EOF


      # ============================================================
      # 8. C++14
      # ============================================================

      - name: Configure C++14
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.R"

          cat > "${HOME}/.R/Makevars" <<'EOF'
          CXX_STD = CXX14
          CXX14STD = -std=gnu++14
          PKG_CXXFLAGS = -std=gnu++14
          EOF

          echo "===== ~/.R/Makevars ====="
          cat "${HOME}/.R/Makevars"

          echo "===== R C++14 configuration ====="
          R CMD config CXX14
          R CMD config CXX14STD

          echo "===== C++14 compilation test ====="

          cat > /tmp/test_cpp14.cpp <<'EOF'
          #include <iostream>

          template <typename T>
          auto test_function(T value) {
              return value;
          }

          int main() {
              std::cout << test_function(42) << std::endl;
              return 0;
          }
          EOF

          g++ \
            -std=gnu++14 \
            /tmp/test_cpp14.cpp \
            -o /tmp/test_cpp14

          /tmp/test_cpp14

          echo "C++14 configuration OK."


      # ============================================================
      # 9. RCPP
      # ============================================================

      - name: Install Rcpp packages
        shell: bash
        env:
          CXXFLAGS: "-std=gnu++14"
          PKG_CXXFLAGS: "-std=gnu++14"
        run: |
          set -euo pipefail

          Rscript - <<'EOF'
          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          Sys.setenv(
            CXXFLAGS = "-std=gnu++14",
            PKG_CXXFLAGS = "-std=gnu++14"
          )

          packages <- c(
            "Rcpp",
            "RcppArmadillo"
          )

          installed <- rownames(installed.packages())

          missing <- setdiff(
            packages,
            installed
          )

          if (length(missing) > 0) {

            install.packages(
              missing,
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )
          }

          failed <- packages[
            !vapply(
              packages,
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ]

          if (length(failed) > 0) {
            print(failed)
            stop("Rcpp installation failed.")
          }

          cat("Rcpp packages installed.\n")
          EOF


      # ============================================================
      # 9.b DISABLE GLOBAL C++14 OVERRIDE FOR CARET / TZDB
      # ============================================================

      - name: Disable global C++14 override before caret/tzdb
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "${HOME}/.R/Makevars" ]; then
            mv \
              "${HOME}/.R/Makevars" \
              "${HOME}/.R/Makevars.disabled"

            echo "Global ~/.R/Makevars disabled for this step."
          else
            echo "No global ~/.R/Makevars present."
          fi


      # ============================================================
      # 10. CARET
      # ============================================================

      - name: Install caret dependencies and caret
        shell: bash
        run: |
          set -euo pipefail

          Rscript - <<'EOF'

          rspm <- Sys.getenv("RSPM")

          if (!nzchar(rspm)) {
            stop(
              "RSPM is not configured. setup-r must provide RSPM."
            )
          }

          options(
            repos = c(
              CRAN = rspm
            ),
            Ncpus = 2
          )

          cat(
            "Using CRAN repository: ",
            getOption("repos")["CRAN"],
            "\n",
            sep = ""
          )

          cat(
            "RSPM: ",
            rspm,
            "\n",
            sep = ""
          )

          packages <- c(
            "tzdb",
            "clock",
            "recipes",
            "caret"
          )

          for (pkg in packages) {

            cat(
              "\n============================================================\n",
              "Installing ",
              pkg,
              "\n",
              "============================================================\n",
              sep = ""
            )

            if (!requireNamespace(pkg, quietly = TRUE)) {

              install.packages(
                pkg,
                dependencies = c(
                  "Depends",
                  "Imports",
                  "LinkingTo"
                )
              )
            }

            if (!requireNamespace(pkg, quietly = TRUE)) {
              stop(
                paste0(
                  "Installation failed for package: ",
                  pkg
                )
              )
            }

            cat(
              pkg,
              " ",
              as.character(packageVersion(pkg)),
              " installed successfully.\n",
              sep = ""
            )
          }

          cat(
            "\nAll caret dependencies installed successfully.\n"
          )

          EOF


      # ============================================================
      # 10.b RESTORE GLOBAL C++14 OVERRIDE
      # ============================================================

      - name: Restore global C++14 override after caret/tzdb
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "${HOME}/.R/Makevars.disabled" ]; then

            mv \
              "${HOME}/.R/Makevars.disabled" \
              "${HOME}/.R/Makevars"

            echo "Global ~/.R/Makevars restored."

          else

            echo "No disabled Makevars found to restore."

          fi


      # ============================================================
      # 11. scPred DEPENDENCIES
      # ============================================================

      - name: Install scPred dependencies
        shell: bash
        run: |
          set -euo pipefail

          Rscript - <<'EOF'

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          packages <- c(
            "ggbeeswarm",
            "MLmetrics",
            "kernlab",
            "pROC"
          )

          installed <- rownames(installed.packages())

          missing <- setdiff(
            packages,
            installed
          )

          if (length(missing) > 0) {

            install.packages(
              missing,
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )
          }

          failed <- packages[
            !vapply(
              packages,
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ]

          if (length(failed) > 0) {
            print(failed)
            stop("scPred dependencies incomplete.")
          }

          cat("All scPred dependencies installed.\n")

          EOF


      # ============================================================
      # 12. HARMONY 1.2.4
      # ============================================================

      - name: Install Harmony 1.2.4
        shell: bash
        run: |
          set -euo pipefail

          if Rscript -e '
            if (
              requireNamespace("harmony", quietly = TRUE) &&
              "HarmonyMatrix" %in% getNamespaceExports("harmony")
            ) {
              quit(status = 0)
            }

            quit(status = 1)
          '
          then

            echo "HarmonyMatrix already available."

          else

            echo "Installing Harmony 1.2.4..."

            curl \
              -L \
              --fail \
              --retry 10 \
              --retry-delay 3 \
              "https://cran.r-project.org/src/contrib/Archive/harmony/harmony_1.2.4.tar.gz" \
              -o harmony_1.2.4.tar.gz

            R CMD INSTALL \
              --no-multiarch \
              --with-keep.source \
              harmony_1.2.4.tar.gz

          fi

          Rscript - <<'EOF'

          if (!requireNamespace("harmony", quietly = TRUE)) {
            stop("Harmony installation failed.")
          }

          if (!"HarmonyMatrix" %in% getNamespaceExports("harmony")) {
            stop("HarmonyMatrix is unavailable.")
          }

          cat(
            "Harmony ",
            as.character(packageVersion("harmony")),
            " ready.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 13. scPred
      # ============================================================

      - name: Install scPred
        shell: bash
        env:
          CXXFLAGS: "-std=gnu++14"
          PKG_CXXFLAGS: "-std=gnu++14"
        run: |
          set -euo pipefail

          echo "Checking scPred dependencies..."

          Rscript - <<'EOF'

          required <- c(
            "caret",
            "harmony",
            "ggbeeswarm",
            "MLmetrics",
            "kernlab",
            "pROC"
          )

          failed <- required[
            !vapply(
              required,
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ]

          if (length(failed) > 0) {
            print(failed)
            stop("scPred dependencies are missing.")
          }

          EOF

          curl \
            -L \
            --fail \
            --retry 10 \
            --retry-delay 3 \
            "https://github.com/powellgenomicslab/scPred/archive/refs/heads/master.tar.gz" \
            -o scPred.tar.gz

          R CMD INSTALL \
            --no-multiarch \
            --with-keep.source \
            scPred.tar.gz

          Rscript - <<'EOF'

          if (!requireNamespace("scPred", quietly = TRUE)) {
            stop("scPred installation failed.")
          }

          cat(
            "scPred ",
            as.character(packageVersion("scPred")),
            " installed successfully.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 14. scSorter 0.0.2
      #
      # IMPORTANT:
      # scSorter is archived on CRAN.
      # NEVER use install.packages("scSorter").
      #
      # Install directly from the CRAN archive.
      # ============================================================

      - name: Install scSorter 0.0.2
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "INSTALLING scSorter 0.0.2"
          echo "============================================================"

          SC_SORTER_VERSION="0.0.2"
          SC_SORTER_FILE="scSorter_${SC_SORTER_VERSION}.tar.gz"
          SC_SORTER_URL="https://cran.r-project.org/src/contrib/Archive/scSorter/${SC_SORTER_FILE}"

          echo ""
          echo "Checking whether scSorter is already installed..."

          if Rscript -e '
            ip <- installed.packages()

            ok <- "scSorter" %in% rownames(ip)

            if (ok) {

              v <- ip["scSorter", "Version"]

              cat(
                "scSorter already installed: ",
                v,
                "\n",
                sep = ""
              )
            }

            quit(
              status = if (ok) 0 else 1
            )
          '
          then

            echo "scSorter already available."

          else

            echo ""
            echo "scSorter is not installed."
            echo "Installing archived scSorter ${SC_SORTER_VERSION}..."

            rm -f "${SC_SORTER_FILE}"

            echo ""
            echo "Downloading:"
            echo "${SC_SORTER_URL}"

            curl \
              --fail \
              --location \
              --retry 10 \
              --retry-delay 3 \
              --retry-connrefused \
              --connect-timeout 30 \
              --max-time 120 \
              "${SC_SORTER_URL}" \
              --output "${SC_SORTER_FILE}"

            echo ""
            echo "Downloaded archive:"
            ls -lh "${SC_SORTER_FILE}"

            echo ""
            echo "Checking archive type:"
            file "${SC_SORTER_FILE}"

            echo ""
            echo "Checking archive integrity..."

            tar \
              -tzf "${SC_SORTER_FILE}" \
              >/dev/null

            echo "Archive OK."

            echo ""
            echo "Installing scSorter with R CMD INSTALL..."

            R CMD INSTALL \
              --no-multiarch \
              --with-keep.source \
              "${SC_SORTER_FILE}"

          fi

          echo ""
          echo "============================================================"
          echo "VERIFYING scSorter"
          echo "============================================================"

          Rscript - <<'EOF'

          ip <- installed.packages()

          if (!"scSorter" %in% rownames(ip)) {
            stop(
              "scSorter is NOT installed."
            )
          }

          version <- ip["scSorter", "Version"]

          cat(
            "Installed scSorter version: ",
            version,
            "\n",
            sep = ""
          )

          if (version != "0.0.2") {
            stop(
              paste0(
                "Wrong scSorter version: ",
                version,
                ". Expected 0.0.2."
              )
            )
          }

          package_path <- find.package("scSorter")

          cat(
            "Location: ",
            package_path,
            "\n",
            sep = ""
          )

          cat(
            "\nscSorter 0.0.2 successfully installed.\n"
          )

          EOF


      # ============================================================
      # 15. scCATCH
      # ============================================================

      - name: Install scCATCH
        shell: bash
        run: |
          set -euo pipefail

          Rscript - <<'EOF'

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          if (!requireNamespace("scCATCH", quietly = TRUE)) {

            install.packages(
              "scCATCH",
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )
          }

          if (!requireNamespace("scCATCH", quietly = TRUE)) {
            stop("scCATCH installation failed.")
          }

          cat(
            "scCATCH ",
            as.character(packageVersion("scCATCH")),
            " ready.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 16. scmap
      # ============================================================

      - name: Install scmap
        shell: bash
        run: |
          set -euo pipefail

          Rscript - <<'EOF'

          if (!requireNamespace("scmap", quietly = TRUE)) {

            BiocManager::install(
              "scmap",
              ask = FALSE,
              update = FALSE
            )
          }

          if (!requireNamespace("scmap", quietly = TRUE)) {
            stop("scmap installation failed.")
          }

          cat(
            "scmap ",
            as.character(packageVersion("scmap")),
            " ready.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 17. CelliD
      # ============================================================

      - name: Install CelliD
        shell: bash
        env:
          CXXFLAGS: "-std=gnu++14"
          PKG_CXXFLAGS: "-std=gnu++14"
          MAKEFLAGS: "-j2"
        run: |
          set -euo pipefail

          echo "Installing CelliD..."

          Rscript - <<'EOF'

          Sys.setenv(
            CXXFLAGS = "-std=gnu++14",
            PKG_CXXFLAGS = "-std=gnu++14"
          )

          if (!requireNamespace("CelliD", quietly = TRUE)) {

            BiocManager::install(
              "CelliD",
              ask = FALSE,
              update = FALSE,
              force = TRUE
            )
          }

          if (!requireNamespace("CelliD", quietly = TRUE)) {
            stop("CelliD installation failed.")
          }

          cat(
            "CelliD ",
            as.character(packageVersion("CelliD")),
            " installed successfully.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 18. CHETAH
      # ============================================================

      - name: Install CHETAH
        shell: bash
        run: |
          set -euo pipefail

          Rscript - <<'EOF'

          if (!requireNamespace("CHETAH", quietly = TRUE)) {

            BiocManager::install(
              "CHETAH",
              ask = FALSE,
              update = FALSE
            )
          }

          if (!requireNamespace("CHETAH", quietly = TRUE)) {
            stop("CHETAH installation failed.")
          }

          cat(
            "CHETAH ",
            as.character(packageVersion("CHETAH")),
            " ready.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 19. SCINA 1.2.0
      # ============================================================

      - name: Install SCINA 1.2.0
        shell: bash
        run: |
          set -euo pipefail

          if Rscript - <<'EOF'
          if (requireNamespace("SCINA", quietly = TRUE)) {
            cat("SCINA already installed.\n")
            quit(status = 0)
          }

          quit(status = 1)
          EOF
          then

            echo "SCINA already available."

          else

            echo "Downloading SCINA 1.2.0..."

            curl \
              -L \
              --fail \
              --retry 10 \
              --retry-delay 3 \
              "https://cran.r-project.org/src/contrib/Archive/SCINA/SCINA_1.2.0.tar.gz" \
              -o SCINA_1.2.0.tar.gz

            echo "Installing SCINA 1.2.0..."

            R CMD INSTALL \
              --no-multiarch \
              --with-keep.source \
              SCINA_1.2.0.tar.gz

          fi

          Rscript - <<'EOF'

          if (!requireNamespace("SCINA", quietly = TRUE)) {
            stop("SCINA installation failed.")
          }

          cat(
            "SCINA ",
            as.character(packageVersion("SCINA")),
            " ready.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 20. scibetR
      # ============================================================

      - name: Install scibetR
        shell: bash
        run: |
          set -euo pipefail

          if Rscript - <<'EOF'
          if (requireNamespace("scibetR", quietly = TRUE)) {
            cat("scibetR already installed.\n")
            quit(status = 0)
          }

          quit(status = 1)
          EOF
          then

            echo "scibetR already available."

          else

            echo "Downloading scibetR..."

            curl \
              -L \
              --fail \
              --retry 10 \
              --retry-delay 3 \
              "https://github.com/zwj-tina/scibetR/archive/refs/heads/master.tar.gz" \
              -o scibetR.tar.gz

            echo "Installing scibetR..."

            R CMD INSTALL \
              --no-multiarch \
              --with-keep.source \
              scibetR.tar.gz

          fi

          Rscript - <<'EOF'

          if (!requireNamespace("scibetR", quietly = TRUE)) {
            stop("scibetR installation failed.")
          }

          cat(
            "scibetR ",
            as.character(packageVersion("scibetR")),
            " ready.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 21. FINAL DEPENDENCY CHECK
      # ============================================================

      - name: Verify all scAnnoX dependencies
        shell: bash
        run: |
          set -euo pipefail

          Rscript - <<'EOF'

          required <- c(
            "Seurat",
            "SeuratObject",
            "SingleCellExperiment",
            "SingleR",
            "celldex",
            "scuttle",
            "scPred",
            "scSorter",
            "scCATCH",
            "SCINA",
            "scmap",
            "CelliD",
            "CHETAH",
            "scibetR"
          )

          failed <- required[
            !vapply(
              required,
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ]

          if (length(failed) > 0) {

            cat("Missing packages:\n")
            print(failed)

            stop(
              "scAnnoX dependencies are incomplete."
            )
          }

          cat(
            "All scAnnoX dependencies are available.\n"
          )

          EOF


      # ============================================================
      # 22. VERIFY LOCAL scAnnoX SOURCE
      # ============================================================

      - name: Verify local scAnnoX source
        shell: bash
        run: |
          set -euo pipefail

          SCANNOX_PATH="files/external/scAnnoX"

          if [ ! -f "${SCANNOX_PATH}/DESCRIPTION" ]; then

            echo \
              "ERROR: ${SCANNOX_PATH}/DESCRIPTION does not exist."

            exit 1
          fi

          echo "Local scAnnoX source found:"
          echo "${SCANNOX_PATH}"

          echo ""
          echo "DESCRIPTION:"

          cat \
            "${SCANNOX_PATH}/DESCRIPTION"


      # ============================================================
      # 23. INSTALL LOCAL MODIFIED scAnnoX
      # ============================================================

      - name: Install local modified scAnnoX
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing local modified scAnnoX..."

          R CMD INSTALL \
            --no-multiarch \
            --with-keep.source \
            files/external/scAnnoX

          Rscript - <<'EOF'

          if (!requireNamespace("scAnnoX", quietly = TRUE)) {
            stop("scAnnoX installation failed.")
          }

          cat(
            "scAnnoX ",
            as.character(packageVersion("scAnnoX")),
            " installed successfully.\n",
            sep = ""
          )

          cat(
            "Location: ",
            find.package("scAnnoX"),
            "\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 24. VERIFY scAnnoX FUNCTIONS
      # ============================================================

      - name: Verify scAnnoX functions
        shell: bash
        run: |
          set -euo pipefail

          Rscript - <<'EOF'

          library(scAnnoX)

          expected <- c(
            "annoResult",
            "autoAnnoTools",
            "findMarkerToolsForSc",
            "findMarkersBySeurat",
            "listToolMethods",
            "multipleProcess",
            "sccatchAnno",
            "sciBetAnno",
            "scinaAnno",
            "scmapAnno",
            "scsorterAnno",
            "sctypeAnno",
            "seuratAnno",
            "singleRAnno"
          )

          failed <- expected[
            !vapply(
              expected,
              function(x) {

                exists(
                  x,
                  where = asNamespace("scAnnoX"),
                  inherits = FALSE
                )

              },
              logical(1)
            )
          ]

          if (length(failed) > 0) {

            cat(
              "Missing scAnnoX functions:\n"
            )

            print(failed)

            stop(
              "scAnnoX function verification failed."
            )
          }

          cat(
            "All expected scAnnoX functions are available.\n"
          )

          cat(
            "\nAvailable annotation methods:\n"
          )

          print(
            listToolMethods()
          )

          EOF


      # ============================================================
      # 25. CHECK EXISTING INTEGRATED OBJECT
      #
      # Scripts 01-07 are NOT executed.
      # ============================================================

      - name: Check integrated object
        shell: bash
        run: |
          set -euo pipefail

          OBJECT="results/objects/05_integrated.rds"

          if [ ! -f "${OBJECT}" ]; then

            echo \
              "ERROR: ${OBJECT} not found."

            echo ""
            echo "Available RDS files:"

            find results \
              -type f \
              \( \
                -name "*.rds" \
                -o \
                -name "*.RDS" \
              \) \
              | sort \
              || true

            exit 1
          fi

          echo "Object found:"

          ls -lh \
            "${OBJECT}"

          Rscript - <<'EOF'

          library(Seurat)

          obj <- readRDS(
            "results/objects/05_integrated.rds"
          )

          if (!inherits(obj, "Seurat")) {

            stop(
              "05_integrated.rds is not a Seurat object."
            )
          }

          cat(
            "Class: ",
            class(obj)[1],
            "\n",
            sep = ""
          )

          cat(
            "Cells: ",
            ncol(obj),
            "\n",
            sep = ""
          )

          cat(
            "Features: ",
            nrow(obj),
            "\n",
            sep = ""
          )

          cat("\nAssays:\n")

          print(
            Assays(obj)
          )

          cat("\nReductions:\n")

          print(
            Reductions(obj)
          )

          cat(
            "\nIntegrated object is readable.\n"
          )

          EOF


      # ============================================================
      # 26. RUN SCRIPT 08
      # ============================================================

      - name: Run scAnnoX annotation
        shell: bash
        run: |
          set -euo pipefail

          echo "Running scripts/08_annotation_scAnnoX.R"

          Rscript \
            scripts/08_annotation_scAnnoX.R


      # ============================================================
      # 27. RUN SCRIPT 09
      # ============================================================

      - name: Compare annotations
        shell: bash
        run: |
          set -euo pipefail

          echo "Running scripts/09_compare_annotations.R"

          Rscript \
            scripts/09_compare_annotations.R


      # ============================================================
      # 28. RUN SCRIPT 10
      # ============================================================

      - name: Differential expression
        shell: bash
        run: |
          set -euo pipefail

          echo "Running scripts/10_differential_expression.R"

          Rscript \
            scripts/10_differential_expression.R


      # ============================================================
      # 29. RUN SCRIPT 11
      # ============================================================

      - name: Generate final figures
        shell: bash
        run: |
          set -euo pipefail

          echo "Running scripts/11_final_figures.R"

          Rscript \
            scripts/11_final_figures.R


      # ============================================================
      # 30. DISPLAY RESULTS
      # ============================================================

      - name: Display results
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "RESULTS"
          echo "============================================================"

          if [ -d "results" ]; then

            find results \
              -type f \
              | sort

          fi

          echo ""
          echo "============================================================"
          echo "FIGURES"
          echo "============================================================"

          if [ -d "figures" ]; then

            find figures \
              -type f \
              | sort

          fi

          echo ""
          echo "============================================================"
          echo "DOCS"
          echo "============================================================"

          if [ -d "docs" ]; then

            find docs \
              -type f \
              | sort

          fi


      # ============================================================
      # 31. GIT STATUS
      # ============================================================

      - name: Git status
        shell: bash
        run: |
          set -euo pipefail

          git status --short


      # ============================================================
      # 32. COMMIT RESULTS
      # ============================================================

      - name: Commit results
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            results \
            figures \
            docs

          if git diff --cached --quiet; then

            echo "No generated changes to commit."

          else

            git commit \
              -m "Resume AML scAnnoX annotation and downstream analysis"

            git push

            echo "Results successfully pushed."

          fi

      # ============================================================
      # 34. COMMIT RESULTS
      # ============================================================

      - name: Commit results
        run: |

          echo "============================================================"
          echo "COMMITTING RESULTS"
          echo "============================================================"

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            results \
            figures \
            docs

          if git diff --cached --quiet; then

            echo ""
            echo "No generated changes to commit."

          else

            git commit \
              -m "Resume AML scAnnoX annotation and downstream analysis"

            git push

            echo ""
            echo "Results successfully pushed."

          fi

name: Resume scAnnoX analysis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resume-scannox:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. SETUP R
      # ============================================================

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true


      # ============================================================
      # 3. SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            gfortran \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libgit2-dev \
            libglpk-dev \
            libgsl-dev \
            libhdf5-dev \
            liblapack-dev \
            libblas-dev


      # ============================================================
      # 4. CONFIGURE CRAN
      # ============================================================

      - name: Configure CRAN
        run: |
          Rscript -e '
            options(
              repos = c(
                CRAN = "https://cloud.r-project.org"
              )
            )

            cat(
              "CRAN = ",
              getOption("repos")["CRAN"],
              "\n",
              sep = ""
            )
          '


      # ============================================================
      # 5. INSTALL BiocManager
      # ============================================================

      - name: Install BiocManager
        run: |
          Rscript -e '
            options(
              repos = c(
                CRAN = "https://cloud.r-project.org"
              )
            )

            if (!requireNamespace(
              "BiocManager",
              quietly = TRUE
            )) {

              install.packages(
                "BiocManager",
                dependencies = c(
                  "Depends",
                  "Imports",
                  "LinkingTo"
                )
              )
            }

            cat(
              "BiocManager ",
              as.character(
                packageVersion("BiocManager")
              ),
              "\n",
              sep = ""
            )
          '


      # ============================================================
      # 6. CORE CRAN PACKAGES
      # ============================================================

      - name: Install core CRAN packages
        run: |
          Rscript -e '
            options(
              repos = c(
                CRAN = "https://cloud.r-project.org"
              )
            )

            packages <- c(
              "Seurat",
              "SeuratObject",
              "dplyr",
              "ggplot2",
              "patchwork",
              "HGNChelper",
              "future",
              "Matrix",
              "data.table",
              "R.utils",
              "remotes",
              "devtools"
            )

            installed <- rownames(
              installed.packages()
            )

            missing <- setdiff(
              packages,
              installed
            )

            if (length(missing) > 0) {

              cat("Installing missing core packages:\n")
              print(missing)

              install.packages(
                missing,
                dependencies = c(
                  "Depends",
                  "Imports",
                  "LinkingTo"
                )
              )
            }

            cat(
              "Core CRAN packages ready.\n"
            )
          '


      # ============================================================
      # 7. BIOCONDUCTOR SINGLE-CELL PACKAGES
      # ============================================================

      - name: Install Bioconductor single-cell packages
        run: |
          Rscript -e '
            options(
              repos = c(
                CRAN = "https://cloud.r-project.org"
              )
            )

            BiocManager::install(
              c(
                "SingleCellExperiment",
                "SingleR",
                "celldex",
                "scuttle"
              ),
              ask = FALSE,
              update = FALSE
            )

            cat(
              "Bioconductor core packages ready.\n"
            )
          '


      # ============================================================
      # 8. C++14 CONFIGURATION
      #
      # Must happen BEFORE CelliD installation.
      # ============================================================

      - name: Configure C++14
        run: |

          echo "========================================"
          echo "Configuring C++14"
          echo "========================================"

          mkdir -p "${HOME}/.R"

          cat > "${HOME}/.R/Makevars" <<'EOF'
          CXX_STD = CXX14
          CXX14STD = -std=gnu++14
          PKG_CXXFLAGS = -std=gnu++14
          EOF

          echo ""
          echo "===== ~/.R/Makevars ====="
          cat "${HOME}/.R/Makevars"

          echo ""
          echo "===== g++ ====="
          which g++
          g++ --version

          echo ""
          echo "===== R C++ configuration ====="
          R CMD config CXX
          R CMD config CXX11
          R CMD config CXX14
          R CMD config CXX14STD

          echo ""
          echo "===== Testing C++14 ====="

          cat > /tmp/test_cpp14.cpp <<'EOF'
          #include <iostream>
          #include <vector>

          template <typename T>
          auto test_function(T value) {
              return value;
          }

          int main() {
              std::cout << test_function(42) << std::endl;
              return 0;
          }
          EOF

          g++ \
            -std=gnu++14 \
            /tmp/test_cpp14.cpp \
            -o /tmp/test_cpp14

          /tmp/test_cpp14

          echo ""
          echo "C++14 test passed."


      # ============================================================
      # 9. Rcpp + RcppArmadillo
      # ============================================================

      - name: Install Rcpp and RcppArmadillo
        env:
          CXXFLAGS: "-std=gnu++14"
          PKG_CXXFLAGS: "-std=gnu++14"
        run: |

          Rscript - <<'EOF'

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          Sys.setenv(
            CXXFLAGS = "-std=gnu++14",
            PKG_CXXFLAGS = "-std=gnu++14"
          )

          packages <- c(
            "Rcpp",
            "RcppArmadillo"
          )

          installed <- rownames(
            installed.packages()
          )

          missing <- setdiff(
            packages,
            installed
          )

          if (length(missing) > 0) {

            install.packages(
              missing,
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )
          }

          cat(
            "Rcpp ",
            as.character(
              packageVersion("Rcpp")
            ),
            "\n",
            sep = ""
          )

          cat(
            "RcppArmadillo ",
            as.character(
              packageVersion("RcppArmadillo")
            ),
            "\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 10. scPred DEPENDENCIES
      #
      # caret is explicitly installed and verified.
      # ============================================================

      - name: Install scPred dependencies
        run: |

          echo "========================================"
          echo "Installing scPred dependencies"
          echo "========================================"

          Rscript - <<'EOF'

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          packages <- c(
            "harmony",
            "ggbeeswarm",
            "MLmetrics",
            "caret",
            "kernlab",
            "pROC"
          )

          installed <- rownames(
            installed.packages()
          )

          missing <- setdiff(
            packages,
            installed
          )

          cat("Missing packages:\n")
          print(missing)

          if (length(missing) > 0) {

            install.packages(
              missing,
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )
          }

          cat(
            "\nVerifying scPred dependencies...\n\n"
          )

          failed <- character(0)

          for (pkg in packages) {

            if (
              !requireNamespace(
                pkg,
                quietly = TRUE
              )
            ) {

              cat(
                "FAILED: ",
                pkg,
                "\n",
                sep = ""
              )

              failed <- c(
                failed,
                pkg
              )

            } else {

              cat(
                "OK: ",
                pkg,
                " ",
                as.character(
                  packageVersion(pkg)
                ),
                "\n",
                sep = ""
              )
            }
          }

          if (length(failed) > 0) {

            cat(
              "\nPackages that failed:\n"
            )

            print(failed)

            stop(
              "scPred dependencies are incomplete."
            )
          }

          cat(
            "\nAll scPred dependencies are available.\n"
          )

          EOF


      # ============================================================
      # 11. VERIFY caret SPECIFICALLY
      # ============================================================

      - name: Verify caret
        run: |

          echo "========================================"
          echo "Verifying caret"
          echo "========================================"

          Rscript - <<'EOF'

          if (
            !requireNamespace(
              "caret",
              quietly = TRUE
            )
          ) {

            cat(
              "ERROR: caret is NOT available.\n"
            )

            cat(
              "\nInstalled packages containing 'caret':\n"
            )

            ip <- installed.packages()

            matches <- grep(
              "caret",
              rownames(ip),
              ignore.case = TRUE
            )

            if (length(matches) > 0) {

              print(
                ip[
                  matches,
                  c(
                    "Package",
                    "Version",
                    "LibPath"
                  ),
                  drop = FALSE
                ]
              )
            }

            stop(
              "caret is required before installing scPred."
            )
          }

          cat(
            "caret ",
            as.character(
              packageVersion("caret")
            ),
            " is available.\n",
            sep = ""
          )

          cat(
            "caret location: ",
            find.package("caret"),
            "\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 12. HARMONY 1.2.4
      #
      # scPred requires HarmonyMatrix().
      # ============================================================

      - name: Install Harmony 1.2.4
        run: |

          echo "========================================"
          echo "Checking HarmonyMatrix"
          echo "========================================"

          if Rscript -e '
            if (
              !requireNamespace(
                "harmony",
                quietly = TRUE
              )
            ) {
              quit(status = 1)
            }

            if (
              !"HarmonyMatrix" %in%
              getNamespaceExports("harmony")
            ) {
              quit(status = 1)
            }

            quit(status = 0)
          '
          then

            echo "HarmonyMatrix already available."

          else

            echo "Installing Harmony 1.2.4..."

            curl \
              -L \
              --fail \
              --retry 3 \
              "https://cran.r-project.org/src/contrib/Archive/harmony/harmony_1.2.4.tar.gz" \
              -o harmony_1.2.4.tar.gz

            R CMD INSTALL \
              --no-multiarch \
              --with-keep.source \
              harmony_1.2.4.tar.gz

          fi

          Rscript -e '

            if (
              !requireNamespace(
                "harmony",
                quietly = TRUE
              )
            ) {
              stop(
                "Harmony installation failed."
              )
            }

            if (
              !"HarmonyMatrix" %in%
              getNamespaceExports("harmony")
            ) {
              stop(
                "HarmonyMatrix is not available."
              )
            }

            cat(
              "Harmony ",
              as.character(
                packageVersion("harmony")
              ),
              " ready.\n",
              sep = ""
            )

            cat(
              "HarmonyMatrix available.\n"
            )
          '


      # ============================================================
      # 13. INSTALL scPred
      # ============================================================

      - name: Install scPred
        env:
          CXXFLAGS: "-std=gnu++14"
          PKG_CXXFLAGS: "-std=gnu++14"
        run: |

          echo "========================================"
          echo "Installing scPred"
          echo "========================================"

          # --------------------------------------------------------
          # Verify caret in the exact R session
          # --------------------------------------------------------

          Rscript - <<'EOF'

          if (
            !requireNamespace(
              "caret",
              quietly = TRUE
            )
          ) {

            stop(
              "caret is unavailable. scPred cannot be installed."
            )
          }

          cat(
            "caret detected: ",
            as.character(
              packageVersion("caret")
            ),
            "\n",
            sep = ""
          )

          cat(
            "caret path: ",
            find.package("caret"),
            "\n",
            sep = ""
          )

          EOF

          # --------------------------------------------------------
          # Download scPred
          # --------------------------------------------------------

          echo ""
          echo "Downloading scPred..."

          curl \
            -L \
            --fail \
            --retry 3 \
            "https://github.com/powellgenomicslab/scPred/archive/refs/heads/master.tar.gz" \
            -o scPred.tar.gz

          # --------------------------------------------------------
          # Install
          # --------------------------------------------------------

          echo ""
          echo "Installing scPred..."

          R CMD INSTALL \
            --no-multiarch \
            --with-keep.source \
            scPred.tar.gz

          # --------------------------------------------------------
          # Verify
          # --------------------------------------------------------

          echo ""
          echo "Verifying scPred..."

          Rscript - <<'EOF'

          if (
            !requireNamespace(
              "scPred",
              quietly = TRUE
            )
          ) {

            stop(
              "scPred installation failed."
            )
          }

          cat(
            "scPred ",
            as.character(
              packageVersion("scPred")
            ),
            " installed successfully.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 14. scSorter
      # ============================================================

      - name: Install scSorter
        run: |

          if Rscript -e '
            quit(
              status = ifelse(
                requireNamespace(
                  "scSorter",
                  quietly = TRUE
                ),
                0,
                1
              )
            )
          '
          then

            echo "scSorter already installed."

          else

            echo "Installing scSorter 0.0.2..."

            curl \
              -L \
              --fail \
              --retry 3 \
              "https://cran.r-project.org/src/contrib/Archive/scSorter/scSorter_0.0.2.tar.gz" \
              -o scSorter_0.0.2.tar.gz

            R CMD INSTALL \
              --no-multiarch \
              --with-keep.source \
              scSorter_0.0.2.tar.gz

          fi

          Rscript -e '

            if (
              !requireNamespace(
                "scSorter",
                quietly = TRUE
              )
            ) {
              stop(
                "scSorter installation failed."
              )
            }

            cat(
              "scSorter ",
              as.character(
                packageVersion("scSorter")
              ),
              " installed.\n",
              sep = ""
            )
          '


      # ============================================================
      # 15. scCATCH
      # ============================================================

      - name: Install scCATCH
        run: |

          Rscript -e '

            options(
              repos = c(
                CRAN = "https://cloud.r-project.org"
              )
            )

            if (
              !requireNamespace(
                "scCATCH",
                quietly = TRUE
              )
            ) {

              install.packages(
                "scCATCH",
                dependencies = c(
                  "Depends",
                  "Imports",
                  "LinkingTo"
                )
              )
            }

            if (
              !requireNamespace(
                "scCATCH",
                quietly = TRUE
              )
            ) {
              stop(
                "scCATCH installation failed."
              )
            }

            cat(
              "scCATCH ",
              as.character(
                packageVersion("scCATCH")
              ),
              " installed.\n",
              sep = ""
            )
          '


      # ============================================================
      # 16. scmap
      # ============================================================

      - name: Install scmap
        run: |

          Rscript -e '

            if (
              !requireNamespace(
                "scmap",
                quietly = TRUE
              )
            ) {

              BiocManager::install(
                "scmap",
                ask = FALSE,
                update = FALSE
              )
            }

            if (
              !requireNamespace(
                "scmap",
                quietly = TRUE
              )
            ) {
              stop(
                "scmap installation failed."
              )
            }

            cat(
              "scmap ",
              as.character(
                packageVersion("scmap")
              ),
              " installed.\n",
              sep = ""
            )
          '


      # ============================================================
      # 17. CelliD
      #
      # C++14 is forced through Makevars + environment.
      # ============================================================

      - name: Install CelliD
        env:
          CXXFLAGS: "-std=gnu++14"
          PKG_CXXFLAGS: "-std=gnu++14"
          MAKEFLAGS: "-j2"
        run: |

          echo "========================================"
          echo "Installing CelliD"
          echo "========================================"

          echo ""
          echo "CXXFLAGS=${CXXFLAGS}"
          echo "PKG_CXXFLAGS=${PKG_CXXFLAGS}"
          echo "MAKEFLAGS=${MAKEFLAGS}"

          echo ""
          echo "Makevars:"
          cat "${HOME}/.R/Makevars"

          Rscript - <<'EOF'

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          Sys.setenv(
            CXXFLAGS = "-std=gnu++14",
            PKG_CXXFLAGS = "-std=gnu++14"
          )

          cat(
            "R CXXFLAGS = ",
            Sys.getenv("CXXFLAGS"),
            "\n",
            sep = ""
          )

          cat(
            "R PKG_CXXFLAGS = ",
            Sys.getenv("PKG_CXXFLAGS"),
            "\n",
            sep = ""
          )

          if (
            !requireNamespace(
              "Rcpp",
              quietly = TRUE
            )
          ) {

            install.packages(
              "Rcpp",
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )
          }

          if (
            !requireNamespace(
              "RcppArmadillo",
              quietly = TRUE
            )
          ) {

            install.packages(
              "RcppArmadillo",
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )
          }

          if (
            !requireNamespace(
              "CelliD",
              quietly = TRUE
            )
          ) {

            cat(
              "\nInstalling CelliD with C++14...\n\n"
            )

            BiocManager::install(
              "CelliD",
              ask = FALSE,
              update = FALSE,
              force = TRUE
            )
          }

          if (
            !requireNamespace(
              "CelliD",
              quietly = TRUE
            )
          ) {

            stop(
              "CelliD installation failed."
            )
          }

          cat(
            "\nCelliD ",
            as.character(
              packageVersion("CelliD")
            ),
            " installed successfully.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 18. CHETAH
      # ============================================================

      - name: Install CHETAH
        run: |

          Rscript -e '

            if (
              !requireNamespace(
                "CHETAH",
                quietly = TRUE
              )
            ) {

              BiocManager::install(
                "CHETAH",
                ask = FALSE,
                update = FALSE
              )
            }

            if (
              !requireNamespace(
                "CHETAH",
                quietly = TRUE
              )
            ) {
              stop(
                "CHETAH installation failed."
              )
            }

            cat(
              "CHETAH ",
              as.character(
                packageVersion("CHETAH")
              ),
              " installed.\n",
              sep = ""
            )
          '


      # ============================================================
      # 19. SCINA
      # ============================================================

      - name: Install SCINA
        run: |

          if Rscript -e '
            quit(
              status = ifelse(
                requireNamespace(
                  "SCINA",
                  quietly = TRUE
                ),
                0,
                1
              )
            )
          '
          then

            echo "SCINA already installed."

          else

            echo "Installing SCINA 1.2.0..."

            curl \
              -L \
              --fail \
              --retry 3 \
              "https://cran.r-project.org/src/contrib/Archive/SCINA/SCINA_1.2.0.tar.gz" \
              -o SCINA_1.2.0.tar.gz

            R CMD INSTALL \
              --no-multiarch \
              --with-keep.source \
              SCINA_1.2.0.tar.gz

          fi

          Rscript -e '

            if (
              !requireNamespace(
                "SCINA",
                quietly = TRUE
              )
            ) {
              stop(
                "SCINA installation failed."
              )
            }

            cat(
              "SCINA ",
              as.character(
                packageVersion("SCINA")
              ),
              " installed.\n",
              sep = ""
            )
          '


      # ============================================================
      # 20. scibetR
      # ============================================================

      - name: Install scibetR
        run: |

          if Rscript -e '
            quit(
              status = ifelse(
                requireNamespace(
                  "scibetR",
                  quietly = TRUE
                ),
                0,
                1
              )
            )
          '
          then

            echo "scibetR already installed."

          else

            echo "Installing scibetR..."

            curl \
              -L \
              --fail \
              --retry 3 \
              "https://github.com/zwj-tina/scibetR/archive/refs/heads/master.tar.gz" \
              -o scibetR.tar.gz

            R CMD INSTALL \
              --no-multiarch \
              --with-keep.source \
              scibetR.tar.gz

          fi

          Rscript -e '

            if (
              !requireNamespace(
                "scibetR",
                quietly = TRUE
              )
            ) {
              stop(
                "scibetR installation failed."
              )
            }

            cat(
              "scibetR ",
              as.character(
                packageVersion("scibetR")
              ),
              " installed.\n",
              sep = ""
            )
          '


      # ============================================================
      # 21. VERIFY ALL scAnnoX DEPENDENCIES
      # ============================================================

      - name: Verify scAnnoX dependencies
        run: |

          Rscript - <<'EOF'

          required <- c(
            "Seurat",
            "SeuratObject",
            "SingleCellExperiment",
            "SingleR",
            "celldex",
            "scuttle",
            "scPred",
            "scSorter",
            "scCATCH",
            "SCINA",
            "scmap",
            "CelliD",
            "CHETAH",
            "scibetR"
          )

          cat(
            "========================================\n"
          )

          cat(
            "Checking scAnnoX dependencies\n"
          )

          cat(
            "========================================\n\n"
          )

          failed <- character(0)

          for (pkg in required) {

            available <- requireNamespace(
              pkg,
              quietly = TRUE
            )

            if (available) {

              cat(
                "OK       ",
                pkg,
                " ",
                as.character(
                  packageVersion(pkg)
                ),
                "\n",
                sep = ""
              )

            } else {

              cat(
                "FAILED   ",
                pkg,
                "\n",
                sep = ""
              )

              failed <- c(
                failed,
                pkg
              )
            }
          }

          if (length(failed) > 0) {

            cat(
              "\nMissing packages:\n"
            )

            print(failed)

            stop(
              "scAnnoX dependencies are incomplete."
            )
          }

          cat(
            "\nAll scAnnoX dependencies are installed.\n"
          )

          EOF


      # ============================================================
      # 22. INSTALL LOCAL MODIFIED scAnnoX
      #
      # IMPORTANT:
      # This is the user's modified Seurat 5-compatible copy.
      # ============================================================

      - name: Install local modified scAnnoX
        run: |

          echo "========================================"
          echo "Installing local modified scAnnoX"
          echo "========================================"

          if [
            ! -f "files/external/scAnnoX/DESCRIPTION"
          ]; then

            echo ""
            echo "ERROR:"
            echo "files/external/scAnnoX/DESCRIPTION not found."

            echo ""
            echo "Available files:"
            find files \
              -maxdepth 4 \
              -type f \
              | sort || true

            exit 1
          fi

          echo ""
          echo "Installing from:"
          echo "files/external/scAnnoX"

          R CMD INSTALL \
            --no-multiarch \
            --with-keep.source \
            files/external/scAnnoX

          Rscript -e '

            if (
              !requireNamespace(
                "scAnnoX",
                quietly = TRUE
              )
            ) {
              stop(
                "scAnnoX installation failed."
              )
            }

            cat(
              "scAnnoX ",
              as.character(
                packageVersion("scAnnoX")
              ),
              " installed successfully.\n",
              sep = ""
            )
          '


      # ============================================================
      # 23. VERIFY scAnnoX
      # ============================================================

      - name: Verify scAnnoX
        run: |

          Rscript - <<'EOF'

          library(scAnnoX)

          cat(
            "========================================\n"
          )

          cat(
            "scAnnoX verification\n"
          )

          cat(
            "========================================\n\n"
          )

          cat(
            "Version: ",
            as.character(
              packageVersion("scAnnoX")
            ),
            "\n",
            sep = ""
          )

          expected <- c(
            "annoResult",
            "autoAnnoTools",
            "findMarkerToolsForSc",
            "findMarkersBySeurat",
            "listToolMethods",
            "multipleProcess",
            "sccatchAnno",
            "sciBetAnno",
            "scinaAnno",
            "scmapAnno",
            "scsorterAnno",
            "sctypeAnno",
            "seuratAnno",
            "singleRAnno"
          )

          missing <- expected[
            !vapply(
              expected,
              exists,
              logical(1),
              where = asNamespace("scAnnoX"),
              inherits = FALSE
            )
          ]

          if (length(missing) > 0) {

            cat(
              "Missing scAnnoX functions:\n"
            )

            print(missing)

            stop(
              "scAnnoX verification failed."
            )
          }

          cat(
            "\nAll expected scAnnoX functions are available.\n"
          )

          cat(
            "\nAvailable annotation methods:\n"
          )

          print(
            listToolMethods()
          )

          EOF



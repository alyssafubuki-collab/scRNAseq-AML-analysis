name: Resume scAnnoX analysis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resume-scannox:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. R SETUP
      # ============================================================

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true


      # ============================================================
      # 3. SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libgit2-dev \
            libglpk-dev \
            libgsl-dev \
            libhdf5-dev \
            liblapack-dev \
            libblas-dev \
            gfortran


      # ============================================================
      # 4. BASIC R CONFIGURATION
      # ============================================================

      - name: Configure CRAN repository
        run: |
          Rscript -e '
            options(
              repos = c(CRAN = "https://cloud.r-project.org")
            )
            print(getOption("repos"))
          '


      # ============================================================
      # 5. BIOCONDUCTOR
      # ============================================================

      - name: Install BiocManager
        run: |
          Rscript -e '
            options(repos = c(CRAN = "https://cloud.r-project.org"))

            if (!requireNamespace("BiocManager", quietly = TRUE)) {
              install.packages(
                "BiocManager",
                dependencies = c("Depends", "Imports", "LinkingTo")
              )
            }

            cat("BiocManager version:",
                as.character(packageVersion("BiocManager")),
                "\n")
          '


      # ============================================================
      # 6. CORE CRAN PACKAGES
      # ============================================================

      - name: Install core CRAN packages
        run: |
          Rscript -e '
            options(repos = c(CRAN = "https://cloud.r-project.org"))

            pkgs <- c(
              "Seurat",
              "SeuratObject",
              "dplyr",
              "ggplot2",
              "patchwork",
              "HGNChelper",
              "future",
              "Matrix",
              "data.table",
              "R.utils",
              "remotes",
              "devtools"
            )

            installed <- rownames(installed.packages())
            missing <- setdiff(pkgs, installed)

            if (length(missing) > 0) {
              cat("Installing missing CRAN packages:\n")
              print(missing)

              install.packages(
                missing,
                dependencies = c(
                  "Depends",
                  "Imports",
                  "LinkingTo"
                )
              )
            }

            cat("Core CRAN packages ready.\n")
          '


      # ============================================================
      # 7. SINGLE-CELL / BIOCONDUCTOR CORE
      # ============================================================

      - name: Install Bioconductor single-cell packages
        run: |
          Rscript -e '
            options(repos = c(CRAN = "https://cloud.r-project.org"))

            BiocManager::install(
              c(
                "SingleCellExperiment",
                "SingleR",
                "celldex",
                "scuttle"
              ),
              ask = FALSE,
              update = FALSE
            )

            cat("Core Bioconductor packages installed.\n")
          '


      # ============================================================
      # 8. C++14 CONFIGURATION
      #
      # CelliD / RcppArmadillo requires C++14 on current R 4.4.
      # This MUST happen before installing CelliD.
      # ============================================================

      - name: Configure C++14 for CelliD
        run: |
          mkdir -p ~/.R

          cat > ~/.R/Makevars <<'EOF'
          CXX_STD = CXX14
          CXX14STD = -std=gnu++14
          EOF

          echo "===== ~/.R/Makevars ====="
          cat ~/.R/Makevars

          echo "===== Compiler ====="
          g++ --version

          echo "===== R configuration ====="
          R CMD config CXX
          R CMD config CXX14
          R CMD config CXX14STD


      # ============================================================
      # 9. RCPP / RCPPARMADILLO
      # ============================================================

      - name: Install Rcpp and RcppArmadillo
        run: |
          Rscript -e '
            options(repos = c(CRAN = "https://cloud.r-project.org"))

            pkgs <- c(
              "Rcpp",
              "RcppArmadillo"
            )

            install.packages(
              pkgs,
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )

            cat("Rcpp versions:\n")
            cat("Rcpp: ",
                as.character(packageVersion("Rcpp")),
                "\n",
                sep = "")

            cat("RcppArmadillo: ",
                as.character(packageVersion("RcppArmadillo")),
                "\n",
                sep = "")
          '


      # ============================================================
      # 10. scPred DEPENDENCIES
      # ============================================================

      - name: Install scPred dependencies
        run: |
          Rscript -e '
            options(repos = c(CRAN = "https://cloud.r-project.org"))

            pkgs <- c(
              "harmony",
              "ggbeeswarm",
              "MLmetrics",
              "caret",
              "kernlab",
              "pROC"
            )

            installed <- rownames(installed.packages())
            missing <- setdiff(pkgs, installed)

            if (length(missing) > 0) {
              install.packages(
                missing,
                dependencies = c(
                  "Depends",
                  "Imports",
                  "LinkingTo"
                )
              )
            }

            cat("scPred dependencies ready.\n")
          '


      # ============================================================
      # 11. INSTALL HARMONY 1.2.4
      #
      # scPred expects HarmonyMatrix().
      # Current Harmony versions may not export it.
      # ============================================================

      - name: Install Harmony 1.2.4
        run: |
          Rscript -e '
            if (requireNamespace("harmony", quietly = TRUE)) {

              has_harmony_matrix <- "HarmonyMatrix" %in%
                getNamespaceExports("harmony")

              if (has_harmony_matrix) {
                cat("HarmonyMatrix already available.\n")
                quit(status = 0)
              }
            }

            quit(status = 1)
          ' || true

          if ! Rscript -e '
            suppressPackageStartupMessages(library(harmony))
            quit(
              status = ifelse(
                "HarmonyMatrix" %in% getNamespaceExports("harmony"),
                0,
                1
              )
            )
          '
          then

            echo "Installing Harmony 1.2.4..."

            curl -L --fail --retry 3 \
              "https://cran.r-project.org/src/contrib/Archive/harmony/harmony_1.2.4.tar.gz" \
              -o harmony_1.2.4.tar.gz

            R CMD INSTALL \
              --no-multiarch \
              --with-keep.source \
              harmony_1.2.4.tar.gz

          fi

          Rscript -e '
            library(harmony)

            if (!"HarmonyMatrix" %in%
                getNamespaceExports("harmony")) {
              stop("HarmonyMatrix is not available.")
            }

            cat("HarmonyMatrix is available.\n")
          '


      # ============================================================
      # 12. INSTALL scPred
      # ============================================================

      - name: Install scPred
        run: |
          if ! Rscript -e 'quit(status = ifelse(requireNamespace("scPred", quietly = TRUE), 0, 1))'
          then

            echo "Installing scPred..."

            curl -L --fail --retry 3 \
              "https://github.com/powellgenomicslab/scPred/archive/refs/heads/master.tar.gz" \
              -o scPred.tar.gz

            R CMD INSTALL \
              --no-multiarch \
              --with-keep.source \
              scPred.tar.gz

          fi

          Rscript -e '
            library(scPred)
            cat(
              "scPred ",
              as.character(packageVersion("scPred")),
              " installed.\n",
              sep = ""
            )
          '


      # ============================================================
      # 13. scSorter
      #
      # Removed from current CRAN index.
      # Install archived 0.0.2.
      # ============================================================

      - name: Install scSorter
        run: |
          if ! Rscript -e 'quit(status = ifelse(requireNamespace("scSorter", quietly = TRUE), 0, 1))'
          then

            echo "Installing scSorter 0.0.2 from CRAN archive..."

            curl -L --fail --retry 3 \
              "https://cran.r-project.org/src/contrib/Archive/scSorter/scSorter_0.0.2.tar.gz" \
              -o scSorter_0.0.2.tar.gz

            R CMD INSTALL \
              --no-multiarch \
              --with-keep.source \
              scSorter_0.0.2.tar.gz

          fi

          Rscript -e '
            if (!requireNamespace("scSorter", quietly = TRUE)) {
              stop("scSorter installation failed.")
            }

            cat(
              "scSorter ",
              as.character(packageVersion("scSorter")),
              " installed.\n",
              sep = ""
            )
          '


      # ============================================================
      # 14. scCATCH
      # ============================================================

      - name: Install scCATCH
        run: |
          Rscript -e '
            options(repos = c(CRAN = "https://cloud.r-project.org"))

            if (!requireNamespace("scCATCH", quietly = TRUE)) {

              install.packages(
                "scCATCH",
                dependencies = c(
                  "Depends",
                  "Imports",
                  "LinkingTo"
                )
              )
            }

            library(scCATCH)

            cat(
              "scCATCH ",
              as.character(packageVersion("scCATCH")),
              " installed.\n",
              sep = ""
            )
          '


      # ============================================================
      # 15. scmap
      # ============================================================

      - name: Install scmap
        run: |
          Rscript -e '
            if (!requireNamespace("scmap", quietly = TRUE)) {

              BiocManager::install(
                "scmap",
                ask = FALSE,
                update = FALSE
              )
            }

            if (!requireNamespace("scmap", quietly = TRUE)) {
              stop("scmap installation failed.")
            }

            cat(
              "scmap ",
              as.character(packageVersion("scmap")),
              " installed.\n",
              sep = ""
            )
          '


      # ============================================================
      # 16. CelliD
      #
      # C++14 configuration was created above.
      # ============================================================

      - name: Install CelliD
        run: |
          Rscript -e '
            if (!requireNamespace("CelliD", quietly = TRUE)) {

              cat("Installing CelliD...\n")

              BiocManager::install(
                "CelliD",
                ask = FALSE,
                update = FALSE
              )
            }

            if (!requireNamespace("CelliD", quietly = TRUE)) {
              stop("CelliD installation failed.")
            }

            cat(
              "CelliD ",
              as.character(packageVersion("CelliD")),
              " installed.\n",
              sep = ""
            )
          '


      # ============================================================
      # 17. CHETAH
      # ============================================================

      - name: Install CHETAH
        run: |
          Rscript -e '
            if (!requireNamespace("CHETAH", quietly = TRUE)) {

              BiocManager::install(
                "CHETAH",
                ask = FALSE,
                update = FALSE
              )
            }

            if (!requireNamespace("CHETAH", quietly = TRUE)) {
              stop("CHETAH installation failed.")
            }

            cat(
              "CHETAH ",
              as.character(packageVersion("CHETAH")),
              " installed.\n",
              sep = ""
            )
          '


      # ============================================================
      # 18. SCINA
      #
      # Removed from CRAN.
      # Install archived version.
      # ============================================================

      - name: Install SCINA
        run: |
          if ! Rscript -e 'quit(status = ifelse(requireNamespace("SCINA", quietly = TRUE), 0, 1))'
          then

            echo "Installing SCINA 1.2.0 from CRAN archive..."

            curl -L --fail --retry 3 \
              "https://cran.r-project.org/src/contrib/Archive/SCINA/SCINA_1.2.0.tar.gz" \
              -o SCINA_1.2.0.tar.gz

            R CMD INSTALL \
              --no-multiarch \
              --with-keep.source \
              SCINA_1.2.0.tar.gz

          fi

          Rscript -e '
            if (!requireNamespace("SCINA", quietly = TRUE)) {
              stop("SCINA installation failed.")
            }

            cat(
              "SCINA ",
              as.character(packageVersion("SCINA")),
              " installed.\n",
              sep = ""
            )
          '


      # ============================================================
      # 19. scibetR
      # ============================================================

      - name: Install scibetR
        run: |
          if ! Rscript -e 'quit(status = ifelse(requireNamespace("scibetR", quietly = TRUE), 0, 1))'
          then

            echo "Installing scibetR from GitHub..."

            curl -L --fail --retry 3 \
              "https://github.com/zwj-tina/scibetR/archive/refs/heads/master.tar.gz" \
              -o scibetR.tar.gz

            R CMD INSTALL \
              --no-multiarch \
              --with-keep.source \
              scibetR.tar.gz

          fi

          Rscript -e '
            if (!requireNamespace("scibetR", quietly = TRUE)) {
              stop("scibetR installation failed.")
            }

            cat(
              "scibetR ",
              as.character(packageVersion("scibetR")),
              " installed.\n",
              sep = ""
            )
          '


      # ============================================================
      # 20. VERIFY ALL scAnnoX DEPENDENCIES
      # ============================================================

      - name: Verify scAnnoX dependencies
        run: |
          Rscript - <<'EOF'

          required <- c(
            "Seurat",
            "SeuratObject",
            "SingleCellExperiment",
            "SingleR",
            "celldex",
            "scuttle",
            "scPred",
            "scSorter",
            "scCATCH",
            "SCINA",
            "scmap",
            "CelliD",
            "CHETAH",
            "scibetR"
          )

          cat("========================================\n")
          cat("Checking scAnnoX dependencies\n")
          cat("========================================\n")

          failed <- character(0)

          for (pkg in required) {

            ok <- requireNamespace(
              pkg,
              quietly = TRUE
            )

            if (ok) {

              version <- as.character(
                packageVersion(pkg)
              )

              cat(
                "OK     ",
                pkg,
                " ",
                version,
                "\n",
                sep = ""
              )

            } else {

              cat(
                "FAILED ",
                pkg,
                "\n",
                sep = ""
              )

              failed <- c(
                failed,
                pkg
              )
            }
          }

          if (length(failed) > 0) {

            cat("\nMissing packages:\n")
            print(failed)

            stop(
              "scAnnoX dependencies are incomplete."
            )
          }

          cat("\nAll scAnnoX dependencies are installed.\n")

          EOF


      # ============================================================
      # 21. INSTALL LOCAL MODIFIED scAnnoX
      #
      # IMPORTANT:
      # This is YOUR modified Seurat 5-compatible copy.
      #
      # Actual path:
      # files/external/scAnnoX
      # ============================================================

      - name: Install local modified scAnnoX
        run: |
          test -f "files/external/scAnnoX/DESCRIPTION"

          echo "Installing local modified scAnnoX..."

          R CMD INSTALL \
            --no-multiarch \
            --with-keep.source \
            files/external/scAnnoX

          Rscript -e '
            if (!requireNamespace("scAnnoX", quietly = TRUE)) {
              stop("scAnnoX installation failed.")
            }

            cat(
              "scAnnoX ",
              as.character(packageVersion("scAnnoX")),
              " installed successfully.\n",
              sep = ""
            )
          '


      # ============================================================
      # 22. VERIFY scAnnoX
      # ============================================================

      - name: Verify scAnnoX
        run: |
          Rscript - <<'EOF'

          library(scAnnoX)

          cat("========================================\n")
          cat("scAnnoX verification\n")
          cat("========================================\n")

          cat(
            "Version: ",
            as.character(packageVersion("scAnnoX")),
            "\n",
            sep = ""
          )

          expected <- c(
            "annoResult",
            "autoAnnoTools",
            "findMarkerToolsForSc",
            "findMarkersBySeurat",
            "listToolMethods",
            "multipleProcess",
            "sccatchAnno",
            "sciBetAnno",
            "scinaAnno",
            "scmapAnno",
            "scsorterAnno",
            "sctypeAnno",
            "seuratAnno",
            "singleRAnno"
          )

          missing <- expected[
            !vapply(
              expected,
              exists,
              logical(1),
              where = asNamespace("scAnnoX"),
              inherits = FALSE
            )
          ]

          if (length(missing) > 0) {
            cat("Missing scAnnoX functions:\n")
            print(missing)
            stop("scAnnoX verification failed.")
          }

          cat("\nAll expected scAnnoX functions are available.\n")

          cat("\nAvailable annotation methods:\n")
          print(listToolMethods())

          EOF


      # ============================================================
      # 23. CHECK INTEGRATED OBJECT
      #
      # We deliberately DO NOT rerun scripts 01-07.
      # ============================================================

      - name: Check existing integrated object
        run: |
          if [ ! -f "results/objects/05_integrated.rds" ]; then
            echo "ERROR: results/objects/05_integrated.rds does not exist."
            echo ""
            echo "The resume workflow expects the previous integration"
            echo "workflow to have produced this object."
            exit 1
          fi

          ls -lh results/objects/05_integrated.rds


      # ============================================================
      # 24. RUN scAnnoX
      # ============================================================

      - name: Run scAnnoX annotation
        run: |
          Rscript scripts/08_annotation_scAnnoX.R


      # ============================================================
      # 25. COMPARE ANNOTATIONS
      # ============================================================

      - name: Compare annotations
        run: |
          Rscript scripts/09_compare_annotations.R


      # ============================================================
      # 26. DIFFERENTIAL EXPRESSION
      # ============================================================

      - name: Run differential expression
        run: |
          Rscript scripts/10_differential_expression.R


      # ============================================================
      # 27. FINAL FIGURES
      # ============================================================

      - name: Generate final figures
        run: |
          Rscript scripts/11_final_figures.R


      # ============================================================
      # 28. SHOW GENERATED FILES
      # ============================================================

      - name: Show generated results
        run: |
          echo "========================================"
          echo "RESULTS"
          echo "========================================"

          find results -type f | sort || true

          echo ""
          echo "========================================"
          echo "FIGURES"
          echo "========================================"

          find figures -type f | sort || true

          echo ""
          echo "========================================"
          echo "DOCS"
          echo "========================================"

          find docs -type f | sort || true


      # ============================================================
      # 29. COMMIT RESULTS
      # ============================================================

      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results figures docs

          if git diff --cached --quiet; then
            echo "No new results to commit."
          else
            git commit -m "Resume AML scAnnoX annotation and downstream analysis"
            git push
          fi

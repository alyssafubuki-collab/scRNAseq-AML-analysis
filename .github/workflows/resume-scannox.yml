name: Resume scAnnoX analysis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  resume-scannox:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 2. DEBUG WORKFLOW VERSION
      #
      # IMPORTANT:
      # This step proves exactly which workflow/repository version
      # GitHub Actions is executing.
      # ============================================================

      - name: DEBUG workflow version
        run: |

          echo "============================================================"
          echo "DEBUG - WORKFLOW VERSION"
          echo "============================================================"

          echo ""
          echo "Git commit:"
          git rev-parse HEAD

          echo ""
          echo "Git branch:"
          git branch --show-current

          echo ""
          echo "Git status:"
          git status --short

          echo ""
          echo "============================================================"
          echo "ALL WORKFLOW FILES"
          echo "============================================================"

          find .github/workflows \
            -type f \
            \( -name "*.yml" -o -name "*.yaml" \) \
            -print \
            | sort

          echo ""
          echo "============================================================"
          echo "ALL scSorter REFERENCES IN WORKFLOWS"
          echo "============================================================"

          grep -Rni \
            --exclude-dir=.git \
            "scSorter" \
            .github/workflows \
            || true

          echo ""
          echo "============================================================"
          echo "ALL install.packages(scSorter) REFERENCES"
          echo "============================================================"

          grep -Rni \
            --exclude-dir=.git \
            -E 'install\.packages.*scSorter|BiocManager::install.*scSorter|install_github.*scSorter' \
            . \
            || true

          echo ""
          echo "============================================================"
          echo "CURRENT WORKFLOW CONTENT"
          echo "============================================================"

          CURRENT_WORKFLOW=""

          for file in .github/workflows/*.yml .github/workflows/*.yaml
          do

            if [ -f "$file" ]; then

              if grep -q "name: Resume scAnnoX analysis" "$file"; then
                CURRENT_WORKFLOW="$file"
              fi

            fi

          done

          if [ -n "$CURRENT_WORKFLOW" ]; then

            echo "Detected workflow:"
            echo "$CURRENT_WORKFLOW"

            echo ""
            echo "Checking scSorter installation section:"

            grep -n -A80 -B10 \
              "Install scSorter" \
              "$CURRENT_WORKFLOW" \
              || true

          else

            echo "WARNING: Could not automatically identify workflow file."

          fi

          echo ""
          echo "============================================================"
          echo "DEBUG COMPLETE"
          echo "============================================================"


      # ============================================================
      # 3. SETUP R
      # ============================================================

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"
          use-public-rspm: true


      # ============================================================
      # 4. SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install system dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            gfortran \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libgit2-dev \
            libglpk-dev \
            libgsl-dev \
            libhdf5-dev \
            liblapack-dev \
            libblas-dev


      # ============================================================
      # 5. R LIBRARY CONFIGURATION
      # ============================================================

      - name: Configure R library
        run: |

          echo "============================================================"
          echo "R CONFIGURATION"
          echo "============================================================"

          Rscript - <<'EOF'

          cat(
            "R version:\n"
          )

          print(
            R.version.string
          )

          cat(
            "\nR library paths:\n"
          )

          print(
            .libPaths()
          )

          EOF


      # ============================================================
      # 6. INSTALL BiocManager
      # ============================================================

      - name: Install BiocManager
        run: |

          Rscript - <<'EOF'

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          if (
            !requireNamespace(
              "BiocManager",
              quietly = TRUE
            )
          ) {

            install.packages(
              "BiocManager",
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )
          }

          cat(
            "BiocManager ",
            as.character(
              packageVersion("BiocManager")
            ),
            " available.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 7. CORE CRAN PACKAGES
      # ============================================================

      - name: Install core CRAN packages
        run: |

          Rscript - <<'EOF'

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          packages <- c(
            "Seurat",
            "SeuratObject",
            "dplyr",
            "ggplot2",
            "patchwork",
            "HGNChelper",
            "future",
            "Matrix",
            "data.table",
            "R.utils",
            "remotes",
            "devtools"
          )

          installed <- rownames(
            installed.packages()
          )

          missing <- setdiff(
            packages,
            installed
          )

          cat(
            "Missing core packages:\n"
          )

          print(
            missing
          )

          if (
            length(missing) > 0
          ) {

            install.packages(
              missing,
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )
          }

          for (
            pkg in packages
          ) {

            if (
              !requireNamespace(
                pkg,
                quietly = TRUE
              )
            ) {

              stop(
                paste(
                  "Core package installation failed:",
                  pkg
                )
              )
            }

          }

          cat(
            "\nCore CRAN packages installed.\n"
          )

          EOF


      # ============================================================
      # 8. CORE BIOCONDUCTOR PACKAGES
      # ============================================================

      - name: Install Bioconductor packages
        run: |

          Rscript - <<'EOF'

          BiocManager::install(
            c(
              "SingleCellExperiment",
              "SingleR",
              "celldex",
              "scuttle"
            ),
            ask = FALSE,
            update = FALSE
          )

          required <- c(
            "SingleCellExperiment",
            "SingleR",
            "celldex",
            "scuttle"
          )

          failed <- required[
            !vapply(
              required,
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ]

          if (
            length(failed) > 0
          ) {

            print(
              failed
            )

            stop(
              "Bioconductor installation incomplete."
            )
          }

          cat(
            "\nCore Bioconductor packages installed.\n"
          )

          EOF


      # ============================================================
      # 9. C++14
      # ============================================================

      - name: Configure C++14
        run: |

          echo "============================================================"
          echo "CONFIGURING C++14"
          echo "============================================================"

          mkdir -p "${HOME}/.R"

          cat > "${HOME}/.R/Makevars" <<'EOF'
CXX_STD = CXX14
CXX14STD = -std=gnu++14
PKG_CXXFLAGS = -std=gnu++14
EOF

          echo ""
          echo "===== ~/.R/Makevars ====="

          cat "${HOME}/.R/Makevars"

          echo ""
          echo "===== g++ ====="

          g++ --version

          echo ""
          echo "===== R compiler configuration ====="

          R CMD config CXX
          R CMD config CXX11
          R CMD config CXX14
          R CMD config CXX14STD

          echo ""
          echo "===== C++14 compilation test ====="

          cat > /tmp/test_cpp14.cpp <<'EOF'
#include <iostream>

template <typename T>
auto test_function(T value) {
    return value;
}

int main() {
    std::cout << test_function(42) << std::endl;
    return 0;
}
EOF

          g++ \
            -std=gnu++14 \
            /tmp/test_cpp14.cpp \
            -o /tmp/test_cpp14

          /tmp/test_cpp14

          echo ""
          echo "C++14 configuration OK."


      # ============================================================
      # 10. Rcpp
      # ============================================================

      - name: Install Rcpp packages
        env:
          CXXFLAGS: "-std=gnu++14"
          PKG_CXXFLAGS: "-std=gnu++14"

        run: |

          Rscript - <<'EOF'

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          Sys.setenv(
            CXXFLAGS = "-std=gnu++14",
            PKG_CXXFLAGS = "-std=gnu++14"
          )

          packages <- c(
            "Rcpp",
            "RcppArmadillo"
          )

          installed <- rownames(
            installed.packages()
          )

          missing <- setdiff(
            packages,
            installed
          )

          if (
            length(missing) > 0
          ) {

            install.packages(
              missing,
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )
          }

          for (
            pkg in packages
          ) {

            if (
              !requireNamespace(
                pkg,
                quietly = TRUE
              )
            ) {

              stop(
                paste(
                  "Failed to install",
                  pkg
                )
              )
            }

            cat(
              pkg,
              " ",
              as.character(
                packageVersion(pkg)
              ),
              "\n",
              sep = ""
            )
          }

          EOF


      # ============================================================
      # 11. CARET
      # ============================================================

      - name: Install caret
        run: |

          echo "============================================================"
          echo "INSTALLING CARET"
          echo "============================================================"

          Rscript - <<'EOF'

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          if (
            !requireNamespace(
              "caret",
              quietly = TRUE
            )
          ) {

            install.packages(
              "caret",
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )
          }

          if (
            !requireNamespace(
              "caret",
              quietly = TRUE
            )
          ) {

            stop(
              "caret installation failed."
            )
          }

          cat(
            "caret ",
            as.character(
              packageVersion("caret")
            ),
            " installed successfully.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 12. scPred DEPENDENCIES
      # ============================================================

      - name: Install scPred dependencies
        run: |

          Rscript - <<'EOF'

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          packages <- c(
            "ggbeeswarm",
            "MLmetrics",
            "kernlab",
            "pROC"
          )

          installed <- rownames(
            installed.packages()
          )

          missing <- setdiff(
            packages,
            installed
          )

          if (
            length(missing) > 0
          ) {

            install.packages(
              missing,
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )
          }

          failed <- packages[
            !vapply(
              packages,
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ]

          if (
            length(failed) > 0
          ) {

            print(
              failed
            )

            stop(
              "scPred dependencies incomplete."
            )
          }

          cat(
            "All scPred dependencies installed.\n"
          )

          EOF


      # ============================================================
      # 13. HARMONY 1.2.4
      # ============================================================

      - name: Install Harmony 1.2.4
        run: |

          echo "============================================================"
          echo "INSTALLING HARMONY 1.2.4"
          echo "============================================================"

          if Rscript -e '
            if (
              requireNamespace("harmony", quietly = TRUE) &&
              "HarmonyMatrix" %in% getNamespaceExports("harmony")
            ) {
              quit(status = 0)
            } else {
              quit(status = 1)
            }
          '
          then

            echo "HarmonyMatrix already available."

          else

            echo "Installing Harmony 1.2.4..."

            curl \
              -L \
              --fail \
              --retry 5 \
              --retry-delay 2 \
              "https://cran.r-project.org/src/contrib/Archive/harmony/harmony_1.2.4.tar.gz" \
              -o harmony_1.2.4.tar.gz

            ls -lh harmony_1.2.4.tar.gz

            R CMD INSTALL \
              --no-multiarch \
              --with-keep.source \
              harmony_1.2.4.tar.gz

          fi

          Rscript - <<'EOF'

          if (
            !requireNamespace(
              "harmony",
              quietly = TRUE
            )
          ) {

            stop(
              "Harmony installation failed."
            )
          }

          if (
            !"HarmonyMatrix" %in%
            getNamespaceExports("harmony")
          ) {

            stop(
              "HarmonyMatrix is unavailable."
            )
          }

          cat(
            "Harmony ",
            as.character(
              packageVersion("harmony")
            ),
            " ready.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 14. scPred
      # ============================================================

      - name: Install scPred
        env:
          CXXFLAGS: "-std=gnu++14"
          PKG_CXXFLAGS: "-std=gnu++14"

        run: |

          echo "============================================================"
          echo "INSTALLING scPred"
          echo "============================================================"

          Rscript - <<'EOF'

          required <- c(
            "caret",
            "harmony",
            "ggbeeswarm",
            "MLmetrics",
            "kernlab",
            "pROC"
          )

          failed <- required[
            !vapply(
              required,
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ]

          if (
            length(failed) > 0
          ) {

            print(
              failed
            )

            stop(
              "scPred dependencies are missing."
            )
          }

          EOF

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            "https://github.com/powellgenomicslab/scPred/archive/refs/heads/master.tar.gz" \
            -o scPred.tar.gz

          ls -lh scPred.tar.gz

          R CMD INSTALL \
            --no-multiarch \
            --with-keep.source \
            scPred.tar.gz

          Rscript - <<'EOF'

          if (
            !requireNamespace(
              "scPred",
              quietly = TRUE
            )
          ) {

            stop(
              "scPred installation failed."
            )
          }

          cat(
            "scPred ",
            as.character(
              packageVersion("scPred")
            ),
            " installed successfully.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 15. scSorter 0.0.2
      #
      # CRITICAL:
      # NEVER use install.packages("scSorter")
      #
      # We install directly from the CRAN archive.
      # ============================================================

      - name: Install scSorter 0.0.2 from CRAN archive
        env:
          R_REMOTES_NO_ERRORS_FROM_WARNINGS: "true"

        run: |

          echo "============================================================"
          echo "INSTALLING scSorter 0.0.2"
          echo "============================================================"

          echo ""
          echo "Checking whether scSorter is already installed..."

          if Rscript -e '
            if (requireNamespace("scSorter", quietly = TRUE)) {
              cat(
                "scSorter already installed: ",
                as.character(packageVersion("scSorter")),
                "\n",
                sep = ""
              )
              quit(status = 0)
            } else {
              quit(status = 1)
            }
          '
          then

            echo "scSorter already available."

          else

            echo ""
            echo "scSorter is NOT installed."
            echo "Installing archived CRAN version 0.0.2."
            echo ""
            echo "IMPORTANT: install.packages() is NOT used."

            curl \
              -L \
              --fail \
              --retry 10 \
              --retry-delay 3 \
              "https://cran.r-project.org/src/contrib/Archive/scSorter/scSorter_0.0.2.tar.gz" \
              -o scSorter_0.0.2.tar.gz

            echo ""
            echo "Downloaded archive:"
            ls -lh scSorter_0.0.2.tar.gz

            echo ""
            echo "Archive type:"
            file scSorter_0.0.2.tar.gz

            echo ""
            echo "Installing with R CMD INSTALL..."

            R CMD INSTALL \
              --no-multiarch \
              --with-keep.source \
              scSorter_0.0.2.tar.gz

          fi

          echo ""
          echo "============================================================"
          echo "VERIFYING scSorter"
          echo "============================================================"

          Rscript - <<'EOF'

          if (
            !requireNamespace(
              "scSorter",
              quietly = TRUE
            )
          ) {

            stop(
              "scSorter installation failed."
            )
          }

          cat(
            "scSorter ",
            as.character(
              packageVersion("scSorter")
            ),
            " installed successfully.\n",
            sep = ""
          )

          cat(
            "Location: ",
            find.package("scSorter"),
            "\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 16. scCATCH
      # ============================================================

      - name: Install scCATCH
        run: |

          Rscript - <<'EOF'

          options(
            repos = c(
              CRAN = "https://cloud.r-project.org"
            )
          )

          if (
            !requireNamespace(
              "scCATCH",
              quietly = TRUE
            )
          ) {

            install.packages(
              "scCATCH",
              dependencies = c(
                "Depends",
                "Imports",
                "LinkingTo"
              )
            )
          }

          if (
            !requireNamespace(
              "scCATCH",
              quietly = TRUE
            )
          ) {

            stop(
              "scCATCH installation failed."
            )
          }

          cat(
            "scCATCH ",
            as.character(
              packageVersion("scCATCH")
            ),
            " ready.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 17. scmap
      # ============================================================

      - name: Install scmap
        run: |

          Rscript - <<'EOF'

          if (
            !requireNamespace(
              "scmap",
              quietly = TRUE
            )
          ) {

            BiocManager::install(
              "scmap",
              ask = FALSE,
              update = FALSE
            )
          }

          if (
            !requireNamespace(
              "scmap",
              quietly = TRUE
            )
          ) {

            stop(
              "scmap installation failed."
            )
          }

          cat(
            "scmap ",
            as.character(
              packageVersion("scmap")
            ),
            " ready.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 18. CelliD
      # ============================================================

      - name: Install CelliD
        env:
          CXXFLAGS: "-std=gnu++14"
          PKG_CXXFLAGS: "-std=gnu++14"
          MAKEFLAGS: "-j2"

        run: |

          echo "============================================================"
          echo "INSTALLING CelliD"
          echo "============================================================"

          cat "${HOME}/.R/Makevars"

          Rscript - <<'EOF'

          Sys.setenv(
            CXXFLAGS = "-std=gnu++14",
            PKG_CXXFLAGS = "-std=gnu++14"
          )

          if (
            !requireNamespace(
              "CelliD",
              quietly = TRUE
            )
          ) {

            BiocManager::install(
              "CelliD",
              ask = FALSE,
              update = FALSE,
              force = TRUE
            )
          }

          if (
            !requireNamespace(
              "CelliD",
              quietly = TRUE
            )
          ) {

            stop(
              "CelliD installation failed."
            )
          }

          cat(
            "CelliD ",
            as.character(
              packageVersion("CelliD")
            ),
            " installed successfully.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 19. CHETAH
      # ============================================================

      - name: Install CHETAH
        run: |

          Rscript - <<'EOF'

          if (
            !requireNamespace(
              "CHETAH",
              quietly = TRUE
            )
          ) {

            BiocManager::install(
              "CHETAH",
              ask = FALSE,
              update = FALSE
            )
          }

          if (
            !requireNamespace(
              "CHETAH",
              quietly = TRUE
            )
          ) {

            stop(
              "CHETAH installation failed."
            )
          }

          cat(
            "CHETAH ",
            as.character(
              packageVersion("CHETAH")
            ),
            " ready.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 20. SCINA 1.2.0
      # ============================================================

      - name: Install SCINA 1.2.0
        run: |

          echo "============================================================"
          echo "INSTALLING SCINA 1.2.0"
          echo "============================================================"

          if Rscript -e '
            if (requireNamespace("SCINA", quietly = TRUE)) {
              cat("SCINA already installed.\n")
              quit(status = 0)
            } else {
              quit(status = 1)
            }
          '
          then

            echo "SCINA already available."

          else

            curl \
              -L \
              --fail \
              --retry 10 \
              --retry-delay 3 \
              "https://cran.r-project.org/src/contrib/Archive/SCINA/SCINA_1.2.0.tar.gz" \
              -o SCINA_1.2.0.tar.gz

            ls -lh SCINA_1.2.0.tar.gz

            R CMD INSTALL \
              --no-multiarch \
              --with-keep.source \
              SCINA_1.2.0.tar.gz

          fi

          Rscript - <<'EOF'

          if (
            !requireNamespace(
              "SCINA",
              quietly = TRUE
            )
          ) {

            stop(
              "SCINA installation failed."
            )
          }

          cat(
            "SCINA ",
            as.character(
              packageVersion("SCINA")
            ),
            " ready.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 21. scibetR
      # ============================================================

      - name: Install scibetR
        run: |

          echo "============================================================"
          echo "INSTALLING scibetR"
          echo "============================================================"

          if Rscript -e '
            if (requireNamespace("scibetR", quietly = TRUE)) {
              cat("scibetR already installed.\n")
              quit(status = 0)
            } else {
              quit(status = 1)
            }
          '
          then

            echo "scibetR already available."

          else

            curl \
              -L \
              --fail \
              --retry 10 \
              --retry-delay 3 \
              "https://github.com/zwj-tina/scibetR/archive/refs/heads/master.tar.gz" \
              -o scibetR.tar.gz

            ls -lh scibetR.tar.gz

            R CMD INSTALL \
              --no-multiarch \
              --with-keep.source \
              scibetR.tar.gz

          fi

          Rscript - <<'EOF'

          if (
            !requireNamespace(
              "scibetR",
              quietly = TRUE
            )
          ) {

            stop(
              "scibetR installation failed."
            )
          }

          cat(
            "scibetR ",
            as.character(
              packageVersion("scibetR")
            ),
            " ready.\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 22. FINAL DEPENDENCY CHECK
      # ============================================================

      - name: Verify all scAnnoX dependencies
        run: |

          echo "============================================================"
          echo "FINAL scAnnoX DEPENDENCY CHECK"
          echo "============================================================"

          Rscript - <<'EOF'

          required <- c(
            "Seurat",
            "SeuratObject",
            "SingleCellExperiment",
            "SingleR",
            "celldex",
            "scuttle",
            "scPred",
            "scSorter",
            "scCATCH",
            "SCINA",
            "scmap",
            "CelliD",
            "CHETAH",
            "scibetR"
          )

          failed <- character(0)

          for (
            pkg in required
          ) {

            if (
              requireNamespace(
                pkg,
                quietly = TRUE
              )
            ) {

              cat(
                "OK       ",
                pkg,
                " ",
                as.character(
                  packageVersion(pkg)
                ),
                "\n",
                sep = ""
              )

            } else {

              cat(
                "FAILED   ",
                pkg,
                "\n",
                sep = ""
              )

              failed <- c(
                failed,
                pkg
              )
            }
          }

          if (
            length(failed) > 0
          ) {

            cat(
              "\nMissing packages:\n"
            )

            print(
              failed
            )

            stop(
              "scAnnoX dependencies are incomplete."
            )
          }

          cat(
            "\nAll scAnnoX dependencies are available.\n"
          )

          EOF


      # ============================================================
      # 23. VERIFY scSorter
      # ============================================================

      - name: Verify scSorter before scAnnoX
        run: |

          echo "============================================================"
          echo "FINAL scSorter CHECK"
          echo "============================================================"

          Rscript - <<'EOF'

          if (
            !requireNamespace(
              "scSorter",
              quietly = TRUE
            )
          ) {

            stop(
              "scSorter is unavailable before scAnnoX installation."
            )
          }

          cat(
            "scSorter available: ",
            as.character(
              packageVersion("scSorter")
            ),
            "\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 24. VERIFY LOCAL scAnnoX SOURCE
      # ============================================================

      - name: Verify local scAnnoX source
        run: |

          echo "============================================================"
          echo "CHECKING LOCAL scAnnoX"
          echo "============================================================"

          SCANNOX_PATH="files/external/scAnnoX"

          if [ ! -f "${SCANNOX_PATH}/DESCRIPTION" ]; then

            echo ""
            echo "ERROR:"
            echo "${SCANNOX_PATH}/DESCRIPTION does not exist."

            echo ""
            echo "Searching repository for DESCRIPTION files:"

            find . \
              -type f \
              -name "DESCRIPTION" \
              | sort \
              || true

            exit 1

          fi

          echo ""
          echo "scAnnoX source:"
          echo "${SCANNOX_PATH}"

          echo ""
          echo "DESCRIPTION:"
          cat "${SCANNOX_PATH}/DESCRIPTION"


      # ============================================================
      # 25. INSTALL LOCAL MODIFIED scAnnoX
      # ============================================================

      - name: Install local modified scAnnoX
        run: |

          echo "============================================================"
          echo "INSTALLING LOCAL MODIFIED scAnnoX"
          echo "============================================================"

          R CMD INSTALL \
            --no-multiarch \
            --with-keep.source \
            files/external/scAnnoX

          echo ""
          echo "Verifying scAnnoX..."

          Rscript - <<'EOF'

          if (
            !requireNamespace(
              "scAnnoX",
              quietly = TRUE
            )
          ) {

            stop(
              "scAnnoX installation failed."
            )
          }

          cat(
            "scAnnoX ",
            as.character(
              packageVersion("scAnnoX")
            ),
            " installed successfully.\n",
            sep = ""
          )

          cat(
            "Location: ",
            find.package("scAnnoX"),
            "\n",
            sep = ""
          )

          EOF


      # ============================================================
      # 26. VERIFY scAnnoX FUNCTIONS
      # ============================================================

      - name: Verify scAnnoX functions
        run: |

          Rscript - <<'EOF'

          library(scAnnoX)

          expected <- c(
            "annoResult",
            "autoAnnoTools",
            "findMarkerToolsForSc",
            "findMarkersBySeurat",
            "listToolMethods",
            "multipleProcess",
            "sccatchAnno",
            "sciBetAnno",
            "scinaAnno",
            "scmapAnno",
            "scsorterAnno",
            "sctypeAnno",
            "seuratAnno",
            "singleRAnno"
          )

          failed <- character(0)

          for (
            fun in expected
          ) {

            if (
              exists(
                fun,
                where = asNamespace("scAnnoX"),
                inherits = FALSE
              )
            ) {

              cat(
                "OK       ",
                fun,
                "\n",
                sep = ""
              )

            } else {

              cat(
                "FAILED   ",
                fun,
                "\n",
                sep = ""
              )

              failed <- c(
                failed,
                fun
              )
            }
          }

          if (
            length(failed) > 0
          ) {

            print(
              failed
            )

            stop(
              "scAnnoX function verification failed."
            )
          }

          cat(
            "\nAll expected scAnnoX functions are available.\n"
          )

          cat(
            "\nAvailable annotation methods:\n"
          )

          print(
            listToolMethods()
          )

          EOF


      # ============================================================
      # 27. CHECK EXISTING INTEGRATED OBJECT
      #
      # IMPORTANT:
      # Scripts 01-07 are NOT executed.
      # ============================================================

      - name: Check integrated object
        run: |

          echo "============================================================"
          echo "CHECKING 05_integrated.rds"
          echo "============================================================"

          OBJECT="results/objects/05_integrated.rds"

          if [ ! -f "${OBJECT}" ]; then

            echo ""
            echo "ERROR:"
            echo "${OBJECT} not found."

            echo ""
            echo "Available RDS files:"

            find results \
              -type f \
              \( \
                -name "*.rds" \
                -o \
                -name "*.RDS" \
              \) \
              | sort \
              || true

            exit 1

          fi

          echo ""
          echo "Object found:"
          ls -lh "${OBJECT}"

          echo ""
          echo "Testing object..."

          Rscript - <<'EOF'

          library(Seurat)

          obj <- readRDS(
            "results/objects/05_integrated.rds"
          )

          cat(
            "Class:\n"
          )

          print(
            class(obj)
          )

          if (
            !inherits(
              obj,
              "Seurat"
            )
          ) {

            stop(
              "05_integrated.rds is not a Seurat object."
            )
          }

          cat(
            "\nCells: ",
            ncol(obj),
            "\n",
            sep = ""
          )

          cat(
            "Features: ",
            nrow(obj),
            "\n",
            sep = ""
          )

          cat(
            "\nAssays:\n"
          )

          print(
            Assays(obj)
          )

          cat(
            "\nReductions:\n"
          )

          print(
            Reductions(obj)
          )

          cat(
            "\nIntegrated object is readable.\n"
          )

          EOF



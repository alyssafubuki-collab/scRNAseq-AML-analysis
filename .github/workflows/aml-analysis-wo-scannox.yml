name: AML scRNA-seq full analysis w-o scAnnoX

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  scrnaseq-analysis:

    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. SETUP R
      # ==========================================================

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true

      # ==========================================================
      # 3. SYSTEM DEPENDENCIES
      # ==========================================================

      - name: Install system dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libgit2-dev \
            libglpk-dev \
            libhdf5-dev

      # ==========================================================
      # 4. CHECK R
      # ==========================================================

      - name: Check R installation
        run: |
          set -euo pipefail

          echo "===== R VERSION ====="
          R --version

          echo "===== RSCRIPT VERSION ====="
          Rscript --version

          echo "===== R LIBRARY PATHS ====="
          Rscript -e 'print(.libPaths())'

      # ==========================================================
      # 5. CREATE OUTPUT DIRECTORIES
      # ==========================================================

      - name: Create project directories
        run: |
          set -euo pipefail

          mkdir -p \
            data/GSE145410 \
            figures/qc \
            figures/integration \
            figures/annotation \
            figures/differential_expression \
            results/qc \
            results/annotation \
            results/differential_expression \
            results/objects \
            environment

      # ==========================================================
      # 6. VALIDATE INSTALLATION SCRIPT
      # ==========================================================

      - name: Validate 00_install_packages.R
        run: |
          set -euo pipefail

          echo "===== FILE ====="
          ls -lah scripts/00_install_packages.R

          echo "===== SCRIPT CONTENT ====="
          nl -ba scripts/00_install_packages.R

          echo "===== R PARSE TEST ====="

          Rscript -e '
            parse(
              file = "scripts/00_install_packages.R"
            )

            cat("R PARSE: OK\n")
          '

      # ==========================================================
      # 7. INSTALL PACKAGES
      # ==========================================================

      - name: Install R packages
        run: |
          set -euo pipefail

          Rscript scripts/00_install_packages.R

      # ==========================================================
      # 8. DOWNLOAD GEO DATA
      # ==========================================================

      - name: Download GSE145410
        run: |
          set -euo pipefail

          Rscript scripts/01_download_GSE145410.R

      # ==========================================================
      # 9. IMPORT + QC
      # ==========================================================

      - name: Import data and perform adaptive QC
        run: |
          set -euo pipefail

          Rscript scripts/02_import_and_QC.R

      # ==========================================================
      # 10. NORMALIZATION + HVG
      # ==========================================================

      - name: Normalize and select HVGs
        run: |
          set -euo pipefail

          Rscript scripts/03_normalization_HVG.R

      # ==========================================================
      # 11. PCA + CLUSTERING + UMAP
      # ==========================================================

      - name: PCA clustering and UMAP
        run: |
          set -euo pipefail

          Rscript scripts/04_PCA_clustering_UMAP.R

      # ==========================================================
      # 12. SEURAT v5 CCA INTEGRATION
      # ==========================================================

      - name: Seurat v5 CCA integration
        run: |
          set -euo pipefail

          Rscript scripts/05_Seurat5_integration.R

      # ==========================================================
      # 13. SINGLER
      # ==========================================================

      - name: SingleR annotation
        run: |
          set -euo pipefail

          Rscript scripts/06_annotation_SingleR.R

      # ==========================================================
      # 14. SCPRED
      # ==========================================================

      - name: scPred annotation
        run: |
          set -euo pipefail

          Rscript scripts/07_annotation_scPred.R

      # ==========================================================
      # 15. CONSENSUS
      # ==========================================================

      - name: SingleR + scPred consensus
        run: |
          set -euo pipefail

          Rscript scripts/08b_consensus_annotation.R

      # ==========================================================
      # 16. DIFFERENTIAL EXPRESSION
      # ==========================================================

      - name: Differential expression
        run: |
          set -euo pipefail

          Rscript scripts/09b_differential_expression.R

      # ==========================================================
      # 17. FINAL FIGURES
      # ==========================================================

      - name: Final figures
        run: |
          set -euo pipefail

          Rscript scripts/10b_final_figures.R

      # ==========================================================
      # 18. SESSION INFO
      # ==========================================================

      - name: Save session information
        run: |
          set -euo pipefail

          Rscript -e '
            writeLines(
              capture.output(sessionInfo()),
              "environment/sessionInfo_GitHubActions.txt"
            )
          '

      # ==========================================================
      # 19. CHECK RESULTS
      # ==========================================================

      - name: Check analysis outputs
        run: |
          set -euo pipefail

          echo "===== OBJECTS ====="
          find results/objects -type f | sort || true

          echo "===== QC ====="
          find results/qc -type f | sort || true

          echo "===== ANNOTATION ====="
          find results/annotation -type f | sort || true

          echo "===== DIFFERENTIAL EXPRESSION ====="
          find results/differential_expression -type f | sort || true

          echo "===== FIGURES ====="
          find figures -type f | sort || true

      # ==========================================================
      # 20. UPLOAD RESULTS
      # ==========================================================

      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        with:
          name: AML-scRNAseq-analysis-results
          path: |
            results/
            figures/
            environment/
          if-no-files-found: warn
          retention-days: 30
